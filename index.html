<title>Forge — Build your life</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{--ink:#26231E;--sub:#8A8377;--cream:#F6F2E9;--paper:#FBF8F1;--accent:#23493A;--accent-2:#173026;--gold:#B4925A;--line:rgba(38,35,30,.07);}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
html,body{height:100%;}
body{font-family:'DM Sans',system-ui,sans-serif;color:var(--ink);background:#E9E4D8;display:flex;justify-content:center;-webkit-font-smoothing:antialiased;}
.serif{font-family:'Fraunces',Georgia,serif;}
#app{width:100%;max-width:480px;min-height:100vh;background:var(--cream);display:flex;flex-direction:column;position:relative;overflow:hidden;}
@media(min-width:520px){#app{box-shadow:0 0 60px rgba(38,35,30,.12);}}
header{padding:18px 20px 14px;display:flex;align-items:center;gap:12px;border-bottom:1px solid rgba(180,146,90,.22);}
.logo{width:42px;height:42px;border-radius:13px;background:var(--paper);display:flex;align-items:center;justify-content:center;color:var(--accent);font-family:'Fraunces',serif;font-weight:700;font-size:25px;line-height:1;border:1.5px solid var(--gold);box-shadow:0 4px 12px rgba(38,35,30,.1);flex-shrink:0;}
.htext{flex:1;}
.htext h1{font-family:'Fraunces',serif;font-size:23px;font-weight:600;line-height:1;}
.htext span{font-size:11px;color:var(--sub);letter-spacing:.1em;text-transform:uppercase;display:block;margin-top:4px;}
.pill{display:flex;align-items:center;gap:8px;padding:7px 12px;border-radius:30px;background:var(--paper);border:1px solid var(--line);cursor:pointer;transition:background .2s;}
.pill:hover{background:rgba(38,35,30,.05);}
.pill .av{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#23493A,#B4925A);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;}
.pill .nm{font-size:13.5px;font-weight:600;}
.back{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;margin-left:-6px;transition:background .18s,transform .18s;}
.back:hover{background:rgba(38,35,30,.06);}.back:active{transform:scale(.9);}
#stage{flex:1;overflow-y:auto;padding:4px 18px 30px;}
#stage::-webkit-scrollbar{width:0;}
.feature{border-radius:26px;padding:20px;margin-bottom:14px;cursor:pointer;background:linear-gradient(135deg,#23493A,#173026);color:var(--cream);box-shadow:0 8px 22px rgba(23,48,38,.3);transition:transform .28s cubic-bezier(.2,.8,.2,1),box-shadow .28s;}
.feature:hover{transform:translateY(-4px);box-shadow:0 14px 30px rgba(23,48,38,.38);}
.feature .lbl{display:flex;align-items:center;gap:8px;font-size:12px;opacity:.9;letter-spacing:.06em;text-transform:uppercase;}
.feature h2{font-family:'Fraunces',serif;font-size:22px;font-weight:600;margin-top:8px;}
.feature p{font-size:13.5px;opacity:.88;margin-top:4px;}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px;}
.tile{border-radius:24px;padding:18px;min-height:132px;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 2px 6px rgba(38,35,30,.05);transition:transform .28s cubic-bezier(.2,.8,.2,1),box-shadow .28s;}
.tile:hover{transform:translateY(-4px);box-shadow:0 14px 30px rgba(38,35,30,.1);}
.tile:active{transform:translateY(-1px) scale(.99);}
.tile .chip{width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 3px 8px rgba(38,35,30,.12);}
.tile .t{font-weight:700;font-size:16.5px;}
.tile .s{font-size:12px;color:rgba(38,35,30,.55);margin-top:2px;}
.reqbtn{margin-top:18px;width:100%;padding:15px;border:1.5px dashed rgba(38,35,30,.2);border-radius:20px;background:transparent;color:var(--sub);font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:border-color .2s,color .2s;}
.reqbtn:hover{border-color:var(--accent);color:var(--accent);}
.card{background:var(--paper);border-radius:22px;padding:18px;border:1px solid var(--line);box-shadow:0 1px 3px rgba(38,35,30,.04);}
.stack{display:grid;gap:14px;}
.ctitle{font-size:12px;font-weight:600;color:var(--sub);letter-spacing:.06em;text-transform:uppercase;margin:2px 2px 12px;}
.row{display:flex;align-items:center;gap:12px;padding:12px 8px;border-radius:12px;transition:background .18s;}
.row:hover{background:rgba(38,35,30,.035);}
.dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.row .rt{font-weight:600;font-size:15px;}.row .rs{font-size:12.5px;color:var(--sub);margin-top:1px;}
.dark{background:var(--ink);color:var(--cream);}
.dark .small{font-size:13px;opacity:.7;}.dark h2{font-family:'Fraunces',serif;font-size:30px;font-weight:600;margin-top:2px;}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.stat .k{display:flex;align-items:center;gap:7px;color:var(--sub);font-size:12px;margin-bottom:8px;}
.stat .v{font-weight:700;font-size:22px;}.stat .d{font-size:12px;color:var(--sub);margin-top:2px;}
.checkbox{width:20px;height:20px;border-radius:6px;border:2px solid rgba(38,35,30,.2);flex-shrink:0;}
.circlebox{width:20px;height:20px;border-radius:50%;border:2px solid rgba(38,35,30,.2);flex-shrink:0;}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center;}
.cal .h{font-size:11px;color:var(--sub);font-weight:600;padding-bottom:4px;}
.cal .cell{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:12px;font-size:13px;font-weight:500;}
.cal .today{background:var(--accent);color:#fff;font-weight:700;}
.evdot{width:4px;height:4px;border-radius:50%;background:var(--accent);margin-top:2px;}
.bar{height:8px;border-radius:8px;background:rgba(38,35,30,.07);overflow:hidden;}
.bar>div{height:100%;border-radius:8px;}
.fab{position:absolute;bottom:24px;right:22px;width:56px;height:56px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(35,73,58,.4);cursor:pointer;border:none;transition:transform .2s cubic-bezier(.2,.8,.2,1),box-shadow .2s;}
.fab:hover{transform:translateY(-2px) rotate(90deg);box-shadow:0 10px 26px rgba(35,73,58,.5);}
.overlay{position:absolute;inset:0;background:rgba(38,35,30,.4);display:flex;align-items:flex-end;justify-content:center;z-index:50;animation:fade .25s ease;}
.sheet{width:100%;background:var(--cream);border-radius:26px 26px 0 0;padding:24px 22px 30px;animation:up .32s cubic-bezier(.2,.85,.25,1);}
.sheet h3{font-family:'Fraunces',serif;font-size:20px;font-weight:600;}
.sheet p{font-size:13.5px;color:var(--sub);margin-top:4px;margin-bottom:14px;}
.sheet textarea{width:100%;min-height:96px;border:1px solid var(--line);border-radius:14px;padding:12px;font-family:'DM Sans',sans-serif;font-size:14.5px;resize:none;background:var(--paper);color:var(--ink);}
.sheet textarea:focus{outline:none;border-color:var(--accent);}
.sheet input{width:100%;border:1px solid var(--line);border-radius:14px;padding:13px 14px;font-family:'DM Sans',sans-serif;font-size:15px;background:var(--paper);color:var(--ink);margin-bottom:10px;}
.sheet input:focus{outline:none;border-color:var(--accent);}
.btnrow{display:flex;gap:10px;margin-top:14px;}
.btn{flex:1;padding:14px;border-radius:14px;border:none;font-family:'DM Sans',sans-serif;font-size:15px;font-weight:600;cursor:pointer;}
.btn-primary{background:var(--accent);color:#fff;}.btn-ghost{background:rgba(38,35,30,.07);color:var(--ink);}
.done{text-align:center;padding:10px 0 4px;}
.done .tick{width:54px;height:54px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;}
.badge{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:3px 9px;border-radius:20px;background:rgba(35,73,58,.1);color:var(--accent);}
.uav{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#23493A,#B4925A);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex-shrink:0;}
.lock{position:absolute;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--cream);background:radial-gradient(125% 95% at 50% 18%,#2C5A46 0%,#1B3A2C 55%,#112317 100%);overflow:hidden;}
.lock::after{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(125% 125% at 50% 45%,transparent 52%,rgba(0,0,0,.4) 100%);}
.lock.hide{animation:lift .65s cubic-bezier(.6,0,.2,1) forwards;}
@keyframes lift{to{opacity:0;transform:translateY(-26px);visibility:hidden;}}
.glow{position:absolute;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,rgba(180,146,90,.22),transparent 65%);filter:blur(6px);animation:pulse 4.5s ease-in-out infinite;}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.65;}50%{transform:scale(1.14);opacity:1;}}
.intro-mark{width:96px;height:96px;border-radius:26px;border:2px solid var(--gold);background:rgba(246,242,233,.04);display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-weight:600;font-size:58px;color:var(--cream);line-height:1;box-shadow:0 24px 60px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.08);opacity:0;animation:markIn 1.1s cubic-bezier(.2,.8,.2,1) .15s forwards;position:relative;z-index:2;}
@keyframes markIn{from{opacity:0;transform:scale(.7) translateY(10px);}to{opacity:1;transform:none;}}
.intro-word{margin-top:28px;font-family:'Fraunces',serif;font-size:30px;font-weight:500;letter-spacing:.4em;padding-left:.4em;color:var(--cream);position:relative;z-index:2;text-align:center;}
.intro-word span{display:inline-block;opacity:0;animation:letterIn .6s cubic-bezier(.2,.8,.2,1) forwards;}
@keyframes letterIn{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:none;}}
.intro-rule{width:0;height:1px;background:var(--gold);margin:22px 0 16px;opacity:.85;animation:rule 1s ease 1.15s forwards;position:relative;z-index:2;}
@keyframes rule{to{width:120px;}}
.intro-tag{font-size:11px;letter-spacing:.42em;padding-left:.42em;color:var(--gold);text-transform:uppercase;opacity:0;animation:fadein .9s ease 1.55s forwards;position:relative;z-index:2;}
@keyframes fadein{to{opacity:1;}}
.pin-wrap{width:100%;max-width:300px;display:flex;flex-direction:column;align-items:center;position:relative;z-index:2;padding:0 22px;}
.pin-logo{width:54px;height:54px;border-radius:16px;border:1.5px solid var(--gold);display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-weight:600;font-size:30px;color:var(--cream);margin-bottom:22px;line-height:1;}
.pin-title{font-family:'Fraunces',serif;font-size:22px;font-weight:500;margin-bottom:6px;}
.pin-sub{font-size:13px;color:rgba(246,242,233,.6);margin-bottom:26px;text-align:center;}
.dots{display:flex;gap:16px;margin-bottom:36px;}
.dot-pin{width:14px;height:14px;border-radius:50%;border:1.5px solid rgba(246,242,233,.5);transition:all .2s;}
.dot-pin.on{background:var(--gold);border-color:var(--gold);transform:scale(1.12);}
.dots.err{animation:shake .42s;}
@keyframes shake{0%,100%{transform:translateX(0);}20%,60%{transform:translateX(-9px);}40%,80%{transform:translateX(9px);}}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;width:100%;}
.key{height:68px;border-radius:50%;background:rgba(246,242,233,.06);border:1px solid rgba(246,242,233,.12);color:var(--cream);font-family:'DM Sans',sans-serif;font-size:26px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .12s,background .15s;-webkit-user-select:none;user-select:none;}
.key:active{transform:scale(.92);background:rgba(246,242,233,.18);}
.key.blank{background:transparent;border:none;cursor:default;}
.key.fn{font-size:14px;letter-spacing:.03em;color:rgba(246,242,233,.7);background:transparent;border:none;}
.pin-reset{margin-top:26px;font-size:12px;color:rgba(246,242,233,.45);letter-spacing:.03em;background:none;border:none;cursor:pointer;}
@keyframes fade{from{opacity:0;transform:scale(.99);}to{opacity:1;transform:none;}}
@keyframes up{from{transform:translateY(100%);}to{transform:none;}}
@keyframes slidein{from{opacity:0;transform:translateX(26px);}to{opacity:1;transform:none;}}
@keyframes stag{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
.anim-home{animation:fade .4s ease both;}
.anim-section{animation:slidein .42s cubic-bezier(.2,.85,.25,1) both;}
.anim-section .card,.anim-section .feature,.anim-section .two{animation:stag .5s cubic-bezier(.2,.8,.2,1) both;}
svg{display:block;}
</style>
</head>

/* ---- tabs ---- */

/* ---- helpers ---- */
function listCard(title,accent,items,right){
  return '<div class="card"><div class="ctitle">'+title+'</div>'+
    items.map(function(it){return '<div class="row"><span class="dot" style="background:'+accent+'"></span>'+
      '<div style="flex:1"><div class="rt">'+it.t+'</div>'+(it.s?'<div class="rs">'+it.s+'</div>':'')+
      '</div>'+(right||'')+'</div>';}).join('')+'</div>';
}
function ring(pct,color,value,label){
  var r=27,c=2*Math.PI*r;
  return '<div style="display:flex;flex-direction:column;align-items:center;gap:6px">'+
    '<svg width="64" height="64" style="transform:rotate(-90deg)">'+
    '<circle cx="32" cy="32" r="'+r+'" fill="none" stroke="rgba(38,35,30,.08)" stroke-width="8"/>'+
    '<circle cx="32" cy="32" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="8" stroke-linecap="round" stroke-dasharray="'+c+'" stroke-dashoffset="'+(c-c*pct/100)+'"/></svg>'+
    '<div style="text-align:center;margin-top:-2px"><div style="font-weight:700;font-size:15px">'+value+'</div>'+
    '<div style="font-size:11px;color:var(--sub)">'+label+'</div></div></div>';
}

/* ---- views ---- */
const VIEWS={
  today:function(){
    var h=new Date().getHours();
    var greet=h<12?'Good morning':h<18?'Good afternoon':'Good evening';
    var dateStr=new Date().toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'});
    var tasks=store.work.length,rem=store.reminders.length,habits=store.goals.length;
    var attention=[].concat(
      store.reminders.slice(0,2).map(function(x){return {t:x.t,s:'Reminder · '+(x.s||''),c:'#7A72A8'};}),
      store.work.slice(0,2).map(function(x){return {t:x.t,s:'Task · '+(x.s||''),c:'#5B7894'};})).slice(0,4);

      '<div class="card dark"><div class="small">'+dateStr+'</div>'+
        '<div class="serif" style="font-size:26px;font-weight:600;margin-top:2px">'+greet+(currentUser?', '+currentUser.name.split(' ')[0]:'')+'</div>'+
        '<div style="font-size:14px;opacity:.82;margin-top:6px">'+tasks+' task'+(tasks!==1?'s':'')+' · '+rem+' reminder'+(rem!==1?'s':'')+' · '+habits+' habits on track</div></div>'+
      '<div class="two">'+
        '<div class="card stat"><div class="k">'+icon('wallet',14)+' Balance</div><div class="v">$4,820</div><div class="d" style="color:#5E8C61">+$210 this week</div></div>'+
        '<div class="card stat"><div class="k">'+icon('flame',14)+' Streaks</div><div class="v">12 days</div><div class="d">Workout · Reading</div></div>'+
      '</div>'+
      '<div class="card"><div class="ctitle">Needs your attention</div>'+

  },

  },
  work:function(){return '<div class="stack">'+listCard('In progress','#5B7894',store.work,icon('check',16))+'</div>';},

  },
  finances:function(){
    var START=new Date(2026,4,18),DEPARTURE=new Date(2026,10,29);
    var BONDS=4420,PROJ_GBP=18254.24,TOTAL_GBP=22674.24;
    var M=[
      {d:'31/05/26',a:111.02,g:58.92},{d:'14/06/26',a:823.29,g:436.92},
      {d:'28/06/26',a:1281.35,g:680.01},{d:'12/07/26',a:1987.35,g:1054.69},

    var BILLS=[
      {n:'UK Phone',day:6},{n:'Loan',day:6},{n:'WiFi',day:12},
      {n:'Aus Phone',day:14},{n:'Insurance',day:26},{n:'Apple',day:27},

    var SPEND=[

      {n:'Gym',a:1197,c:'#5E8C61'},{n:'Electricity',a:575,c:'#B9A23F'},
    ];
    function pd(s){var p=s.split('/');return new Date(2000+Number(p[2]),Number(p[1])-1,Number(p[0]));}
    function gbp(v){return '&#163;'+Number(v).toLocaleString('en-GB',{maximumFractionDigits:0});}
    function aud(v){return 'A$'+Number(v).toLocaleString('en-AU',{maximumFractionDigits:0});}
    var now=new Date();
    var wLeft=Math.floor(Math.max(0,Math.round((DEPARTURE-now)/86400000))/7);
    var totalMs=DEPARTURE-START,elapsedMs=now-START;
    var timePct=Math.min(100,Math.max(0,Math.round(elapsedMs/totalMs*100)));
    var prevM=null,nextM=null,i;
    for(i=0;i<M.length;i++){if(pd(M[i].d)<=now)prevM=M[i];else{nextM=M[i];break;}}
    if(!nextM)nextM=M[M.length-1];
    var pDt=prevM?pd(prevM.d):START,nDt=pd(nextM.d);
    var segPct=Math.min(100,Math.max(0,Math.round((now-pDt)/(nDt-pDt)*100)));
    var balKey='forge.finance.bal.'+(currentUser?currentUser.id:'x');
    var savedBal=lsGet(balKey);
    var actAud=savedBal!==null?Number(savedBal):null;
    var projNow=(prevM?prevM.a:0)+(nextM.a-(prevM?prevM.a:0))*segPct/100;
    var diff=actAud!==null?actAud-projNow:null;
    var todayD=now.getDate();
    var upcoming=BILLS.slice().sort(function(a,b){return a.day-b.day;}).filter(function(b){return b.day>=todayD;}).slice(0,4);
    function suf(n){var v=n%100;var s=['th','st','nd','rd'];return s[(v-20)%10]||s[v]||s[0];}
    var nDtStr=nDt.toLocaleDateString('en-GB',{day:'numeric',month:'short'});

    return '<div class="stack">'+
      '<div class="card" style="background:linear-gradient(135deg,#23493A,#173026);color:var(--cream);padding:22px">'+

          '<div style="width:'+timePct+'%;height:100%;background:var(--gold);border-radius:6px"></div></div>'+

        '</div></div>'+
      '<div class="card"><div class="ctitle">Next milestone</div>'+
        '<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px">'+
          '<div><div style="font-weight:700;font-size:22px;color:var(--ink)">'+gbp(nextM.g)+'</div>'+
            '<div style="font-size:12px;color:var(--sub);margin-top:2px">by '+nDtStr+'</div></div>'+
          prevMHtml+
        '</div>'+
        '<div class="bar"><div style="width:'+segPct+'%;background:var(--accent)"></div></div>'+
        '<div style="display:flex;justify-content:space-between;font-size:11.5px;color:var(--sub);margin-top:5px">'+
          '<span>'+segPct+'% of this fortnight</span>'+diffHtml+'</div></div>'+
      '<div class="card" style="display:flex;align-items:center;gap:12px">'+
        '<div style="flex:1">'+balHtml+'</div>'+
        '<button onclick="updateFinBal()" style="padding:10px 16px;background:var(--accent);color:#fff;border:none;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit">'+(actAud!==null?'Update':'Log')+'</button></div>'+
      '<div class="card"><div class="ctitle">Big payout events coming</div>'+
        '<div class="row"><div style="width:42px;height:42px;border-radius:13px;background:rgba(35,73,58,.09);display:flex;align-items:center;justify-content:center;font-size:18px">&#128176;</div><div style="flex:1"><div class="rt">Tax refund</div><div class="rs">Week of 13–19 Jul · A$3,300 incoming</div></div></div>'+
        '<div class="row"><div style="width:42px;height:42px;border-radius:13px;background:rgba(35,73,58,.09);display:flex;align-items:center;justify-content:center;font-size:18px">&#128184;</div><div style="flex:1"><div class="rt">Work payback</div><div class="rs">Week of 2–8 Nov · A$4,250 incoming</div></div></div>'+
        '<div class="row"><div style="width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,#23493A,#B4925A);display:flex;align-items:center;justify-content:center;font-size:20px">&#127881;</div><div style="flex:1"><div class="rt">Super + Tax + Payback</div><div class="rs">Week of 9–15 Nov · A$9,900 — the big one</div></div></div>'+
        '<div style="margin-top:10px;padding:10px 12px;background:rgba(181,104,124,.07);border-radius:12px;font-size:12.5px;color:var(--sub)">&#9888;&#65039; <strong style="color:var(--ink)">Watch:</strong> 28 Sep–4 Oct goes negative (A$228 deficit — A$800 Wants budgeted)</div></div>'+
      '<div class="card"><div class="ctitle">Where the money goes</div>'+
        '<div style="display:grid;gap:11px;padding-top:2px">'+
          SPEND.map(function(s){return '<div><div style="display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:5px"><span style="font-weight:600">'+s.n+'</span><span style="color:var(--sub)">'+aud(s.a)+'</span></div><div class="bar"><div style="width:'+(s.a/SPEND[0].a*100)+'%;background:'+s.c+'"></div></div></div>';}).join('')+
        '</div></div>'+
      '<div class="card"><div class="ctitle">Bills this month</div>'+
        (upcoming.length?upcoming.map(function(b){return '<div class="row"><div style="width:36px;height:36px;border-radius:10px;background:#F3E2DA;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#C2724F">'+b.day+'</div><div style="flex:1"><div class="rt">'+b.n+'</div></div><div style="font-size:12px;color:var(--sub)">'+b.day+suf(b.day)+'</div></div>';}).join(''):'<div class="row"><div class="rs">No more bills this month</div></div>')+
      '</div></div>';
  },
  calendar:function(){
    var cells='';
    for(var i=0;i<35;i++){var n=i-3;var on=n===29;var ev=[12,18,29].indexOf(n)>=0;
      cells+='<div class="cell'+(on?' today':'')+(n>0&&n<=31?'':' style="visibility:hidden"')+'" style="color:'+(on?'#fff':(n>0&&n<=31?'var(--ink)':'transparent'))+'">'+(n>0&&n<=31?n:'')+(ev&&!on?'<span class="evdot"></span>':'')+'</div>';}
    return '<div class="stack">'+
      '<div class="card"><div class="serif" style="font-size:18px;font-weight:600;margin-bottom:14px">May 2026</div>'+
        '<div class="cal">'+['M','T','W','T','F','S','S'].map(function(d){return '<div class="h">'+d+'</div>';}).join('')+cells+'</div></div>'+
      listCard('Today','#C2724F',[{t:'Team stand-up',s:'9:00 – 9:30am'},{t:'Lunch with Sam',s:'12:30pm · Cafe Luna'},{t:'Leg day',s:'6:00pm · Gym'}],icon('clock',15))+'</div>';
  },
  contacts:function(){
    var b=[['Mum','2 Jun','in 4 days'],['Jordan','11 Jun','in 13 days'],['Aunty Lou','24 Jun','in 26 days']];
    return '<div class="stack"><div class="card"><div class="ctitle">Upcoming birthdays</div>'+
      b.map(function(x){return '<div class="row"><div style="width:38px;height:38px;border-radius:50%;background:#EDE3F0;color:#9466A5;display:flex;align-items:center;justify-content:center">'+icon('cake',17)+'</div>'+
        '<div style="flex:1"><div class="rt">'+x[0]+'</div><div class="rs">'+x[1]+'</div></div><div style="font-size:12px;color:var(--sub)">'+x[2]+'</div></div>';}).join('')+
      '</div></div>';
  },
  travel:function(){
    return '<div class="stack">'+
      '<div class="card" style="background:linear-gradient(135deg,#5683A8,#3F6B5B);color:var(--cream);padding:22px">'+
        '<div style="display:flex;align-items:center;gap:6px;font-size:13px;opacity:.85">'+icon('pin',14)+' Next trip</div>'+
        '<div class="serif" style="font-size:24px;font-weight:600;margin-top:4px">Byron Bay</div>'+
        '<div style="font-size:13px;opacity:.85;margin-top:4px">14 – 18 Jul · in 46 days</div></div>'+
      listCard('Packing list','#5683A8',[{t:'Sunscreen & hat'},{t:'Hiking shoes'},{t:'Chargers & adapters'},{t:'Beach towel'}],'<span class="checkbox"></span>')+'</div>';
  },
};

/* ---- addable sections ---- */
const ADDABLE={work:'task',reminders:'reminder',goals:'habit',notes:'note',documents:'document'};

/* ---- header ---- */
function renderHeader(tabId){
  var hdr=document.getElementById('hdr');
  if(!tabId){
    var nm=currentUser?currentUser.name:'You';
    var ini=nm.charAt(0).toUpperCase();
    hdr.innerHTML='<div class="logo">F</div><div class="htext"><h1>Forge</h1><span>Build your life</span></div>'+
      '<div class="pill" onclick="lockForge()"><span class="av">'+ini+'</span><span class="nm">'+nm.split(' ')[0]+'</span></div>';
  } else {
    var special={today:{label:'Today',sub:'Your day at a glance'},users:{label:'Accounts',sub:'Manage who can use Forge'}};
    var tab=special[tabId]||TABS.filter(function(t){return t.id===tabId;})[0];
    hdr.innerHTML='<div class="back" onclick="go(null)">'+icon('back',22)+'</div>'+
      '<div class="htext"><h1 class="serif">'+tab.label+'</h1><span>'+tab.sub+'</span></div>';
  }
}

/* ---- navigation ---- */
var activeTab=null;
function go(tabId){
  activeTab=tabId;
  var stage=document.getElementById('stage');
  renderHeader(tabId);
  var oldFab=document.querySelector('.fab');if(oldFab)oldFab.remove();
  if(!tabId){
    stage.className='';void stage.offsetWidth;
    var h=new Date().getHours();
    var greet=h<12?'Good morning':h<18?'Good afternoon':'Good evening';
    var fname=currentUser?currentUser.name.split(' ')[0]:'';
    var masterTile=(currentUser&&currentUser.role==='master')?
      '<div class="tile" style="background:#EFE9DC" onclick="go(\'users\')"><div class="chip" style="background:#B4925A">'+icon('contacts',21,2.2)+'</div><div><div class="t">Accounts</div><div class="s">Manage users</div></div></div>':'';
    stage.innerHTML='<div class="anim-home">'+
      '<div class="feature" onclick="go(\'today\')">'+
        '<div class="lbl">'+icon('sun',15)+' Today</div>'+
        '<h2>'+greet+(fname?', '+fname:'')+'</h2><p>Tap to see your day at a glance</p></div>'+
      '<div class="grid">'+
        TABS.map(function(t){return '<div class="tile" style="background:'+t.bg+'" onclick="go(\''+t.id+'\')">'+
          '<div class="chip" style="background:'+t.chip+'">'+icon(t.id,21,2.2)+'</div>'+
          '<div><div class="t">'+t.label+'</div><div class="s">'+t.sub+'</div></div></div>';}).join('')+
        masterTile+
      '</div>'+
      '<button class="reqbtn" onclick="openRequest()">'+icon('plus',16)+' Request a feature</button>'+
    '</div>';
    document.getElementById('stage').scrollTop=0;
    return;
  }
  stage.innerHTML='<div class="anim-section">'+(VIEWS[tabId]?VIEWS[tabId]():'')+'</div>';
  stage.scrollTop=0;
  if(ADDABLE[tabId]){
    var fab=document.createElement('button');
    fab.className='fab';fab.innerHTML=icon('plus',26,2.6);
    fab.onclick=function(){addItem(tabId);};
    document.getElementById('app').appendChild(fab);
  }
}

function addItem(tabId){
  var what=ADDABLE[tabId];
  var text=prompt('New '+what+':');
  if(text&&text.trim()){store[tabId].unshift({t:text.trim(),s:'Just added'});saveStore();go(tabId);}
}

/* ---- request a feature ---- */
function openRequest(){
  var o=document.createElement('div');o.className='overlay';o.id='ovl';
  o.innerHTML='<div class="sheet" onclick="event.stopPropagation()">'+
    '<h3>Request a feature</h3>'+
    '<p>Tell me what would make Forge more useful — it goes straight to my list.</p>'+
    '<textarea id="reqtext" placeholder="e.g. a meal planner, dark mode, repeating reminders..."></textarea>'+
    '<div class="btnrow"><button class="btn btn-ghost" onclick="closeOverlay()">Cancel</button>'+
    '<button class="btn btn-primary" onclick="sendRequest()">Send</button></div></div>';
  o.onclick=closeOverlay;document.getElementById('app').appendChild(o);
  setTimeout(function(){var t=document.getElementById('reqtext');if(t)t.focus();},100);
}
function closeOverlay(){var o=document.getElementById('ovl');if(o)o.remove();}
function sendRequest(){
  var t=document.getElementById('reqtext');var v=t?t.value.trim():'';
  if(!v){if(t)t.focus();return;}
  var o=document.getElementById('ovl');
  o.querySelector('.sheet').innerHTML='<div class="done"><div class="tick">'+icon('check',26,2.6)+'</div>'+
    '<h3>Thanks!</h3><p>Request noted. Once sync is added, this will land in my inbox automatically.</p>'+
    '<button class="btn btn-primary" onclick="closeOverlay()" style="margin-top:6px">Done</button></div>';
}

/* ---- storage helpers ---- */
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function lsDel(k){try{localStorage.removeItem(k);}catch(e){}}
function tinyHash(s){var h=0;for(var i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))>>>0;}return ''+h;}

/* ---- accounts ---- */
var USERS_KEY='forge.users.v1';
function loadUsers(){var raw=lsGet(USERS_KEY);if(raw){try{var u=JSON.parse(raw);if(u&&u.length)return u;}catch(e){}}var seed=[{id:'master',name:'Harvey',pin:tinyHash('7202'),role:'master'}];lsSet(USERS_KEY,JSON.stringify(seed));return seed;}
function saveUsers(list){lsSet(USERS_KEY,JSON.stringify(list));}
function openAddUser(){
  var o=document.createElement('div');o.className='overlay';o.id='ovl';
  o.innerHTML='<div class="sheet" onclick="event.stopPropagation()">'+
    '<h3>Add a user</h3><p>They log in with their own PIN and get a private space on this device.</p>'+
    '<input id="uName" placeholder="Name" maxlength="20" autocomplete="off"/>'+
    '<input id="uPin" placeholder="4-digit PIN" inputmode="numeric" maxlength="4" autocomplete="off"/>'+
    '<div class="btnrow"><button class="btn btn-ghost" onclick="closeOverlay()">Cancel</button>'+
    '<button class="btn btn-primary" onclick="saveNewUser()">Create</button></div></div>';
  o.onclick=closeOverlay;document.getElementById('app').appendChild(o);
  setTimeout(function(){var n=document.getElementById('uName');if(n)n.focus();},100);
}
function saveNewUser(){
  var name=(document.getElementById('uName').value||'').trim();
  var pin=(document.getElementById('uPin').value||'').trim();
  if(!name){document.getElementById('uName').focus();return;}
  if(!/^[0-9]{4}$/.test(pin)){alert('PIN must be exactly 4 digits.');return;}
  var us=loadUsers();
  if(us.some(function(u){return u.pin===tinyHash(pin);})){alert('That PIN is already in use — pick another.');return;}
  us.push({id:'u'+Date.now(),name:name,pin:tinyHash(pin),role:'user'});
  saveUsers(us);closeOverlay();go('users');
}
function deleteUser(id){if(!confirm('Remove this user and all their data on this device?'))return;saveUsers(loadUsers().filter(function(u){return u.id!==id;}));lsDel('forge.store.'+id);go('users');}
function renameUser(id){var us=loadUsers();var u=us.filter(function(x){return x.id===id;})[0];if(!u)return;var n=prompt('Name:',u.name);if(n&&n.trim()){u.name=n.trim();saveUsers(us);if(currentUser&&currentUser.id===id)currentUser.name=u.name;go('users');}}
function updateFinBal(){var balKey='forge.finance.bal.'+(currentUser?currentUser.id:'x');var curr=lsGet(balKey);var v=prompt('Your current AUD savings balance:',curr||'');if(v!==null&&v.trim()!==''&&!isNaN(Number(v))){lsSet(balKey,v.trim());go('finances');}}

/* ---- PIN lock ---- */
var pinEntry='';
function startPin(){pinEntry='';var p=document.getElementById('pin');p.style.display='flex';buildKeypad();renderPin();}
function renderPin(){
  document.getElementById('pinTitle').textContent='Enter your PIN';
  document.getElementById('pinSub').textContent='Welcome to Forge';
  var dots=document.getElementById('pinDots');dots.className='dots';dots.innerHTML='';
  for(var i=0;i<4;i++){var d=document.createElement('div');d.className='dot-pin'+(i<pinEntry.length?' on':'');dots.appendChild(d);}
}
function buildKeypad(){
  var kp=document.getElementById('keypad');kp.innerHTML='';
  ['1','2','3','4','5','6','7','8','9','','0','del'].forEach(function(k){
    var b=document.createElement('button');
    if(k===''){b.className='key blank';}
    else if(k==='del'){b.className='key fn';b.textContent='Delete';b.onclick=pinDel;}
    else{b.className='key';b.textContent=k;b.onclick=function(kk){return function(){pinPush(kk);};}(k);}
    kp.appendChild(b);
  });
}
function pinPush(n){if(pinEntry.length>=4)return;pinEntry+=n;renderPin();if(pinEntry.length===4)setTimeout(pinSubmit,180);}
function pinDel(){pinEntry=pinEntry.slice(0,-1);renderPin();}
function pinError(){var d=document.getElementById('pinDots');d.classList.add('err');if(navigator.vibrate)navigator.vibrate(120);setTimeout(function(){pinEntry='';renderPin();},430);}
function unlock(){var p=document.getElementById('pin');p.classList.add('hide');setTimeout(function(){p.style.display='none';p.classList.remove('hide');},640);}
function lockForge(){currentUser=null;pinEntry='';var p=document.getElementById('pin');p.style.display='flex';renderPin();}
function activateUser(u){currentUser={id:u.id,name:u.name,role:u.role};loadStoreFor(u.id);}
function pinSubmit(){var u=loadUsers().filter(function(x){return x.pin===tinyHash(pinEntry);})[0];if(u){activateUser(u);unlock();go(null);}else pinError();}

/* ---- boot ---- */
(function(){
  var w=document.getElementById('introWord');
  'FORGE'.split('').forEach(function(ch,i){var s=document.createElement('span');s.textContent=ch;s.style.animationDelay=(0.5+i*0.09)+'s';w.appendChild(s);});
  loadUsers();
  go(null);
  setTimeout(function(){
    var intro=document.getElementById('intro');
    intro.classList.add('hide');
    setTimeout(function(){intro.remove();startPin();},640);
  },2700);
})();
</script>
