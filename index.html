<title>Forge — Build your life</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--ink:#26231E;--sub:#8A8377;--cream:#F6F2E9;--paper:#FBF8F1;--accent:#23493A;--accent-2:#173026;--gold:#B4925A;--line:rgba(38,35,30,.07);}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;position:fixed;width:100%;touch-action:none;overscroll-behavior:none;}
body{font-family:'DM Sans',system-ui,sans-serif;color:var(--ink);background:#E9E4D8;display:flex;justify-content:center;-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%;text-size-adjust:100%;}
input,textarea{-webkit-user-select:text;user-select:text;font-size:16px;}
.serif{font-family:'Fraunces',Georgia,serif;}
#app{width:100%;max-width:480px;height:100vh;height:100dvh;background:var(--cream);display:flex;flex-direction:column;position:relative;overflow:hidden;}
@media(min-width:520px) and (max-width:899px){#app{box-shadow:0 0 60px rgba(38,35,30,.12);}}
header{padding:calc(16px + env(safe-area-inset-top,0px)) 20px 13px;display:flex;align-items:center;gap:11px;border-bottom:1px solid rgba(180,146,90,.22);flex-shrink:0;}
.logo{width:42px;height:42px;border-radius:13px;background:var(--paper);display:flex;align-items:center;justify-content:center;color:var(--accent);font-family:'Fraunces',serif;font-weight:700;font-size:25px;line-height:1;border:1.5px solid var(--gold);box-shadow:0 4px 12px rgba(38,35,30,.1);flex-shrink:0;cursor:pointer;overflow:hidden;transition:transform .18s;}
.logo:active{transform:scale(.92);}
.logo img{width:100%;height:100%;object-fit:cover;}
.logo.sm{width:34px;height:34px;border-radius:11px;font-size:19px;}
.htext{flex:1;min-width:0;}.htext h1{font-family:'Fraunces',serif;font-size:23px;font-weight:600;line-height:1;}
.htext span{font-size:11px;color:var(--sub);letter-spacing:.1em;text-transform:uppercase;display:block;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pill{display:flex;align-items:center;gap:8px;padding:6px 11px 6px 6px;border-radius:30px;background:var(--paper);border:1px solid var(--line);cursor:pointer;transition:background .2s;flex-shrink:0;}
.pill:hover{background:rgba(38,35,30,.05);}
.pill .nm{font-size:13.5px;font-weight:600;}
.back{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;margin-left:-6px;transition:background .18s,transform .18s;flex-shrink:0;}
.back:hover{background:rgba(38,35,30,.06);}.back:active{transform:scale(.9);}
.sync-dot{width:7px;height:7px;border-radius:50%;background:#5E8C61;flex-shrink:0;transition:background .3s;opacity:.0;}
.sync-dot.syncing{background:var(--gold);animation:pulse-dot 1s ease-in-out infinite;opacity:1;}
.sync-dot.error{background:#B5687C;opacity:1;}
@keyframes pulse-dot{0%,100%{opacity:1;}50%{opacity:.35;}}
#stage{position:relative;flex:1;overflow:hidden;}
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:8px 18px calc(34px + env(safe-area-inset-bottom,0px));background:var(--cream);will-change:transform;touch-action:pan-y;overscroll-behavior:contain;}
.screen::-webkit-scrollbar{width:0;}
.screen.enter-right{transform:translateX(100%);}
.screen.enter-left{transform:translateX(-24%);filter:brightness(.92);}
.screen.show{transform:translateX(0);filter:none;transition:transform .44s cubic-bezier(.22,.85,.26,1),filter .44s ease;}
.screen.exit-left{transform:translateX(-24%);filter:brightness(.92);transition:transform .44s cubic-bezier(.22,.85,.26,1),filter .44s ease;}
.screen.exit-right{transform:translateX(100%);transition:transform .44s cubic-bezier(.22,.85,.26,1);}
.screen.dragging{transition:none!important;filter:none!important;}
.home-grid{display:grid;grid-template-columns:1fr 1fr;gap:clamp(9px,2.8vw,13px);}
.tile{border-radius:clamp(18px,4.5vw,24px);padding:clamp(13px,3.7vw,18px);min-height:clamp(100px,27vw,132px);cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 2px 6px rgba(38,35,30,.05);transition:transform .28s cubic-bezier(.2,.8,.2,1),box-shadow .28s;position:relative;overflow:hidden;}
.tile:hover{transform:translateY(-4px);box-shadow:0 14px 30px rgba(38,35,30,.1);}
.tile:active{transform:translateY(0) scale(.97);}
.tile::before{content:'';position:absolute;inset:0 0 auto 0;height:42%;border-radius:24px 24px 0 0;background:linear-gradient(rgba(255,255,255,.18),transparent);pointer-events:none;}
.tile .chip{width:clamp(38px,10vw,42px);height:clamp(38px,10vw,42px);border-radius:clamp(12px,3.2vw,14px);display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 3px 8px rgba(38,35,30,.12);}
.tile .t{font-weight:700;font-size:clamp(14.5px,4.1vw,16.5px);line-height:1.1;}.tile .s{font-size:clamp(10.5px,3vw,12px);color:rgba(38,35,30,.55);margin-top:2px;line-height:1.2;}
.tile.hero{grid-column:1/-1;min-height:0;background:linear-gradient(135deg,#23493A,#173026);color:var(--cream);box-shadow:0 10px 26px rgba(23,48,38,.32);gap:6px;padding:20px 22px;justify-content:center;align-items:flex-start;}
.tile.hero::before{height:60%;background:linear-gradient(rgba(255,255,255,.06),transparent);}
.tile.hero .hero-greet{font-size:clamp(21px,6vw,25px);font-weight:600;margin-top:8px;line-height:1.05;}
.tile.hero .hero-sub{font-size:13.5px;opacity:.85;margin-top:3px;}
.tile.ghost{background:transparent;border:1.5px dashed rgba(38,35,30,.2);box-shadow:none;color:var(--sub);}
.tile.ghost::before{display:none;}.tile.ghost:hover{border-color:var(--accent);}
.tile.ghost .t{color:var(--sub);}.tile.ghost .chip.ghostchip{background:rgba(38,35,30,.06);color:var(--sub);box-shadow:none;}
.screen.show .tile{animation:tIn .5s cubic-bezier(.2,.8,.2,1) both;}
.screen.show .tile:nth-child(1){animation-delay:.02s}.screen.show .tile:nth-child(2){animation-delay:.06s}.screen.show .tile:nth-child(3){animation-delay:.1s}.screen.show .tile:nth-child(4){animation-delay:.14s}.screen.show .tile:nth-child(5){animation-delay:.18s}.screen.show .tile:nth-child(6){animation-delay:.22s}.screen.show .tile:nth-child(7){animation-delay:.26s}.screen.show .tile:nth-child(8){animation-delay:.3s}.screen.show .tile:nth-child(9){animation-delay:.34s}.screen.show .tile:nth-child(10){animation-delay:.38s}.screen.show .tile:nth-child(11){animation-delay:.42s}.screen.show .tile:nth-child(12){animation-delay:.46s}
@keyframes tIn{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
.card{background:var(--paper);border-radius:22px;padding:18px;border:1px solid var(--line);box-shadow:0 1px 3px rgba(38,35,30,.04);}
.stack{display:grid;gap:14px;}
.ctitle{font-size:12px;font-weight:600;color:var(--sub);letter-spacing:.06em;text-transform:uppercase;margin:2px 2px 12px;}
.row{display:flex;align-items:center;gap:12px;padding:12px 8px;border-radius:12px;transition:background .18s;}
.row:hover{background:rgba(38,35,30,.035);}
.dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.row .rt{font-weight:600;font-size:15px;}.row .rs{font-size:12.5px;color:var(--sub);margin-top:1px;}
.dark{background:var(--ink);color:var(--cream);}
.dark .small{font-size:13px;opacity:.7;}.dark h2{font-family:'Fraunces',serif;font-size:30px;font-weight:600;margin-top:2px;}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.stat .k{display:flex;align-items:center;gap:7px;color:var(--sub);font-size:12px;margin-bottom:8px;}
.stat .v{font-weight:700;font-size:22px;}.stat .d{font-size:12px;color:var(--sub);margin-top:2px;}
.checkbox{width:20px;height:20px;border-radius:6px;border:2px solid rgba(38,35,30,.2);flex-shrink:0;}
.circlebox{width:20px;height:20px;border-radius:50%;border:2px solid rgba(38,35,30,.2);flex-shrink:0;}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center;}
.cal .h{font-size:11px;color:var(--sub);font-weight:600;padding-bottom:4px;}
.cal .cell{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:12px;font-size:13px;font-weight:500;}
.cal .today{background:var(--accent);color:#fff;font-weight:700;}
.evdot{width:4px;height:4px;border-radius:50%;background:var(--accent);margin-top:2px;}
.bar{height:8px;border-radius:8px;background:rgba(38,35,30,.07);overflow:hidden;}
.bar>div{height:100%;border-radius:8px;}
.fab{position:absolute;bottom:calc(24px + env(safe-area-inset-bottom,0px));right:22px;width:56px;height:56px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(35,73,58,.4);cursor:pointer;border:none;transition:transform .2s cubic-bezier(.2,.8,.2,1),box-shadow .2s;z-index:40;}
.fab:hover{transform:translateY(-2px) rotate(90deg);box-shadow:0 10px 26px rgba(35,73,58,.5);}
.fab:active{transform:scale(.9);}
.overlay{position:absolute;inset:0;background:rgba(38,35,30,.4);display:flex;align-items:flex-end;justify-content:center;z-index:50;animation:fade .25s ease;}
.sheet{width:100%;background:var(--cream);border-radius:26px 26px 0 0;padding:24px 22px calc(30px + env(safe-area-inset-bottom,0px));animation:up .32s cubic-bezier(.2,.85,.25,1);max-height:90%;overflow-y:auto;}
.sheet h3{font-family:'Fraunces',serif;font-size:20px;font-weight:600;}
.sheet p{font-size:13.5px;color:var(--sub);margin-top:4px;margin-bottom:14px;}
.sheet textarea{width:100%;min-height:96px;border:1px solid var(--line);border-radius:14px;padding:12px;font-family:'DM Sans',sans-serif;font-size:16px;resize:none;background:var(--paper);color:var(--ink);}
.sheet textarea:focus{outline:none;border-color:var(--accent);}
.sheet input{width:100%;border:1px solid var(--line);border-radius:14px;padding:13px 14px;font-family:'DM Sans',sans-serif;font-size:16px;background:var(--paper);color:var(--ink);margin-bottom:10px;}
.sheet input:focus{outline:none;border-color:var(--accent);}
.btnrow{display:flex;gap:10px;margin-top:14px;}
.btn{flex:1;padding:14px;border-radius:14px;border:none;font-family:'DM Sans',sans-serif;font-size:15px;font-weight:600;cursor:pointer;transition:transform .15s;}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--accent);color:#fff;}.btn-ghost{background:rgba(38,35,30,.07);color:var(--ink);}
.done{text-align:center;padding:10px 0 4px;}
.done .tick{width:54px;height:54px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;}
.badge{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:3px 9px;border-radius:20px;background:rgba(35,73,58,.1);color:var(--accent);}
.uav{border-radius:50%;background:linear-gradient(135deg,#23493A,#B4925A);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;overflow:hidden;}
.uav img{width:100%;height:100%;object-fit:cover;}
/* lock / intro / pin */
.lock{position:absolute;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--cream);background:radial-gradient(135% 105% at 50% 12%,#2F6049 0%,#1E3E2F 48%,#0F2017 100%);overflow:hidden;}
.lock::after{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(130% 130% at 50% 42%,transparent 48%,rgba(0,0,0,.45) 100%);}
.lock.hide{animation:lift .7s cubic-bezier(.6,0,.2,1) forwards;}
@keyframes lift{to{opacity:0;transform:scale(1.04);visibility:hidden;}}
/* premium intro */
.intro-stage{position:relative;z-index:3;display:flex;flex-direction:column;align-items:center;}
.intro-mark{width:104px;height:104px;border-radius:28px;border:1.5px solid rgba(198,165,107,.55);background:rgba(246,242,233,.03);display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 30px 70px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.08);opacity:0;transform:scale(.82);animation:markIn 1.5s cubic-bezier(.16,1,.3,1) .2s forwards;}
.intro-mark img{width:100%;height:100%;object-fit:cover;}
@keyframes markIn{0%{opacity:0;transform:scale(.82) translateY(8px);}60%{opacity:1;}100%{opacity:1;transform:scale(1) translateY(0);}}
.intro-ring{position:absolute;top:-14px;left:50%;width:132px;height:132px;margin-left:-66px;border-radius:50%;border:1px solid rgba(198,165,107,.0);opacity:0;animation:ringP 2.6s ease .6s forwards;}
@keyframes ringP{0%{opacity:0;transform:scale(.7);border-color:rgba(198,165,107,.4);}70%{opacity:.5;}100%{opacity:0;transform:scale(1.5);border-color:rgba(198,165,107,0);}}
.intro-word{margin-top:30px;font-family:'Fraunces',serif;font-size:34px;font-weight:500;letter-spacing:.42em;padding-left:.42em;color:var(--cream);position:relative;z-index:3;text-align:center;height:42px;}
.intro-word span{display:inline-block;opacity:0;transform:translateY(14px);animation:letterIn .85s cubic-bezier(.16,1,.3,1) forwards;}
@keyframes letterIn{to{opacity:1;transform:none;}}
.intro-rule{width:0;height:1px;background:linear-gradient(90deg,transparent,rgba(198,165,107,.9),transparent);margin:24px 0 18px;animation:rule 1.1s ease 1.7s forwards;position:relative;z-index:3;}
@keyframes rule{to{width:160px;}}
.intro-tag{font-size:10.5px;letter-spacing:.46em;padding-left:.46em;color:rgba(198,165,107,.9);text-transform:uppercase;opacity:0;animation:fadein 1s ease 2.05s forwards;position:relative;z-index:3;}
@keyframes fadein{to{opacity:1;}}
.intro-load{position:absolute;bottom:calc(56px + env(safe-area-inset-bottom,0px));width:120px;height:2px;border-radius:2px;background:rgba(246,242,233,.12);overflow:hidden;z-index:3;opacity:0;animation:fadein .6s ease 2.3s forwards;}
.intro-load>div{position:absolute;inset:0;width:0;background:rgba(198,165,107,.85);border-radius:2px;animation:loadbar 1.7s cubic-bezier(.4,0,.2,1) 2.35s forwards;}
@keyframes loadbar{to{width:100%;}}
/* pin */
.pin-wrap{width:100%;max-width:300px;display:flex;flex-direction:column;align-items:center;position:relative;z-index:3;padding:0 22px;animation:fade .5s ease;}
.pin-logo{width:60px;height:60px;border-radius:17px;border:1.5px solid rgba(198,165,107,.55);display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:22px;}
.pin-logo img{width:100%;height:100%;object-fit:cover;}
.pin-title{font-family:'Fraunces',serif;font-size:23px;font-weight:500;margin-bottom:6px;text-align:center;}
.pin-sub{font-size:13px;color:rgba(246,242,233,.6);margin-bottom:28px;text-align:center;line-height:1.5;}
.dots{display:flex;gap:16px;margin-bottom:38px;}
.dot-pin{width:14px;height:14px;border-radius:50%;border:1.5px solid rgba(246,242,233,.5);transition:transform .12s,background .12s,border-color .12s;}
.dot-pin.on{background:var(--gold);border-color:var(--gold);transform:scale(1.15);}
.dots.err{animation:shake .42s;}
@keyframes shake{0%,100%{transform:translateX(0);}20%,60%{transform:translateX(-9px);}40%,80%{transform:translateX(9px);}}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;width:100%;}
.key{height:66px;border-radius:50%;background:rgba(246,242,233,.06);border:1px solid rgba(246,242,233,.13);color:var(--cream);font-family:'DM Sans',sans-serif;font-size:27px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .08s ease,background .12s;-webkit-user-select:none;user-select:none;}
.key:active{transform:scale(.9);background:rgba(246,242,233,.2);}
.key.blank{background:transparent;border:none;cursor:default;}
.key.fn{font-size:13px;letter-spacing:.02em;color:rgba(246,242,233,.7);background:transparent;border:none;}
.pin-alt{margin-top:26px;font-size:13px;color:rgba(198,165,107,.85);letter-spacing:.02em;background:none;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;font-weight:600;}
.pin-back{position:absolute;top:calc(20px + env(safe-area-inset-top,0px));left:20px;width:40px;height:40px;border-radius:50%;background:rgba(246,242,233,.08);border:none;color:var(--cream);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:4;}
/* signup screen */
.signup-field{width:100%;background:rgba(246,242,233,.07);border:1px solid rgba(246,242,233,.16);border-radius:15px;padding:15px 16px;color:var(--cream);font:16px 'DM Sans',sans-serif;margin-bottom:12px;}
.signup-field::placeholder{color:rgba(246,242,233,.4);}
.signup-field:focus{outline:none;border-color:var(--gold);}
.signup-btn{width:100%;padding:15px;border-radius:15px;border:none;background:var(--gold);color:#1E3E2F;font:600 16px 'DM Sans',sans-serif;cursor:pointer;margin-top:6px;transition:transform .15s,opacity .2s;}
.signup-btn:active{transform:scale(.97);}
.signup-btn:disabled{opacity:.45;}
/* seg */
.seg{display:flex;gap:4px;background:rgba(38,35,30,.06);padding:4px;border-radius:14px;margin-bottom:14px;}
.seg-btn{flex:1;border:none;background:transparent;padding:9px 8px;border-radius:10px;font:600 13px 'DM Sans',sans-serif;color:var(--sub);cursor:pointer;transition:all .2s;}
.seg-btn.on{background:var(--paper);color:var(--ink);box-shadow:0 1px 3px rgba(38,35,30,.1);}
.seg.sm{margin:0;}.seg.sm .seg-btn{padding:6px 12px;font-size:12px;flex:0 0 auto;}
.trow{display:flex;align-items:center;gap:12px;padding:10px 4px;}
.chip.sm{width:34px;height:34px;border-radius:11px;color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 2px 6px rgba(38,35,30,.12);}
.tbtn{border:1px solid var(--line);background:var(--paper);color:var(--ink);font:600 12.5px 'DM Sans',sans-serif;padding:7px 13px;border-radius:20px;cursor:pointer;transition:all .18s;}
.tbtn:active{transform:scale(.94);}
.tbtn.add{background:var(--accent);color:#fff;border-color:transparent;}
.tbtn.rm{color:#B5687C;}
.del{background:none;border:none;color:var(--sub);cursor:pointer;padding:6px;border-radius:8px;display:inline-flex;align-items:center;}
.del:hover{color:#B5687C;background:rgba(181,104,124,.1);}
.acct-head{display:flex;align-items:center;gap:14px;margin-bottom:18px;}
.acct-list{display:flex;flex-direction:column;gap:4px;margin-bottom:8px;}
.acct-item{display:flex;align-items:center;gap:12px;width:100%;border:none;background:transparent;padding:13px 6px;border-radius:12px;font:600 15px 'DM Sans',sans-serif;color:var(--ink);cursor:pointer;text-align:left;transition:background .15s;}
.acct-item:hover{background:rgba(38,35,30,.04);}
.acct-item>span{flex:1;}
.theme-row{justify-content:space-between;cursor:default;}
.photo-ctrls{display:flex;gap:10px;margin-bottom:12px;}
.cd-card .cd-big{font-family:'Fraunces',serif;font-weight:600;font-size:54px;line-height:1;margin:10px 0 6px;color:var(--accent);}
.meal-row{cursor:pointer;}
.note{margin-top:10px;font-size:12px;color:var(--sub);display:flex;align-items:flex-start;gap:6px;padding:8px 10px;background:rgba(35,73,58,.06);border-radius:10px;line-height:1.45;}
.ai-wrap{display:flex;flex-direction:column;min-height:calc(100% - 4px);}
.ai-thread{flex:1;display:flex;flex-direction:column;gap:10px;padding:6px 2px 12px;}
.ai-msg{max-width:82%;padding:11px 14px;border-radius:18px;font-size:14.5px;line-height:1.45;}
.ai-msg.me{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:6px;}
.ai-msg.ai{align-self:flex-start;background:var(--paper);border:1px solid var(--line);border-bottom-left-radius:6px;}
.ai-empty{text-align:center;color:var(--sub);padding:36px 20px;}
.ai-bar{position:sticky;bottom:0;display:flex;gap:8px;padding:10px 0 2px;background:linear-gradient(transparent,var(--cream) 28%);}
.ai-bar input{flex:1;border:1px solid var(--line);background:var(--paper);border-radius:24px;padding:13px 16px;font:16px 'DM Sans',sans-serif;color:var(--ink);}
.ai-bar input:focus{outline:none;border-color:var(--accent);}
.ai-bar button{width:46px;height:46px;border-radius:50%;border:none;background:var(--accent);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.reqbtn{margin-top:18px;width:100%;padding:15px;border:1.5px dashed rgba(38,35,30,.2);border-radius:20px;background:transparent;color:var(--sub);font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:border-color .2s,color .2s;}
.reqbtn:hover{border-color:var(--accent);color:var(--accent);}
.toast{position:absolute;bottom:calc(34px + env(safe-area-inset-bottom,0px));left:50%;transform:translate(-50%,16px);background:var(--ink);color:var(--cream);padding:11px 18px;border-radius:24px;font-size:13.5px;font-weight:600;opacity:0;transition:all .3s;z-index:300;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.25);white-space:nowrap;}
.toast.show{opacity:1;transform:translate(-50%,0);}
svg{display:block;}
@keyframes fade{from{opacity:0;}to{opacity:1;}}
@keyframes up{from{transform:translateY(100%);}to{transform:none;}}
/* welcome */
.welcome{position:absolute;inset:0;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(135% 105% at 50% 22%,#2F6049 0%,#1E3E2F 50%,#0F2017 100%);color:#F6F2E9;}
.welcome.in .wel-mark,.welcome.in .wel-hi,.welcome.in .wel-name{opacity:1;transform:none;}
.wel-mark{width:88px;height:88px;border-radius:25px;border:1.5px solid #C6A56B;display:flex;align-items:center;justify-content:center;overflow:hidden;opacity:0;transform:scale(.8);transition:all .6s cubic-bezier(.2,.85,.25,1);}
.wel-mark img{width:100%;height:100%;object-fit:cover;}
.wel-hi{font-size:18px;font-weight:500;opacity:0;transform:translateY(10px);transition:all .5s ease .15s;margin-top:22px;color:rgba(246,242,233,.8);}
.wel-name{font-family:'Fraunces',serif;font-size:34px;font-weight:600;opacity:0;transform:translateY(10px);transition:all .5s cubic-bezier(.2,.85,.25,1) .28s;}
.welcome.hide{opacity:0;transition:opacity .55s ease;}
/* tutorial */
.tut{position:absolute;inset:0;z-index:180;background:radial-gradient(135% 105% at 50% 18%,#2F6049 0%,#1E3E2F 50%,#0F2017 100%);color:#F6F2E9;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:34px 30px calc(40px + env(safe-area-inset-bottom,0px));text-align:center;}
.tut.hide{opacity:0;transition:opacity .5s ease;}
.tut-icon{width:84px;height:84px;border-radius:24px;background:rgba(246,242,233,.06);border:1.5px solid rgba(198,165,107,.45);display:flex;align-items:center;justify-content:center;color:#C6A56B;margin-bottom:26px;}
.tut-step{max-width:340px;}
.tut-h{font-family:'Fraunces',serif;font-size:27px;font-weight:600;line-height:1.15;}
.tut-p{font-size:15px;line-height:1.55;color:rgba(246,242,233,.78);margin-top:12px;}
.tut-dots{display:flex;gap:8px;margin-top:34px;justify-content:center;}
.tut-dot{width:8px;height:8px;border-radius:50%;background:rgba(246,242,233,.25);transition:all .3s;}
.tut-dot.on{background:#C6A56B;width:22px;border-radius:4px;}
.tut-actions{position:absolute;bottom:calc(40px + env(safe-area-inset-bottom,0px));left:30px;right:30px;display:flex;gap:12px;align-items:center;justify-content:space-between;}
.tut-skip{background:none;border:none;color:rgba(246,242,233,.55);font:600 14px 'DM Sans',sans-serif;cursor:pointer;padding:10px;}
.tut-next{background:var(--gold);color:#1E3E2F;border:none;border-radius:14px;padding:14px 28px;font:600 15px 'DM Sans',sans-serif;cursor:pointer;transition:transform .15s;}
.tut-next:active{transform:scale(.96);}
.tut-fade{animation:tutFade .4s ease;}
@keyframes tutFade{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:none;}}
/* invite */
.invite-screen{position:absolute;inset:0;z-index:150;display:flex;align-items:center;justify-content:center;background:radial-gradient(135% 105% at 50% 14%,#2F6049 0%,#1E3E2F 50%,#0F2017 100%);color:#F6F2E9;overflow:hidden;padding:30px;}
.invite-screen .inv-card{position:relative;z-index:3;max-width:350px;text-align:center;}
.inv-mark{width:78px;height:78px;border-radius:22px;border:1.5px solid rgba(198,165,107,.5);display:flex;align-items:center;justify-content:center;overflow:hidden;margin:0 auto 20px;}
.inv-mark img{width:100%;height:100%;object-fit:cover;}
.inv-tag{font-size:11px;letter-spacing:.3em;padding-left:.3em;text-transform:uppercase;color:#C6A56B;}
.inv-h{font-size:29px;font-weight:600;margin-top:8px;font-family:'Fraunces',serif;}
.inv-sub{font-size:14.5px;color:rgba(246,242,233,.78);margin-top:10px;line-height:1.5;}
.inv-steps{margin-top:26px;text-align:left;display:flex;flex-direction:column;gap:14px;}
.inv-step{display:flex;align-items:center;gap:13px;font-size:14.5px;color:rgba(246,242,233,.92);}
.inv-step span{width:28px;height:28px;border-radius:50%;border:1px solid #C6A56B;color:#C6A56B;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;font-weight:600;}
.invite-screen.hide{opacity:0;transition:opacity .55s ease;}
.glow{position:absolute;width:440px;height:440px;border-radius:50%;background:radial-gradient(circle,rgba(198,165,107,.16),transparent 65%);filter:blur(8px);animation:pulse 5s ease-in-out infinite;top:50%;left:50%;transform:translate(-50%,-50%);}
@keyframes pulse{0%,100%{opacity:.55;transform:translate(-50%,-50%) scale(1);}50%{opacity:.9;transform:translate(-50%,-50%) scale(1.12);}}
/* dark */
html[data-theme=dark]{--ink:#F0EBE0;--sub:#A39B8A;--cream:#141310;--paper:#201E18;--accent:#3E7E60;--gold:#CDA968;--line:rgba(255,255,255,.08);}
html[data-theme=dark] body{background:var(--cream);}
html[data-theme=dark] .screen,html[data-theme=dark] header{background:var(--cream);}
html[data-theme=dark] header{border-bottom-color:rgba(255,255,255,.07);}
html[data-theme=dark] .logo{background:#2A2720;border-color:var(--gold);color:#F0EBE0;}
html[data-theme=dark] .pill{background:var(--paper);border-color:rgba(255,255,255,.09);}
html[data-theme=dark] .card{background:linear-gradient(180deg,#221F19,#1B1914);border-color:rgba(255,255,255,.07);box-shadow:0 2px 12px rgba(0,0,0,.34);}
html[data-theme=dark] .tile.hero{background:linear-gradient(140deg,#2F6049,#173a2b);color:#F4EFE4;}
html[data-theme=dark] .tile .t{color:var(--ink);}
html[data-theme=dark] .tile.ghost{border-color:rgba(255,255,255,.16);}
html[data-theme=dark] .home-grid .tile:not(.hero):not(.ghost){box-shadow:0 6px 18px rgba(0,0,0,.42);border:1px solid rgba(255,255,255,.06);}
html[data-theme=dark] .home-grid .tile:not(.hero):not(.ghost)::before{display:block;inset:0;height:100%;border-radius:inherit;background:rgba(15,13,9,.82);}
html[data-theme=dark] .home-grid .tile:not(.hero):not(.ghost)>*{position:relative;z-index:1;}
html[data-theme=dark] .dark{background:linear-gradient(140deg,#24382C,#16221C);color:#F4EFE4;}
html[data-theme=dark] .bar{background:rgba(255,255,255,.1);}
html[data-theme=dark] .seg{background:rgba(255,255,255,.06);}
html[data-theme=dark] .seg-btn.on{background:#2C2920;color:var(--ink);}
html[data-theme=dark] .tbtn{background:#262219;border-color:rgba(255,255,255,.1);color:var(--ink);}
html[data-theme=dark] .tbtn.add{background:var(--accent);color:#fff;}
html[data-theme=dark] .ai-msg.ai{background:#221F19;border-color:rgba(255,255,255,.07);}
html[data-theme=dark] .ai-bar input,html[data-theme=dark] .sheet input,html[data-theme=dark] .sheet textarea{background:#1B1914;border-color:rgba(255,255,255,.1);color:var(--ink);}
html[data-theme=dark] .sheet{background:#211F19;}
html[data-theme=dark] .reqbtn{border-color:rgba(255,255,255,.15);}
html[data-theme=dark] .checkbox,html[data-theme=dark] .circlebox{border-color:rgba(255,255,255,.28);}
html[data-theme=dark] .note{background:rgba(205,169,104,.1);}
html[data-theme=dark] .toast{background:#2C2920;color:#F0EBE0;}
html[data-theme=dark] .btn-ghost{background:rgba(255,255,255,.08);color:var(--ink);}
html[data-theme=dark] .cd-card .cd-big{color:var(--gold);}
html[data-theme=dark] .acct-item:hover{background:rgba(236,231,220,.05);}
/* desktop fills screen — task #4 */
@media(min-width:900px){
  body{align-items:stretch;background:var(--cream);}
  #app{max-width:none;width:100%;height:100vh;height:100dvh;border-radius:0;box-shadow:none;}
  header{padding:calc(20px + env(safe-area-inset-top,0px)) 40px 16px;}
  .screen{padding:18px 40px calc(40px + env(safe-area-inset-bottom,0px));}
  .stack,.ai-wrap{max-width:820px;margin-left:auto;margin-right:auto;width:100%;}
  .seg{max-width:820px;margin-left:auto;margin-right:auto;}
  .home-grid{max-width:1280px;margin:0 auto;gap:18px;}
  .tile{min-height:148px;}
}
@media(min-width:1100px){.home-grid{grid-template-columns:repeat(4,1fr);}}
@media(min-width:1500px){.home-grid{grid-template-columns:repeat(5,1fr);max-width:1560px;}}
</style>

<body>
<div id="app">
  <header id="hdr"></header>
  <div id="stage"></div>

function esc(s){return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function lsDel(k){try{localStorage.removeItem(k);}catch(e){}}
function timeAgo(ts){var s=Math.floor((Date.now()-ts)/1000);if(s<60)return 'just now';var mn=Math.floor(s/60);if(mn<60)return mn+'m ago';var hr=Math.floor(mn/60);if(hr<24)return hr+'h ago';return Math.floor(hr/24)+'d ago';}
function toast(m){var t=document.createElement('div');t.className='toast';t.textContent=m;document.getElementById('app').appendChild(t);setTimeout(function(){t.classList.add('show');},10);setTimeout(function(){t.classList.remove('show');setTimeout(function(){if(t.parentNode)t.parentNode.removeChild(t);},320);},1900);}
function isOwner(){return !!(currentUser&&currentUser.role==='master');}
function singular(w){w=String(w||'item');var m={'People':'person','Subscriptions':'subscription','Workouts':'workout','Recipes':'recipe','Books':'book','Watchlist':'title','Movies':'title','Gifts':'gift','Wishlist':'wish','Pets':'pet','Habits':'habit','Projects':'project','Study':'topic','Mood':'note','Sleep':'entry','Water':'log','Medication':'medication','Home':'job','Journal':'entry','Shopping':'item'};if(m[w])return m[w];if(/s$/.test(w))return w.replace(/s$/,'');return w;}

function applyTheme(t){document.documentElement.setAttribute('data-theme',t==='dark'?'dark':'light');var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content',t==='dark'?'#141310':'#23493A');}
function setTheme(t){lsSet('forge.theme',t);applyTheme(t);}
function avatarHTML(name,size,picUrl){var s=size||38;var ini=(name||'?').charAt(0).toUpperCase();var st='width:'+s+'px;height:'+s+'px;font-size:'+Math.round(s*0.42)+'px;';if(picUrl)return '<div class="uav" style="'+st+'"><img src="'+esc(picUrl)+'" alt=""/></div>';return '<div class="uav" style="'+st+'">'+ini+'</div>';}
function setSyncState(s){var d=document.getElementById('syncDot');if(d)d.className='sync-dot'+(s?' '+s:'');}
async function sha256hex(str){var buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str));return Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,'0');}).join('');}

async function loadItems(tab){
  if(!currentUser)return[];
  var ck='forge.cache.items.'+currentUser.id+'.'+tab;
  setSyncState('syncing');
  try{
    var r=await sb.from('items').select('*').eq('user_id',currentUser.id).eq('tab',tab).order('position').order('created_at');
    if(r.error)throw r.error;
    var arr=r.data.map(function(x){return {id:x.id,t:x.title,s:x.subtitle};});
    lsSet(ck,JSON.stringify(arr));setSyncState('');return arr;
  }catch(e){setSyncState('error');var raw=lsGet(ck);return raw?JSON.parse(raw):[];}
}
async function addItemDB(tab,title,subtitle){
  if(!currentUser)return;setSyncState('syncing');
  try{var r=await sb.from('items').insert({user_id:currentUser.id,tab:tab,title:title,subtitle:subtitle||null,position:0});if(r.error)throw r.error;setSyncState('');lsDel('forge.cache.items.'+currentUser.id+'.'+tab);}
  catch(e){setSyncState('error');console.error(e);toast('Could not save — check connection');}
}

}

async function uploadAvatar(file){
  if(!currentUser)return null;
  var ext=(file.name.split('.').pop()||'jpg').toLowerCase();
  var path=currentUser.id+'/avatar_'+Date.now()+'.'+ext;
  try{
    var up=await sb.storage.from('avatars').upload(path,file,{upsert:true,contentType:file.type});
    if(up.error)throw up.error;
    var pub=sb.storage.from('avatars').getPublicUrl(path);
    var url=pub.data.publicUrl;
    await sb.rpc('forge_set_avatar',{p_id:currentUser.id,p_url:url});
    currentUser.avatar_url=url;
    return url;
  }catch(e){console.error('avatar upload',e);return null;}
}

  try{await sb.rpc('forge_set_avatar',{p_id:currentUser.id,p_url:null});currentUser.avatar_url=null;}catch(e){console.error(e);}
}

// ---- PIN entry ----
var pinEntry='',pinBusy=false;
function showPinScreen(){
  pinBusy=false;pinEntry='';
  mountAuth(
    '<div class="pin-wrap">'+
      '<div class="pin-logo"><img src="'+ICON_SRC+'" alt="Forge"/></div>'+
      '<div class="pin-title">Enter your PIN</div>'+
      '<div class="pin-sub">Welcome to Forge</div>'+
      '<div class="dots" id="pinDots"></div>'+
      '<div class="keypad" id="keypad"></div>'+
      '<button class="pin-alt" id="newAcctBtn">Create a new account</button>'+
    '</div>');
  buildKeypad();renderPinDots();
  document.getElementById('newAcctBtn').onclick=showSignupScreen;
}
function renderPinDots(){var d=document.getElementById('pinDots');if(!d)return;d.className='dots';d.innerHTML='';for(var i=0;i<4;i++){var x=document.createElement('div');x.className='dot-pin';d.appendChild(x);}updateDots();}
function updateDots(){var d=document.getElementById('pinDots');if(!d)return;var ch=d.children;for(var i=0;i<ch.length;i++)ch[i].className='dot-pin'+(i<pinEntry.length?' on':'');}
function buildKeypad(){
  var kp=document.getElementById('keypad');if(!kp)return;kp.innerHTML='';
  ['1','2','3','4','5','6','7','8','9','','0','del'].forEach(function(k){
    var b=document.createElement('button');
    if(k===''){b.className='key blank';}
    else if(k==='del'){b.className='key fn';b.textContent='Delete';bindKey(b,pinDel);}
    else{b.className='key';b.textContent=k;bindKey(b,(function(n){return function(){pinPush(n);};})(k));}
    kp.appendChild(b);
  });
}
function bindKey(b,fn){b.addEventListener('pointerdown',function(e){e.preventDefault();fn();},{passive:false});}
function pinPush(n){if(pinBusy||pinEntry.length>=4)return;pinEntry+=n;updateDots();if(pinEntry.length===4){pinBusy=true;setTimeout(pinSubmit,120);}}
function pinDel(){if(pinBusy)return;pinEntry=pinEntry.slice(0,-1);updateDots();}
function pinError(){var d=document.getElementById('pinDots');if(d)d.classList.add('err');if(navigator.vibrate)navigator.vibrate(80);setTimeout(function(){pinEntry='';pinBusy=false;if(d)d.classList.remove('err');updateDots();},440);}
async function pinSubmit(){
  var hash=await sha256hex(pinEntry);
  setSyncState('syncing');
  try{
    var r=await sb.rpc('forge_login',{p_hash:hash});
    if(r.error)throw r.error;
    var u=r.data&&r.data[0];
    if(u){
      currentUser={id:u.id,name:u.name,role:u.role,avatar_url:u.avatar_url};
      setSyncState('');
      recordLogin();
      enterApp();
    } else {setSyncState('');pinError();}
  }catch(e){setSyncState('error');pinError();}
}

// ---- Signup (task #19) ----
function showSignupScreen(){
  mountAuth(
    '<button class="pin-back" id="suBack">'+icon('back',20)+'</button>'+
    '<div class="pin-wrap">'+
      '<div class="pin-logo"><img src="'+ICON_SRC+'" alt="Forge"/></div>'+
      '<div class="pin-title">Create your account</div>'+
      '<div class="pin-sub">Pick a name and a 4-digit PIN.<br>This is how you\'ll log in.</div>'+
      '<input class="signup-field" id="suName" placeholder="Your name" autocomplete="off" maxlength="24"/>'+
      '<input class="signup-field" id="suPin" placeholder="4-digit PIN" inputmode="numeric" maxlength="4" autocomplete="off"/>'+
      '<input class="signup-field" id="suPin2" placeholder="Confirm PIN" inputmode="numeric" maxlength="4" autocomplete="off"/>'+
      '<button class="signup-btn" id="suGo">Create account</button>'+
    '</div>');
  document.getElementById('suBack').onclick=showPinScreen;
  var go=document.getElementById('suGo');
  go.onclick=doSignup;
  setTimeout(function(){var n=document.getElementById('suName');if(n)n.focus();},120);
}
async function doSignup(){
  var name=(document.getElementById('suName').value||'').trim();
  var pin=(document.getElementById('suPin').value||'').trim();
  var pin2=(document.getElementById('suPin2').value||'').trim();
  if(!name){toast('Enter your name');return;}
  if(!/^[0-9]{4}$/.test(pin)){toast('PIN must be exactly 4 digits');return;}
  if(pin!==pin2){toast('PINs don\'t match');return;}
  var go=document.getElementById('suGo');go.disabled=true;go.textContent='Creating…';
  setSyncState('syncing');
  var hash=await sha256hex(pin);
  try{
    var prof=await createProfile(name,'user',hash);   // forge_signup: errors if PIN taken
    if(!prof)throw new Error('no profile');
    currentUser={id:prof.id,name:prof.name,role:prof.role,avatar_url:null};
    setSyncState('');
    recordLogin();
    // brand-new account → tutorial, then empty home (task #17)
    enterApp(true);
  }catch(e){
    setSyncState('');
    go.disabled=false;go.textContent='Create account';
    if(e&&/PIN_TAKEN/.test(e.message||e.toString())){toast('That PIN is taken — pick another');}
    else{toast('Something went wrong — try again');}
  }
}

function buildScreen(tab){
  var el=document.createElement('div');

  return el;
}
async function loadAndRender(tab,el){var html=await renderTab(tab);if(el&&el.parentNode)el.innerHTML=html;}

function go(tab,instant){
  if(tab===activeTab&&current&&!instant)return;
  var forward=(tab!==null);
  var stage=document.getElementById('stage');
  var oldEl=current?current.el:null;
  var newEl=buildScreen(tab);
  stage.appendChild(newEl);
  renderHeader(tab);manageFab(tab);
  if(tab===null)layoutHome(newEl);
  if(instant||!oldEl){newEl.classList.add('show');if(oldEl&&oldEl.parentNode)oldEl.parentNode.removeChild(oldEl);}
  else{
    newEl.classList.add(forward?'enter-right':'enter-left');void newEl.offsetWidth;
    newEl.classList.remove('enter-right','enter-left');newEl.classList.add('show');
    oldEl.classList.remove('show');oldEl.classList.add(forward?'exit-left':'exit-right');
    var dead=oldEl;var done=function(){if(dead&&dead.parentNode)dead.parentNode.removeChild(dead);};
    dead.addEventListener('transitionend',done,{once:true});setTimeout(done,650);
  }
  activeTab=tab;current={tab:tab,el:newEl};newEl.scrollTop=0;
}
function back(){if(activeTab!==null)go(null);}

function manageFab(tab){
  var old=document.querySelector('.fab');if(old)old.remove();
  if(tab&&ADDABLE[tab]){
    var fab=document.createElement('button');fab.className='fab';fab.innerHTML=icon('plus',26,2.6);
    fab.onclick=function(){addItemSheet(tab);};
    document.getElementById('app').appendChild(fab);
  }
}
function layoutHome(scope){
  var grid=(scope||document).querySelector('#homeGrid');if(!grid)return;
  var w=window.innerWidth;var cols=w>=1500?5:w>=1100?4:w>=600?3:2;
  var tiles=[];for(var i=0;i<grid.children.length;i++){var c=grid.children[i];if(!c.classList.contains('hero')&&c.style.gridColumn!=='1 / -1'&&!(c.style.gridColumn||'').includes('-1'))tiles.push(c);}
  tiles.forEach(function(t){t.style.gridColumn='';});
  var n=tiles.length;if(!n)return;var rem=n%cols;
  if(rem!==0)tiles[n-1].style.gridColumn='span '+(cols-rem+1);
}
async function refreshScreen(){
  if(!current)return;var sc=current.el.scrollTop;
  if(current.tab===null){current.el.innerHTML=homeHTML();layoutHome(current.el);}
  else{var html=await renderTab(current.tab);if(current.el&&current.el.parentNode)current.el.innerHTML=html;}
  current.el.scrollTop=sc;manageFab(current.tab);
}

// edge swipe-back
(function(){
  var startX=0,startY=0,decided=false,dragging=false,secEl=null,homeEl=null,W=0;
  function start(e){if(activeTab===null||!current)return;var t=e.touches?e.touches[0]:e;if(t.clientX>32)return;startX=t.clientX;startY=t.clientY;W=window.innerWidth||360;decided=false;dragging=false;secEl=current.el;homeEl=null;}
  function move(e){if(activeTab===null||!secEl)return;var t=e.touches?e.touches[0]:e;var dx=t.clientX-startX,dy=t.clientY-startY;if(!decided){if(Math.abs(dx)<6&&Math.abs(dy)<6)return;if(Math.abs(dy)>Math.abs(dx)){secEl=null;return;}decided=true;dragging=true;homeEl=buildScreen(null);homeEl.classList.add('enter-left');document.getElementById('stage').insertBefore(homeEl,secEl);layoutHome(homeEl);secEl.classList.add('dragging');homeEl.classList.add('dragging');renderHeader(null);}if(!dragging)return;if(e.cancelable)e.preventDefault();dx=Math.max(0,dx);var p=Math.min(1,dx/W);secEl.style.transform='translateX('+dx+'px)';homeEl.style.transform='translateX('+(-24+24*p)+'%)';homeEl.style.filter='brightness('+(0.92+0.08*p)+')';}
  function end(e){if(!dragging||!secEl||!homeEl){secEl=null;homeEl=null;dragging=false;decided=false;return;}var t=(e.changedTouches?e.changedTouches[0]:e);var dx=Math.max(0,t.clientX-startX);var s=secEl,hm=homeEl,EASE='transform .4s cubic-bezier(.22,.85,.26,1)';s.classList.remove('dragging');hm.classList.remove('dragging');if(dx>W*0.30){s.style.transition=EASE;s.style.transform='translateX(100%)';hm.classList.remove('enter-left');hm.style.transition=EASE+',filter .4s ease';hm.style.transform='translateX(0)';hm.style.filter='none';var fin=function(){if(s&&s.parentNode)s.parentNode.removeChild(s);hm.classList.add('show');hm.style.transition='';hm.style.transform='';hm.style.filter='';};s.addEventListener('transitionend',fin,{once:true});setTimeout(fin,520);activeTab=null;current={tab:null,el:hm};manageFab(null);renderHeader(null);}else{s.style.transition=EASE;s.style.transform='translateX(0)';var rem=function(){if(hm&&hm.parentNode)hm.parentNode.removeChild(hm);s.style.transition='';s.style.transform='';};s.addEventListener('transitionend',rem,{once:true});setTimeout(rem,520);renderHeader(activeTab);}secEl=null;homeEl=null;dragging=false;decided=false;}
  var st=document.getElementById('stage');

function openAccount(){
  var o=document.createElement('div');o.className='overlay';o.id='ovl';
  o.innerHTML='<div class="sheet" id="acctSheet" onclick="event.stopPropagation()"></div>';
  o.onclick=closeOverlay;document.getElementById('app').appendChild(o);
  refreshAccountSheet();
}
function refreshAccountSheet(){
  var s=document.getElementById('acctSheet');if(!s)return;
  var nm=currentUser?currentUser.name:'You';
  s.innerHTML='<div class="acct-head">'+avatarHTML(nm,64,currentUser?currentUser.avatar_url:null)+
    '<div><div class="serif" style="font-size:20px;font-weight:600">'+esc(nm)+'</div>'+
    '<div class="rs">'+(isOwner()?'Owner account':'Member')+'</div></div></div>'+
    '<div class="photo-ctrls">'+
      '<label class="btn btn-ghost" style="cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px">'+icon('camera',16)+' '+(currentUser&&currentUser.avatar_url?'Change photo':'Add photo')+'<input type="file" accept="image/*" style="display:none" id="photoInput"/></label>'+
      (currentUser&&currentUser.avatar_url?'<button class="btn btn-ghost" id="photoRemove">Remove</button>':'')+
    '</div>'+
    '<div class="acct-list">'+
      '<button class="acct-item" onclick="openChangeName()">'+icon('contacts',18)+'<span>Edit name</span>'+icon('chev',16)+'</button>'+
      '<button class="acct-item" onclick="openChangePIN()">'+icon('pin',18)+'<span>Change PIN</span>'+icon('chev',16)+'</button>'+
      '<div class="acct-item theme-row"><span style="display:flex;align-items:center;gap:12px">'+icon('moon',18)+'Appearance</span>'+
      '<div class="seg sm"><button class="seg-btn'+(getTheme()!=='dark'?' on':'')+'" onclick="setTheme(\'light\');refreshAccountSheet()">Light</button>'+
      '<button class="seg-btn'+(getTheme()==='dark'?' on':'')+'" onclick="setTheme(\'dark\');refreshAccountSheet()">Dark</button></div></div>'+
      (isOwner()?'<button class="acct-item" onclick="closeOverlay();go(\'owner\')">'+icon('grid',18)+'<span>Owner Dashboard</span>'+icon('chev',16)+'</button>':'')+
    '</div>'+
    '<button class="btn btn-ghost" onclick="closeOverlay();logout()" style="width:100%;margin-top:6px">Log out</button>';
  var pi=document.getElementById('photoInput');if(pi)pi.addEventListener('change',onPhotoPicked);
  var pr=document.getElementById('photoRemove');if(pr)pr.onclick=async function(){await removeAvatar();refreshAccountSheet();renderHeader(activeTab);toast('Photo removed');};
}
async function onPhotoPicked(e){
  var f=e.target.files&&e.target.files[0];if(!f)return;
  toast('Uploading photo…');setSyncState('syncing');
  var url=await uploadAvatar(f);
  setSyncState(url?'':'error');
  if(url){refreshAccountSheet();renderHeader(activeTab);if(activeTab===null&&current){current.el.innerHTML=homeHTML();layoutHome(current.el);}toast('Photo updated ✓');}
  else{toast('Upload failed — see setup note');}
}
function openChangeName(){
  openForm('Edit name','This is how you appear in Forge.',[{key:'name',label:'Name',value:currentUser?currentUser.name:''}],async function(v){
    if(!v.name)return;await updateProfileName(currentUser.id,v.name);currentUser.name=v.name;
    closeOverlay();renderHeader(activeTab);if(activeTab===null&&current){current.el.innerHTML=homeHTML();layoutHome(current.el);}toast('Name updated');
  });
}
function openChangePIN(){
  openForm('Change PIN','Enter a new 4-digit PIN.',[{key:'pin',label:'New PIN'}],async function(v){
    if(!/^[0-9]{4}$/.test(v.pin)){toast('PIN must be 4 digits');return;}
    var hash=await sha256hex(v.pin);
    var r=await sb.rpc('forge_set_pin',{p_id:currentUser.id,p_hash:hash});
    if(r.error){toast(/PIN_TAKEN/.test(r.error.message||'')?'That PIN is taken':'Could not update PIN');return;}
    closeOverlay();toast('PIN updated ✓');
  });
}
function logout(){currentUser=null;showPinScreen();}

async function renderTab(tab){
  if(tab==='today')return renderToday();
  if(tab==='users')return renderUsers();
  if(tab==='tabs')return renderTabManager();
  if(tab==='owner')return renderOwner();
  if(tab==='finances')return renderFinances();
  if(tab==='countdown')return renderCountdown();
  if(tab==='mealplanner')return renderMealPlanner();
  if(tab==='car')return renderCar();
  if(tab==='ai')return renderAI();
  if(tab==='calendar')return renderCalendar();
  if(tab==='contacts')return renderContacts();
  if(tab==='travel')return renderTravel();
  if(tab==='fitness')return renderFitness();
  if(tab==='health')return renderHealth();
  return renderGenericList(tab);
}

async function renderToday(){
  var tasks=await loadItems('work'),rems=await loadItems('reminders'),goals=await loadItems('goals');
  var h=new Date().getHours();
  var greet=h<12?'Good morning':h<18?'Good afternoon':'Good evening';
  var dateStr=new Date().toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'});
  var attention=[].concat(rems.slice(0,2).map(function(x){return{t:x.t,s:'Reminder · '+(x.s||''),c:'#7A72A8'};}),tasks.slice(0,2).map(function(x){return{t:x.t,s:'Task · '+(x.s||''),c:'#5B7894'};})).slice(0,4);
  return '<div class="stack">'+
    '<div class="card dark"><div class="small">'+dateStr+'</div><div class="serif" style="font-size:26px;font-weight:600;margin-top:2px">'+greet+(currentUser?', '+esc(currentUser.name.split(' ')[0]):'')+'</div>'+
    '<div style="font-size:14px;opacity:.82;margin-top:6px">'+tasks.length+' task'+(tasks.length!==1?'s':'')+' · '+rems.length+' reminder'+(rems.length!==1?'s':'')+' · '+goals.length+' habit'+(goals.length!==1?'s':'')+'</div></div>'+
    '<div class="card"><div class="ctitle">Needs your attention</div>'+
    (attention.length?attention.map(function(a){return '<div class="row"><span class="dot" style="background:'+a.c+'"></span><div style="flex:1"><div class="rt">'+esc(a.t)+'</div><div class="rs">'+esc(a.s)+'</div></div></div>';}).join(''):'<div class="row"><div class="rs">All clear — nothing needs you right now.</div></div>')+
    '</div></div>';
}

async function renderGenericList(tab){
  var items=await loadItems(tab);var t=catalogById(tab);var accent=(t&&t.chip)||'#8A8276';
  var rows=items.map(function(it){return '<div class="row"><span class="dot" style="background:'+accent+'"></span><div style="flex:1"><div class="rt">'+esc(it.t)+'</div>'+(it.s?'<div class="rs">'+esc(it.s)+'</div>':'')+'</div><button class="del" onclick="delItem(\''+it.id+'\',\''+tab+'\')">'+icon('x',15)+'</button></div>';}).join('');
  if(!items.length)rows='<div class="row"><div class="rs">Tap the green + button to add your first '+singular(t?t.label:'item')+'.</div></div>';
  return '<div class="stack"><div class="card"><div class="ctitle">'+esc(t?t.label:'Items')+'</div>'+rows+'</div></div>';
}

function ringSVG(pct,color,value,label){var r=27,c=2*Math.PI*r;return '<div style="display:flex;flex-direction:column;align-items:center;gap:6px"><svg width="64" height="64" style="transform:rotate(-90deg)"><circle cx="32" cy="32" r="'+r+'" fill="none" stroke="rgba(38,35,30,.08)" stroke-width="8"/><circle cx="32" cy="32" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="8" stroke-linecap="round" stroke-dasharray="'+c+'" stroke-dashoffset="'+(c-c*pct/100)+'"/></svg><div style="text-align:center;margin-top:-2px"><div style="font-weight:700;font-size:15px">'+value+'</div><div style="font-size:11px;color:var(--sub)">'+label+'</div></div></div>';}
async function renderFitness(){
  var items=await loadItems('fitness');
  var rows=items.length?items.map(function(it){return '<div class="row"><span class="dot" style="background:#5E8C61"></span><div style="flex:1"><div class="rt">'+esc(it.t)+'</div>'+(it.s?'<div class="rs">'+esc(it.s)+'</div>':'')+'</div><button class="del" onclick="delItem(\''+it.id+'\',\'fitness\')">'+icon('x',15)+'</button></div>';}).join(''):'<div class="row"><div class="rs">Tap + to log a workout.</div></div>';
  return '<div class="stack"><div class="card" style="display:flex;justify-content:space-around;padding:22px 14px">'+ringSVG(78,'#5E8C61','78%','Move')+ringSVG(55,'#C2724F','55%','Exercise')+ringSVG(92,'#5683A8','92%','Stand')+'</div><div class="card"><div class="ctitle">Workout log</div>'+rows+'</div></div>';
}
async function renderHealth(){
  var items=await loadItems('health');
  var rows=items.length?items.map(function(it){return '<div class="row"><span class="dot" style="background:#B5687C"></span><div style="flex:1"><div class="rt">'+esc(it.t)+'</div>'+(it.s?'<div class="rs">'+esc(it.s)+'</div>':'')+'</div><button class="del" onclick="delItem(\''+it.id+'\',\'health\')">'+icon('x',15)+'</button></div>';}).join(''):'<div class="row"><div class="rs">Tap + to add an entry.</div></div>';
  return '<div class="stack"><div class="two"><div class="card stat"><div class="k">'+icon('drop',14)+' Water</div><div class="v">1.6 L</div><div class="d">of 2.5 L</div></div><div class="card stat"><div class="k">'+icon('moon',14)+' Sleep</div><div class="v">7h 12m</div><div class="d">last night</div></div></div><div class="card"><div class="ctitle">Health log</div>'+rows+'</div></div>';
}
function renderCalendar(){
  var cells='';for(var i=0;i<35;i++){var n=i-3;var on=n===29;var ev=[12,18,29].indexOf(n)>=0;cells+='<div class="cell'+(on?' today':'')+'" style="color:'+(on?'#fff':(n>0&&n<=31?'var(--ink)':'transparent'))+'">'+(n>0&&n<=31?n:'')+(ev&&!on?'<span class="evdot"></span>':'')+'</div>';}
  return Promise.resolve('<div class="stack"><div class="card"><div class="serif" style="font-size:18px;font-weight:600;margin-bottom:14px">May 2026</div><div class="cal">'+['M','T','W','T','F','S','S'].map(function(d){return '<div class="h">'+d+'</div>';}).join('')+cells+'</div></div></div>');
}

function renderTravel(){
  return Promise.resolve('<div class="stack"><div class="card" style="background:linear-gradient(135deg,#5683A8,#3F6B5B);color:#F6F2E9;padding:22px"><div style="font-size:13px;opacity:.85;display:flex;align-items:center;gap:6px">'+icon('pin',14)+' Next trip</div><div class="serif" style="font-size:24px;font-weight:600;margin-top:4px">Byron Bay</div><div style="font-size:13px;opacity:.85;margin-top:4px">14 – 18 Jul · in 46 days</div></div></div>');

async function renderTabManager(){
  var en=enabledTabs();var all=CATALOG();
  var enHtml=en.length?en.map(function(id){var t=catalogById(id);if(!t)return '';return '<div class="trow"><div class="chip sm" style="background:'+t.chip+'">'+icon(t.icon||id,16,2.2)+'</div><div style="flex:1"><div class="rt">'+esc(t.label)+'</div><div class="rs">'+esc(t.sub)+'</div></div><button class="tbtn rm" onclick="removeTab(\''+id+'\')">Remove</button></div>';}).join(''):'<div class="rs" style="padding:8px 4px">No tabs yet — add some below.</div>';
  var avail=all.filter(function(t){return en.indexOf(t.id)<0;});
  var avHtml=avail.length?avail.map(function(t){return '<div class="trow"><div class="chip sm" style="background:'+t.chip+'">'+icon(t.icon||t.id,16,2.2)+'</div><div style="flex:1"><div class="rt">'+esc(t.label)+'</div><div class="rs">'+esc(t.sub)+'</div></div><button class="tbtn add" onclick="addTab(\''+t.id+'\')">Add</button></div>';}).join(''):'<div class="rs" style="padding:8px 4px">You\'ve added everything!</div>';
  return '<div class="stack"><div class="card"><div class="ctitle">Your tabs</div>'+enHtml+'</div><div class="card"><div class="ctitle">Add a tab</div>'+avHtml+'</div></div>';
}

// ---------- USERS ----------
async function renderUsers(){
  var profiles=await loadAllProfiles();
  return '<div class="stack"><div class="card"><div class="ctitle">Who can use Forge</div>'+
    profiles.map(function(u){return '<div class="row">'+avatarHTML(u.name,34,u.avatar_url)+'<div style="flex:1"><div class="rt">'+esc(u.name)+'</div><div class="rs">'+(u.role==='master'?'Owner':'Member')+'</div></div>'+(u.role==='master'?'<span class="badge">Owner</span>':'<button class="tbtn rm" onclick="removeUser(\''+u.id+'\')">Remove</button>')+'</div>';}).join('')+'</div>'+
    '<button class="reqbtn" onclick="openAddUser()">'+icon('plus',16)+' Add a user</button></div>';
}
function openAddUser(){
  openForm('Add a user','They log in with their own PIN and get their own private space.',[{key:'name',label:'Name'},{key:'pin',label:'4-digit PIN'}],async function(v){
    if(!v.name){toast('Enter a name');return;}
    if(!/^[0-9]{4}$/.test(v.pin)){toast('PIN must be 4 digits');return;}
    var hash=await sha256hex(v.pin);
    try{await createProfile(v.name,'user',hash);closeOverlay();if(current&&current.tab==='owner')refreshScreen();else go('users');toast('User added ✓');}
    catch(e){toast('Error — PIN may be in use');}
  });
}
async function removeUser(id){if(!confirm('Remove this user and all their data?'))return;await deleteProfile(id);refreshScreen();toast('Removed');}

var financeSub='overview';
function setFinSub(s){financeSub=s;refreshScreen();}
async function renderFinances(){
  var seg='<div class="seg"><button class="seg-btn'+(financeSub==='overview'?' on':'')+'" onclick="setFinSub(\'overview\')">Overview</button><button class="seg-btn'+(financeSub==='networth'?' on':'')+'" onclick="setFinSub(\'networth\')">Net worth</button><button class="seg-btn'+(financeSub==='budget'?' on':'')+'" onclick="setFinSub(\'budget\')">Budget</button><button class="seg-btn'+(financeSub==='goals'?' on':'')+'" onclick="setFinSub(\'goals\')">Goals</button></div>';
  var body;
  if(financeSub==='networth')body=await renderNetWorth();
  else if(financeSub==='budget')body=await renderBudget();
  else if(financeSub==='goals')body=await renderFinGoals();
  else body=await renderFinOverview();
  return seg+body;
}
async function renderFinOverview(){
  var bal=await getFinBalance();
  var START=new Date(2026,4,18),DEPARTURE=new Date(2026,10,29);
  var BONDS=4420,PROJ_GBP=18254.24,TOTAL_GBP=22674.24;
  var M=[{d:'31/05/26',a:111.02,g:58.92},{d:'14/06/26',a:823.29,g:436.92},{d:'28/06/26',a:1281.35,g:680.01},{d:'12/07/26',a:1987.35,g:1054.69},{d:'26/07/26',a:6460.38,g:3428.52},{d:'09/08/26',a:8432.41,g:4475.08},{d:'23/08/26',a:10181.41,g:5403.27},{d:'06/09/26',a:11554.47,g:6131.96},{d:'20/09/26',a:13478.47,g:7153.02},{d:'04/10/26',a:14589.53,g:7742.66},{d:'18/10/26',a:16513.53,g:8763.73},{d:'01/11/26',a:17904.54,g:9501.94},{d:'15/11/26',a:31696.54,g:16821.35},{d:'29/11/26',a:34396.54,g:18254.24}];
  function pd(s){var p=s.split('/');return new Date(2000+ +p[2],+p[1]-1,+p[0]);}
  function gbp(v){return '&#163;'+Number(v).toLocaleString('en-GB',{maximumFractionDigits:0});}
  function aud(v){return 'A$'+Number(v).toLocaleString('en-AU',{maximumFractionDigits:0});}
  var now=new Date();
  var wLeft=Math.floor(Math.max(0,Math.round((DEPARTURE-now)/86400000))/7);
  var timePct=Math.min(100,Math.max(0,Math.round((now-START)/(DEPARTURE-START)*100)));
  var prevM=null,nextM=null,i;
  for(i=0;i<M.length;i++){if(pd(M[i].d)<=now)prevM=M[i];else{nextM=M[i];break;}}
  if(!nextM)nextM=M[M.length-1];
  var pDt=prevM?pd(prevM.d):START,nDt=pd(nextM.d);
  var segPct=Math.min(100,Math.max(0,Math.round((now-pDt)/(nDt-pDt)*100)));
  var projNow=(prevM?prevM.a:0)+(nextM.a-(prevM?prevM.a:0))*segPct/100;
  var diff=bal!==null?Number(bal)-projNow:null;
  var nDtStr=nDt.toLocaleDateString('en-GB',{day:'numeric',month:'short'});
  var diffHtml=diff!==null?'<span style="font-weight:600;color:'+(diff>=0?'#5E8C61':'#B5687C')+'">'+(diff>=0?'▲ ahead ':'▼ behind ')+aud(Math.abs(diff))+'</span>':'';
  var balHtml=bal!==null?'<div style="font-weight:600;font-size:15px">Balance: '+aud(bal)+'</div><div style="font-size:12.5px;color:var(--sub);margin-top:2px">projected: '+aud(projNow)+' — tap to update</div>':'<div style="font-weight:600;font-size:15px">Log your AUD balance</div><div style="font-size:12.5px;color:var(--sub);margin-top:2px">See if you\'re ahead or behind</div>';
  var SPEND=[{n:'Rent',a:8010,c:'#5B7894'},{n:'Food',a:7975,c:'#C2724F'},{n:'Wants',a:3739,c:'#9466A5'},{n:'Loan',a:1325,c:'#B5687C'},{n:'Gym',a:1197,c:'#5E8C61'},{n:'Electricity',a:575,c:'#B9A23F'}];
  return '<div class="stack">'+
    '<div class="card" style="background:linear-gradient(135deg,#23493A,#173026);color:#F6F2E9;padding:22px"><div style="font-size:12px;opacity:.8;letter-spacing:.06em;text-transform:uppercase">✈️ Countdown to England</div><div class="serif" style="font-size:38px;font-weight:600;margin-top:8px;line-height:1">'+gbp(TOTAL_GBP)+'</div><div style="font-size:13px;opacity:.8;margin-top:4px">projected when you land · '+wLeft+' weeks to go</div><div style="margin-top:14px;height:6px;background:rgba(255,255,255,.15);border-radius:6px;overflow:hidden"><div style="width:'+timePct+'%;height:100%;background:#CDA968;border-radius:6px"></div></div><div style="display:flex;justify-content:space-between;font-size:11px;opacity:.65;margin-top:5px"><span>18 May</span><span>'+timePct+'%</span><span>29 Nov</span></div><div style="margin-top:14px;padding-top:14px;border-top:1px solid rgba(255,255,255,.12);display:flex;gap:18px"><div><div style="font-size:11px;opacity:.65">Aus (GBP)</div><div style="font-weight:700;font-size:16px">'+gbp(PROJ_GBP)+'</div></div><div><div style="font-size:11px;opacity:.65">Bonds</div><div style="font-weight:700;font-size:16px">'+gbp(BONDS)+'</div></div><div><div style="font-size:11px;opacity:.65">Rate</div><div style="font-weight:700;font-size:16px">0.5307</div></div></div></div>'+
    '<div class="card"><div class="ctitle">Next milestone</div><div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px"><div><div style="font-weight:700;font-size:22px">'+gbp(nextM.g)+'</div><div style="font-size:12px;color:var(--sub);margin-top:2px">by '+nDtStr+'</div></div>'+(prevM?'<div style="text-align:right"><div style="font-size:11px;color:var(--sub)">last checkpoint</div><div style="font-weight:600;font-size:14px;color:var(--sub)">'+gbp(prevM.g)+'</div></div>':'')+'</div><div class="bar"><div style="width:'+segPct+'%;background:var(--accent)"></div></div><div style="display:flex;justify-content:space-between;font-size:11.5px;color:var(--sub);margin-top:5px"><span>'+segPct+'% of this fortnight</span>'+diffHtml+'</div></div>'+
    '<div class="card" style="display:flex;align-items:center;gap:12px"><div style="flex:1">'+balHtml+'</div><button onclick="updateFinBal()" style="padding:10px 16px;background:var(--accent);color:#fff;border:none;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit">'+(bal!==null?'Update':'Log')+'</button></div>'+
    '<div class="card"><div class="ctitle">Where the money goes</div><div style="display:grid;gap:11px;padding-top:2px">'+SPEND.map(function(s){return '<div><div style="display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:5px"><span style="font-weight:600">'+s.n+'</span><span style="color:var(--sub)">'+aud(s.a)+'</span></div><div class="bar"><div style="width:'+(s.a/SPEND[0].a*100)+'%;background:'+s.c+'"></div></div></div>';}).join('')+'</div></div></div>';
}
function updateFinBal(){openForm('Log balance','Your current AUD savings.',[{key:'bal',label:'Amount (A$)',numeric:true}],async function(v){if(!v.bal||isNaN(Number(v.bal))){toast('Enter a number');return;}await setFinBalance(Number(v.bal));closeOverlay();await refreshScreen();toast('Saved ✓');});}
async function renderNetWorth(){
  var o=await getNetWorth();var sa=o.assets.reduce(function(s,x){return s+x.a;},0);var sl=o.liabilities.reduce(function(s,x){return s+x.a;},0);
  function rows(k){var arr=o[k];if(!arr.length)return '<div class="row"><div class="rs">Nothing yet.</div></div>';return arr.map(function(x){return '<div class="row"><div style="flex:1"><div class="rt">'+esc(x.n)+'</div></div><div class="rs" style="margin-right:8px">A$'+x.a.toLocaleString()+'</div><button class="del" onclick="delNW(\''+x.id+'\')">'+icon('x',14)+'</button></div>';}).join('');}
  return '<div class="stack"><div class="card dark"><div class="small">Net worth</div><div class="serif" style="font-size:34px;font-weight:600;margin-top:2px">A$'+(sa-sl).toLocaleString()+'</div><div style="font-size:13px;opacity:.8;margin-top:4px">A$'+sa.toLocaleString()+' assets · A$'+sl.toLocaleString()+' owed</div></div><div class="card"><div class="ctitle">Assets</div>'+rows('assets')+'<button class="reqbtn" style="margin-top:10px" onclick="addNW(\'asset\')">'+icon('plus',16)+' Add asset</button></div><div class="card"><div class="ctitle">Liabilities</div>'+rows('liabilities')+'<button class="reqbtn" style="margin-top:10px" onclick="addNW(\'liability\')">'+icon('plus',16)+' Add liability</button></div></div>';
}

async function renderCountdown(){
  var a=await getCountdowns();var now=new Date();
  var cards=a.map(function(c){var t=new Date(c.d+'T00:00:00');var days=Math.ceil((t-now)/86400000);var done=(t-now)<=0;return '<div class="card cd-card"><div style="display:flex;justify-content:space-between;align-items:flex-start"><div><div class="rs">'+(done?'Arrived':'Counting down')+'</div><div class="serif" style="font-size:21px;font-weight:600;margin-top:2px">'+esc(c.n)+'</div></div><button class="del" onclick="delCD(\''+c.id+'\')">'+icon('x',15)+'</button></div><div class="cd-big">'+(done?'🎉':Math.max(0,days))+(done?'':'<small style="font-family:\'DM Sans\',sans-serif;font-size:14px;font-weight:600;color:var(--sub);margin-left:8px">days</small>')+'</div><div class="rs">'+t.toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long',year:'numeric'})+'</div></div>';}).join('');
  if(!a.length)cards='<div class="card"><div class="row"><div class="rs">No countdowns yet — add your first below.</div></div></div>';

async function renderCar(){

  function rf(f,label,icn){var v=c[f]||'';var d=du(v);var sub=v?(d!==null?(d<0?'Overdue by '+(-d)+' days':d+' days away'):v):'Not set';var badge=(v&&d!==null)?'<div class="badge"'+(d<0?' style="background:rgba(181,104,124,.15);color:#B5687C"':'')+'>'+(d<0?'due':d+'d')+'</div>':'';return '<div class="row" onclick="editCarField(\''+f+'\',\''+label.replace(/'/g,"")+'\')"><div class="chip sm" style="background:#5B7894">'+icon(icn,16,2.2)+'</div><div style="flex:1"><div class="rt">'+label+'</div><div class="rs">'+esc(sub)+'</div></div>'+badge+'</div>';}
  return '<div class="stack"><div class="card"><div class="ctitle">Renewals &amp; service</div>'+rf('insurance','Insurance renewal','health')+rf('rego','Rego renewal','calendar')+rf('service','Next service','work')+rf('lastservice','Last service','clock')+'</div><div class="card"><div class="ctitle">Details</div>'+rf('make','Make &amp; model','car')+rf('plate','Plate','file')+rf('odo','Odometer','trend')+'</div></div>';

// ============================================================
// FORGE AI
// ============================================================
var aiMsgs=[];
async function aiAnswer(q){
  q=(q||'').toLowerCase();var u=currentUser?currentUser.name.split(' ')[0]:'there';
  if(/balance|money|how much|savings/.test(q)){var b=await getFinBalance();return b?'Your logged balance is A$'+Number(b).toLocaleString()+'. Open Finances for the full picture.':'You haven\'t logged a balance yet — open Finances and tap Log.';}
  if(/task|to.?do|work/.test(q)){var t=await loadItems('work');return t.length?'You\'ve got '+t.length+' task'+(t.length!==1?'s':'')+'. Top one: '+t[0].t+'.':'No tasks right now — nice.';}
  if(/remind/.test(q)){var r=await loadItems('reminders');return r.length?'Next reminder: '+r[0].t+' ('+(r[0].s||'')+').':'No reminders — all clear.';}
  if(/streak|habit|goal/.test(q)){var g=await loadItems('goals');return g.length?'You\'re tracking '+g.length+' habit'+(g.length!==1?'s':'')+'. Top: '+g[0].t+'.':'No habits yet — add some in Goals.';}
  if(/countdown|england|days until|holiday/.test(q)){var a=await getCountdowns();if(!a.length)return 'No countdowns yet — add one in the Countdown tab.';var c=a[0];var d=Math.ceil((new Date(c.d+'T00:00:00')-new Date())/86400000);return Math.max(0,d)+' days until '+c.n+'.';}
  if(/meal|dinner|lunch|food|eat/.test(q)){var days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];var dd=days[new Date().getDay()];var m=await getMeals();var dn=(m[dd]&&m[dd].d);return dn?'Tonight ('+dd+') you\'ve planned: '+dn+'.':'No dinner planned today — open Meal Planner to set one.';}
  if(/car|rego|insurance|service/.test(q)){var cv=await getCar();var bits=[];if(cv.insurance)bits.push('insurance: '+cv.insurance);if(cv.rego)bits.push('rego: '+cv.rego);return bits.length?'Car — '+bits.join(' · '):'No car details saved yet.';}
  if(/hello|^hey|^hi\b|morning|how are/.test(q))return 'Hey '+u+'! Ask me about your tasks, reminders, balance, habits, countdown, meals or car.';
  if(/help|what can|who are/.test(q))return 'I\'m Forge AI. I answer from your own data — try "what\'s my balance", "how many tasks", "days until my trip", "what\'s for dinner", or "when\'s my rego due".';
  return 'I can\'t answer that yet — but ask me about your tasks, reminders, finances, habits, countdown, meals or car.';
}
function aiThreadHTML(){if(!aiMsgs.length)return '<div class="ai-empty">'+icon('spark',30,1.8)+'<div class="rt" style="margin-top:10px">Ask me anything about your Forge</div><div class="rs" style="margin-top:4px">"What\'s my balance?" · "Any tasks?" · "Days until my trip?"</div></div>';return aiMsgs.map(function(m){return '<div class="ai-msg '+m.r+'">'+esc(m.t)+'</div>';}).join('');}
function renderAI(){return Promise.resolve('<div class="ai-wrap"><div class="ai-thread" id="aiThread">'+aiThreadHTML()+'</div><div class="ai-bar"><input id="aiInput" placeholder="Ask Forge AI…" autocomplete="off" onkeydown="if(event.key===\'Enter\')aiSend()"/><button onclick="aiSend()">'+icon('send',18,2.2)+'</button></div></div>');}
async function aiSend(){var i=document.getElementById('aiInput');var v=i?i.value.trim():'';if(!v)return;aiMsgs.push({r:'me',t:v});var ans=await aiAnswer(v);aiMsgs.push({r:'ai',t:ans});if(current&&current.tab==='ai'){var th=current.el.querySelector('#aiThread');if(th){th.innerHTML=aiThreadHTML();th.scrollTop=th.scrollHeight;}}if(i){i.value='';i.focus();}}

// ============================================================
// OWNER DASHBOARD (tasks #9, #12)
// ============================================================
async function renderOwner(){
  if(!isOwner())return '<div class="stack"><div class="card"><div class="rs">Owner only.</div></div></div>';
  var profiles=await loadAllProfiles();
  var reqs=await getRequestsDB();
  var logins=await getLoginEvents();
  var now=new Date();var today=now.toDateString();var weekAgo=now.getTime()-7*86400000;
  var activeToday={},weekCount=0,perUser={};
  logins.forEach(function(l){var ts=new Date(l.created_at).getTime();if(new Date(l.created_at).toDateString()===today)activeToday[l.user_id]={name:l.user_name,t:ts};if(ts>=weekAgo){weekCount++;perUser[l.user_name]=(perUser[l.user_name]||0)+1;}});
  var activeHtml=Object.keys(activeToday).length?Object.keys(activeToday).map(function(id){var a=activeToday[id];return '<div class="row">'+avatarHTML(a.name,34,null)+'<div style="flex:1"><div class="rt">'+esc(a.name)+'</div><div class="rs">last in '+timeAgo(a.t)+'</div></div><span class="dot" style="background:#5E8C61"></span></div>';}).join(''):'<div class="row"><div class="rs">No logins today yet.</div></div>';
  var weekHtml=Object.keys(perUser).length?Object.keys(perUser).sort(function(a,b){return perUser[b]-perUser[a];}).map(function(nm){return '<div class="row"><div style="flex:1"><div class="rt">'+esc(nm)+'</div></div><div class="badge">'+perUser[nm]+' login'+(perUser[nm]!==1?'s':'')+'</div></div>';}).join(''):'<div class="row"><div class="rs">No logins this week.</div></div>';
  var pHtml=profiles.map(function(u){return '<div class="row">'+avatarHTML(u.name,34,u.avatar_url)+'<div style="flex:1"><div class="rt">'+esc(u.name)+(u.role==='master'?' <span class="badge">You</span>':'')+'</div><div class="rs">'+(u.role==='master'?'Owner':'Member')+'</div></div>'+(u.role!=='master'?'<button class="tbtn rm" onclick="removeUser(\''+u.id+'\')">Remove</button>':'')+'</div>';}).join('');
  var rHtml=reqs.length?reqs.map(function(r){return '<div class="row"><span class="dot" style="background:#B4925A"></span><div style="flex:1"><div class="rt">'+esc(r.body)+'</div><div class="rs">'+esc(r.user_name||'Someone')+' · '+timeAgo(new Date(r.created_at).getTime())+'</div></div></div>';}).join(''):'<div class="row"><div class="rs">No requests yet.</div></div>';
  return '<div class="stack">'+
    '<div class="card dark"><div class="small">Owner Dashboard</div><div class="serif" style="font-size:24px;font-weight:600;margin-top:2px">'+Object.keys(activeToday).length+' active today</div><div style="font-size:14px;opacity:.82;margin-top:6px">'+profiles.length+' member'+(profiles.length!==1?'s':'')+' · '+weekCount+' login'+(weekCount!==1?'s':'')+' this week</div></div>'+
    '<div class="card"><div class="ctitle">Active today</div>'+activeHtml+'</div>'+
    '<div class="card"><div class="ctitle">Logins this week</div>'+weekHtml+'<div class="note">'+icon('clock',13)+'<div>A weekly Monday 9am email is set up via Supabase (see setup steps) — this shows the same data live.</div></div></div>'+
    '<div class="card"><div class="ctitle">Members</div>'+pHtml+'<button class="reqbtn" onclick="openAddUser()" style="margin-top:12px">'+icon('plus',16)+' Add a user</button></div>'+
    '<div class="card"><div class="ctitle">Feature requests</div>'+rHtml+'<div class="note">'+icon('send',13)+'<div>New requests email you at '+esc(OWNER_EMAIL)+' once the email function is deployed.</div></div></div>'+
    '<div class="card"><div class="ctitle">Invite someone</div><div class="rs" style="margin-bottom:10px">Share a personal invite link to Forge.</div><button class="btn btn-primary" onclick="copyInvite()" style="width:100%">'+icon('share',16)+' Copy invite link</button></div></div>';
}
function copyInvite(){
  var who=encodeURIComponent(currentUser?currentUser.name:'a friend');
  var url=location.origin+location.pathname+'?invite='+who;
  if(navigator.share){navigator.share({title:'Forge',text:'You\'re invited to Forge — an app built by Harvey Betts',url:url}).catch(function(){});return;}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(url).then(function(){toast('Invite link copied ✓');},function(){prompt('Copy this link:',url);});}
  else prompt('Copy this link:',url);
}

// ============================================================
// INVITE LANDING (task #15)
// ============================================================
function inviteName(){var m=(location.search+'&'+location.hash).match(/invite=([^&#]+)/);return m?decodeURIComponent(m[1].replace(/\+/g,' ')):null;}
function showInvite(){
  var who=inviteName();
  var v=document.createElement('div');v.className='invite-screen';v.id='invite';
  v.innerHTML='<div class="glow"></div><div class="inv-card"><div class="inv-mark"><img src="'+ICON_SRC+'" alt="Forge"/></div><div class="inv-tag">You\'re personally invited</div><div class="inv-h">Welcome to Forge</div><div class="inv-sub">An app built by Harvey Betts'+(who&&who.toLowerCase()!=='a friend'?(' — invited by '+esc(who)):'')+'.</div><div class="inv-steps"><div class="inv-step"><span>1</span><div>Tap the <b>Share</b> icon in your browser</div></div><div class="inv-step"><span>2</span><div>Choose <b>Add to Home Screen</b></div></div><div class="inv-step"><span>3</span><div>Open Forge from your home screen like a real app</div></div></div><button class="signup-btn" id="invGo" style="margin-top:24px">Continue</button></div>';
  document.getElementById('app').appendChild(v);
  document.getElementById('invGo').onclick=function(){v.classList.add('hide');setTimeout(function(){if(v.parentNode)v.parentNode.removeChild(v);showPinScreen();},560);};
}

// ============================================================
// SIZING / ZOOM LOCK (tasks #3, #4, #14)
// ============================================================
function sizeApp(){var h=window.innerHeight;document.documentElement.style.setProperty('--app-h',h+'px');var app=document.getElementById('app');if(app)app.style.height=h+'px';var home=document.querySelector('.screen.is-home');if(home)layoutHome(home);}
window.addEventListener('resize',sizeApp);
window.addEventListener('orientationchange',function(){setTimeout(sizeApp,180);setTimeout(sizeApp,400);});
// block pinch-zoom + double-tap-zoom (lock like a native app)
document.addEventListener('gesturestart',function(e){e.preventDefault();},{passive:false});
document.addEventListener('gesturechange',function(e){e.preventDefault();},{passive:false});
document.addEventListener('gestureend',function(e){e.preventDefault();},{passive:false});
var _lastTouch=0;
document.addEventListener('touchend',function(e){var now=Date.now();if(now-_lastTouch<=300){e.preventDefault();}_lastTouch=now;},{passive:false});
document.addEventListener('dblclick',function(e){e.preventDefault();},{passive:false});
document.addEventListener('wheel',function(e){if(e.ctrlKey)e.preventDefault();},{passive:false});
document.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&['+','-','=','0'].indexOf(e.key)>=0)e.preventDefault();});

// ============================================================
// BOOT (tasks #13, #16, #18) — intro → PIN/invite, no flash
// ============================================================
(function(){
  applyTheme(getTheme());
  sizeApp();
  // animate intro letters
  var w=document.getElementById('introWord');
  'FORGE'.split('').forEach(function(ch,i){var s=document.createElement('span');s.textContent=ch;s.style.animationDelay=(0.55+i*0.1)+'s';w.appendChild(s);});
  var fromInvite=/(?:[?&#])invite/.test(location.search+location.hash);
  // Build the home screen UNDER the intro so there's no flash when intro lifts.
  // But we must NOT show home until authed — so we only mount the intro now,
  // and reveal PIN exactly as the intro lifts (fixes glitch #13).
  setTimeout(function(){
    var intro=document.getElementById('intro');
    // mount auth/invite BEHIND the intro first, so when intro lifts the next screen is already there
    if(fromInvite){showInvite();}else{showPinScreen();}
    // ensure the freshly-mounted auth sits above home but below intro until lift
    intro.classList.add('hide');
    setTimeout(function(){if(intro&&intro.parentNode)intro.parentNode.removeChild(intro);},720);
  },4200); // longer, more premium load (task #16/#18)
})();
</script>
