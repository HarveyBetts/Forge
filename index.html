<title>Forge — Forge your life</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* ============ DESIGN TOKENS ============ */
:root{
  --e-out:cubic-bezier(.22,.61,.36,1);
  --e-slide:cubic-bezier(.22,.9,.3,1);
  --e-spring:cubic-bezier(.34,1.56,.64,1);
  --bg:#F3F5F8; --bg-2:#F7F9FC;
  --surface:#FFFFFF; --surface-2:#F7F9FC; --surface-3:#EDF1F7;
  --ink:#0F172A; --sub:#647084; --faint:#94A0B2;
  --line:rgba(15,23,42,.08); --line-2:rgba(15,23,42,.05); --hair:rgba(15,23,42,.12);
  --accent:#2F6BFF; --accent-2:#3E78FF; --accent-deep:#2257E6; --accent-ink:#FFFFFF; --accent-soft:rgba(47,107,255,.10);
  --grad:linear-gradient(135deg,#3E78FF 0%,#2257E6 100%);
  --grad-soft:linear-gradient(135deg,rgba(47,107,255,.10),rgba(47,107,255,.04));
  --danger:#DC2626; --warn:#D97706; --ok:#16A34A;
  --shadow:0 8px 24px -12px rgba(15,23,42,.12);
  --shadow-lg:0 16px 40px -18px rgba(15,23,42,.16);
  --mesh:radial-gradient(120% 70% at 50% -12%,rgba(47,107,255,.05),transparent 46%),#F3F5F8;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
html,body{overscroll-behavior:none;}
@media (hover:none) and (pointer:coarse){
  html{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
  input,textarea,select,[contenteditable],.ai-msg{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default;}
}
button,[onclick],.navi,.key,.evs-pill,.evs-sel{touch-action:manipulation;}
button,[onclick],input,select,textarea{touch-action:manipulation;}
body{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;}
html,body{margin:0;width:100%;height:100vh;height:100lvh;min-height:100vh;min-height:100lvh;overflow:hidden;overscroll-behavior:none;touch-action:none;}
html{background:#F3F5F8;}
body{position:relative;}
body{font-family:'Inter',system-ui,sans-serif;color:var(--ink);background:#F3F5F8;display:flex;justify-content:center;-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%;text-size-adjust:100%;letter-spacing:-0.01em;}
input,textarea{-webkit-user-select:text;user-select:text;font-size:16px;font-family:inherit;}
.serif{font-family:'Sora','Inter',sans-serif;letter-spacing:-0.025em;}
#app{width:100%;max-width:480px;position:fixed;top:0;bottom:0;left:0;right:0;height:100vh;height:100lvh;margin:0 auto;background:var(--mesh);display:flex;flex-direction:column;overflow:hidden;isolation:isolate;}
@media(min-width:520px) and (max-width:899px){#app{box-shadow:0 0 80px rgba(0,0,0,.5);}}
header{position:relative;z-index:3;padding:calc(16px + env(safe-area-inset-top,0px)) 20px 13px;display:flex;align-items:center;gap:11px;border-bottom:1px solid transparent;flex-shrink:0;background:var(--bg);transition:border-color .25s ease,box-shadow .25s ease;}
header.scrolled{border-bottom-color:var(--line);box-shadow:0 8px 18px -16px rgba(15,23,42,.28);}
.logo{width:42px;height:42px;border-radius:13px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--accent);font-family:'Sora',serif;font-weight:700;font-size:24px;line-height:1;border:1px solid var(--hair);box-shadow:var(--shadow);flex-shrink:0;cursor:pointer;overflow:hidden;transition:transform .18s;}
.logo:active{transform:scale(.92);}
.logo img{width:100%;height:100%;object-fit:cover;}
.logo.sm{width:34px;height:34px;border-radius:11px;font-size:18px;}
.htext{flex:1;min-width:0;}
.htext h1{font-family:'Sora',sans-serif;font-size:23px;font-weight:700;line-height:1;letter-spacing:-0.03em;}
.htext span{font-size:10.5px;color:var(--sub);letter-spacing:.16em;text-transform:uppercase;display:block;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;}
.pill{display:flex;align-items:center;gap:8px;padding:5px 12px 5px 5px;border-radius:30px;background:var(--surface-2);border:1px solid var(--line);cursor:pointer;transition:background .2s,border-color .2s;flex-shrink:0;}
.pill:active{background:var(--surface-3);}
.pill .nm{font-size:13.5px;font-weight:600;}
.back{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;margin-left:-6px;transition:background .18s,transform .18s;flex-shrink:0;color:var(--ink);}
.back:active{transform:scale(.9);background:var(--surface-2);}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex-shrink:0;transition:all .3s;opacity:0;}
.sync-dot.syncing{background:var(--accent);box-shadow:0 0 8px var(--accent);animation:pulse-dot 1s ease-in-out infinite;opacity:1;}
.sync-dot.error{background:var(--danger);opacity:1;}
@keyframes pulse-dot{0%,100%{opacity:1;}50%{opacity:.3;}}
#stage{position:relative;z-index:1;flex:1;overflow:hidden;}
.screen{overscroll-behavior:contain;position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:10px 18px calc(64px + env(safe-area-inset-bottom,0px));background:var(--bg);touch-action:pan-y;overscroll-behavior:contain;}
.screen.retap{animation:scRetap .44s cubic-bezier(.16,1,.3,1);}
@keyframes scRetap{0%{opacity:.5;transform:scale(.986);}100%{opacity:1;transform:none;}}
.screen::-webkit-scrollbar{width:0;}
.screen.is-home{background:var(--mesh),var(--bg);}
.screen.enter-right,.screen.enter-left,.screen.exit-left,.screen.exit-right,.screen.tab-enter-right,.screen.tab-enter-left,.screen.tab-exit-left,.screen.tab-exit-right,.screen.tab-show,.screen.dragging{will-change:transform;}
.screen.enter-right{transform:translateX(100%);}
.screen.enter-left{transform:translateX(-22%);filter:brightness(.78);}
.screen.show{transform:translateX(0);filter:none;transition:transform .42s var(--e-slide),filter .42s ease;}
.screen.exit-left{transform:translateX(-22%);filter:brightness(.78);transition:transform .42s var(--e-slide),filter .42s ease;}
.screen.exit-right{transform:translateX(100%);transition:transform .42s var(--e-slide);}
/* Tab-bar paired slide — both panels move full width together, no parallax dim */
.screen.tab-enter-right{transform:translateX(100%);}
.screen.tab-enter-left{transform:translateX(-100%);}
.screen.tab-show{transform:translateX(0);transition:transform .55s var(--e-slide);}
.screen.tab-exit-left{transform:translateX(-100%);transition:transform .55s var(--e-slide);}
.screen.tab-exit-right{transform:translateX(100%);transition:transform .55s var(--e-slide);}
.screen.dragging{transition:none!important;filter:none!important;}
/* ============ HOME ============ */
.home-grid{display:grid;grid-template-columns:1fr 1fr;gap:clamp(9px,2.8vw,13px);}
.tile{position:relative;border-radius:clamp(18px,4.6vw,22px);padding:clamp(14px,3.7vw,18px);min-height:clamp(102px,27vw,134px);cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);transition:transform .22s cubic-bezier(.2,.8,.2,1),border-color .22s,box-shadow .22s;}
.tile::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(75% 60% at 92% 6%,color-mix(in srgb,var(--tc,transparent) 16%,transparent),transparent 68%);}
@media(hover:hover) and (pointer:fine){.tile:hover{transform:translateY(-3px);border-color:var(--hair);box-shadow:var(--shadow-lg);}}
.tile:active{transform:translateY(0) scale(.975);}
.tile .chip{position:relative;z-index:1;width:clamp(38px,10vw,42px);height:clamp(38px,10vw,42px);border-radius:clamp(11px,3vw,13px);display:flex;align-items:center;justify-content:center;color:var(--tc,var(--accent));background:color-mix(in srgb,var(--tc,var(--accent)) 15%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--tc,var(--accent)) 28%,transparent);}
.tile .t{position:relative;z-index:1;font-weight:700;font-size:clamp(14.5px,4.1vw,16.5px);line-height:1.12;color:var(--ink);letter-spacing:-0.02em;}
.tile .s{position:relative;z-index:1;font-size:clamp(10.5px,3vw,12px);color:var(--sub);margin-top:3px;line-height:1.2;}
.tile.hero{grid-column:1/-1;min-height:0;background:var(--grad);color:var(--accent-ink);border:none;box-shadow:0 18px 44px -20px color-mix(in srgb,var(--accent) 70%,transparent);gap:6px;padding:20px 22px;justify-content:center;align-items:flex-start;}
.tile.hero::after{background:radial-gradient(80% 120% at 100% 0%,rgba(255,255,255,.18),transparent 60%);}
.tile.hero .hero-greet{font-family:'Sora',sans-serif;font-size:clamp(22px,6.2vw,27px);font-weight:700;margin-top:8px;line-height:1.02;letter-spacing:-0.03em;position:relative;z-index:1;}
.tile.hero .hero-sub{font-size:13.5px;opacity:.8;margin-top:3px;position:relative;z-index:1;font-weight:500;}
.home-lbl{grid-column:1/-1;font-size:10.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--sub);margin:15px 2px 1px;}
.home-grid .hero+.home-lbl{margin-top:7px}
.feat{grid-column:1/-1;display:flex;align-items:center;gap:14px;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px 18px;box-shadow:var(--shadow);transition:transform .2s,border-color .2s;}
.feat:active{transform:scale(.99)}
.feat .t{font-family:'Sora',sans-serif;font-weight:700;font-size:16.5px;letter-spacing:-.01em;color:var(--ink)}
.feat .s{font-size:13px;color:var(--sub);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.feat-go{color:var(--sub);font-size:18px;flex:none}
.hero-eyebrow{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:700;letter-spacing:.04em;opacity:.92;position:relative;z-index:1}
.tile.hero>div:first-child{position:relative;z-index:1;}
.tile.ghost{background:transparent;border:1px dashed var(--hair);box-shadow:none;}
.tile.ghost::after{display:none;}
.tile.ghost .t{color:var(--sub);}.tile.ghost .chip{color:var(--sub);background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line);}
.screen.show .tile:nth-child(1){animation-delay:.02s}.screen.show .tile:nth-child(2){animation-delay:.06s}.screen.show .tile:nth-child(3){animation-delay:.1s}.screen.show .tile:nth-child(4){animation-delay:.14s}.screen.show .tile:nth-child(5){animation-delay:.18s}.screen.show .tile:nth-child(6){animation-delay:.22s}.screen.show .tile:nth-child(7){animation-delay:.26s}.screen.show .tile:nth-child(8){animation-delay:.3s}.screen.show .tile:nth-child(9){animation-delay:.34s}.screen.show .tile:nth-child(10){animation-delay:.38s}.screen.show .tile:nth-child(11){animation-delay:.42s}.screen.show .tile:nth-child(12){animation-delay:.46s}
@keyframes tIn{0%{opacity:0;transform:translateY(24px) scale(.93);}55%{opacity:1;}100%{opacity:1;transform:none;}}
/* ============ CARDS ============ */
.card[onclick]:active,.row[onclick]:active,.cal-agrow:active,.trow[onclick]:active{transform:scale(.985);}
.lifecard:active{transform:scale(.975);}
.today-bub:active{transform:scale(.94);}
.card[onclick],.row[onclick],.cal-agrow,.lifecard,.today-bub{transition:transform .14s var(--e-out);}
.card{background:var(--surface);border-radius:16px;padding:18px;border:1px solid var(--line);box-shadow:var(--shadow);}
.stack{display:grid;gap:13px;max-width:560px;margin-inline:auto;width:100%;}
.ctitle{font-size:11px;font-weight:700;color:var(--sub);letter-spacing:.1em;text-transform:uppercase;margin:2px 2px 12px;}
.row{display:flex;align-items:center;gap:12px;padding:12px 8px;border-radius:13px;transition:background .18s;}
.row:active{background:var(--surface-3);}
.dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.row .rt{font-weight:600;font-size:15px;letter-spacing:-0.01em;}.row .rs{font-size:12.5px;color:var(--sub);margin-top:1px;}
.dark{background:#0F172A;color:#FFFFFF;border:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 14px 32px -14px rgba(15,23,42,.45);position:relative;overflow:hidden;}
button:focus-visible,[onclick]:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.dark::before{content:'';position:absolute;inset:0;background:radial-gradient(90% 120% at 100% 0%,color-mix(in srgb,var(--accent) 16%,transparent),transparent 55%);pointer-events:none;}
.dark>*{position:relative;z-index:1;}
.dark .small{font-size:12px;color:rgba(255,255,255,.62);font-weight:600;letter-spacing:.04em;}
.two{display:grid;grid-template-columns:1fr 1fr;gap:11px;}
.stat .k{display:flex;align-items:center;gap:7px;color:var(--sub);font-size:12px;margin-bottom:8px;font-weight:600;}
.stat .v{font-weight:700;font-size:22px;letter-spacing:-0.02em;font-variant-numeric:tabular-nums;}.stat .d{font-size:12px;color:var(--sub);margin-top:2px;}
.checkbox{width:20px;height:20px;border-radius:6px;border:2px solid var(--hair);flex-shrink:0;}
.circlebox{width:20px;height:20px;border-radius:50%;border:2px solid var(--hair);flex-shrink:0;}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center;}
.cal .h{font-size:11px;color:var(--sub);font-weight:700;padding-bottom:4px;}
.cal .cell{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:11px;font-size:13px;font-weight:500;}
.cal .today{background:var(--grad);color:var(--accent-ink);font-weight:700;}
.evdot{width:4px;height:4px;border-radius:50%;background:var(--accent);margin-top:2px;}
.bar{height:8px;border-radius:8px;background:var(--surface-3);overflow:hidden;}
.bar>div{height:100%;border-radius:8px;transition:width .7s var(--e-out);}
/* ---------- Budget system ---------- */
.bud-month{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;}
.bud-month-nav{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink);}
.bud-month-nav:active{transform:scale(.92);}
.bud-month-lbl{font-family:'Sora',sans-serif;font-weight:700;font-size:17px;}
.bud-hero{position:relative;border-radius:20px;padding:20px 18px 16px;color:#fff;margin-bottom:14px;box-shadow:0 18px 40px -18px rgba(15,23,42,.45);transition:background .4s;overflow:hidden;}
.bud-hero::after{content:'';position:absolute;top:-60%;right:-20%;width:70%;height:200%;background:linear-gradient(115deg,transparent,rgba(255,255,255,.10) 45%,transparent 60%);transform:rotate(8deg);pointer-events:none;}
.bud-stats{display:flex;gap:7px;margin-top:12px;flex-wrap:wrap;}
.bud-stat{display:inline-flex;align-items:baseline;gap:5px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.20);border-radius:999px;padding:5px 11px;font-size:12px;font-weight:600;}
.bud-stat b{font-size:12.5px;font-weight:800;font-variant-numeric:tabular-nums;}
.bud-meter{height:6px;border-radius:6px;background:rgba(255,255,255,.22);overflow:hidden;margin-top:13px;}
.bud-meter>div{height:100%;border-radius:6px;background:#fff;transition:width .8s var(--e-out);}
.bud-hero.pos{background:linear-gradient(135deg,#0E9F6E,#10B981);}
.bud-hero.zero{background:linear-gradient(135deg,#1F2937,#374151);}
.bud-hero.neg{background:linear-gradient(135deg,#DC2626,#F87171);}
.bud-hero-lbl{font-size:12.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;opacity:.9;}
.bud-hero-amt{font-family:'Sora',sans-serif;font-weight:800;font-size:38px;letter-spacing:-.03em;line-height:1.05;margin-top:3px;}
.bud-hero-sub{font-size:13px;opacity:.92;margin-top:6px;display:flex;gap:14px;flex-wrap:wrap;}
.bud-hero-set{margin-top:13px;display:flex;gap:8px;}
.bud-hero-set button{flex:1;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.28);color:#fff;border-radius:11px;padding:9px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;}
.bud-hero-set button:active{transform:scale(.97);}
.bud-grp{margin-bottom:13px;}
.bud-grp-head{display:flex;align-items:center;justify-content:space-between;padding:4px 4px 9px;}
.bud-grp-name{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--sub);}
.bud-grp-tot{font-size:12.5px;font-weight:600;color:var(--sub);}
.bud-cat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:9px;cursor:pointer;transition:transform .14s var(--e-out),box-shadow .18s;box-shadow:var(--shadow);}
.bud-cat:active{transform:scale(.985);}
.bud-cat:active{transform:scale(.99);}
.bud-cat-top{display:flex;align-items:center;gap:11px;margin-bottom:9px;}
.bud-cat-ic{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;background:color-mix(in srgb,var(--sc,#94A3B8) 13%,var(--surface));border:1px solid color-mix(in srgb,var(--sc,#94A3B8) 22%,transparent);flex-shrink:0;transition:background .3s,border-color .3s;}
.bud-cat-name{font-weight:700;font-size:15.5px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bud-cat-left{text-align:right;flex-shrink:0;}
.bud-cat-left-amt{font-weight:700;font-size:15px;font-variant-numeric:tabular-nums;}
.bud-cat-left-lbl{font-size:11px;color:var(--sub);font-weight:600;}
.bud-cat-meta{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--sub);font-weight:500;margin-top:8px;min-height:26px;}
.bud-plan-in{width:96px;text-align:right;border:1.5px solid var(--accent);border-radius:9px;padding:4px 9px;font-family:inherit;font-size:16px;font-weight:700;background:var(--surface);color:var(--ink);outline:none;font-variant-numeric:tabular-nums;}
.bud-plan.cta{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 35%,transparent);color:var(--accent);}
/* --- transaction sheet v2 --- */
.btx-amt{display:flex;align-items:baseline;justify-content:center;gap:4px;margin:8px 0 4px;}
.btx-amt span{font-family:'Sora',sans-serif;font-size:26px;font-weight:700;color:var(--sub);}
.btx-amt input{width:200px;border:none;background:transparent;font-family:'Sora',sans-serif;font-size:44px;font-weight:800;letter-spacing:-.02em;color:var(--ink);outline:none;text-align:left;font-variant-numeric:tabular-nums;caret-color:var(--accent);}
.btx-amt input::placeholder{color:var(--faint);}
.btx-chips{display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:10px 2px 6px;scrollbar-width:none;margin:0 -4px;}
.btx-chips::-webkit-scrollbar{display:none;}
.btx-chip{flex-shrink:0;display:flex;align-items:center;gap:7px;border:1.5px solid var(--line);background:var(--surface-2);border-radius:999px;padding:9px 14px;font-family:inherit;font-size:13.5px;font-weight:600;color:var(--ink);cursor:pointer;transition:border-color .15s,background .15s,transform .12s;}
.btx-chip:active{transform:scale(.95);}
.btx-chip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);}
.btx-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:2px;}
.btx-head h3{margin:0;}
.btx-x{width:34px;height:34px;border-radius:50%;border:none;background:var(--surface-3);color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;}
.btx-lbl{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--sub);margin:12px 2px 0;}
.btx-dates{display:flex;gap:8px;padding:10px 2px 2px;}
.btx-dpick{position:relative;overflow:hidden;display:flex;align-items:center;gap:6px;}
.btx-dpick input{position:absolute;inset:0;opacity:0;width:100%;}
.btx-save{width:100%;margin-top:14px;padding:15px;font-size:15.5px;}
.acc-card .ctitle{margin-bottom:4px;}
.acc-row{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line);}
.acc-row:last-of-type{border-bottom:none;}
.acc-ic{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;background:color-mix(in srgb,var(--sc,#10B981) 13%,var(--surface));border:1px solid color-mix(in srgb,var(--sc,#10B981) 22%,transparent);flex-shrink:0;}
.acc-main{flex:1;min-width:0;}
.acc-name{font-weight:700;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.acc-kind{font-size:12px;color:var(--sub);font-weight:500;margin-top:1px;}
.acc-bal{border:none;background:var(--surface-2);color:var(--ink);font-family:inherit;font-size:15px;font-weight:800;padding:8px 12px;border-radius:11px;cursor:pointer;font-variant-numeric:tabular-nums;flex-shrink:0;transition:transform .12s;}
.acc-bal:active{transform:scale(.95);}
.acc-bal-in{width:118px;text-align:right;border:1.5px solid var(--accent);border-radius:11px;padding:7px 11px;font-family:inherit;font-size:16px;font-weight:800;background:var(--surface);color:var(--ink);outline:none;font-variant-numeric:tabular-nums;flex-shrink:0;}
.acc-conv{font-size:11.5px;color:var(--sub);font-weight:600;margin-top:2px;text-align:right;}
.acc-curbtn{background:none;border:none;color:var(--accent);font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;padding:0;}
.bud-cur-btn{margin-left:6px;border:1px solid var(--line);background:var(--surface);color:var(--accent);font-family:inherit;font-weight:800;font-size:12.5px;padding:0 12px;border-radius:11px;cursor:pointer;height:38px;flex-shrink:0;}
.bud-cur-btn:active{transform:scale(.94);}
/* conversion strip */
.fx-strip-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.fx-refresh{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--surface-2);color:var(--sub);font-family:inherit;font-size:11.5px;font-weight:700;padding:5px 10px;border-radius:9px;cursor:pointer;}
.fx-refresh:active{transform:scale(.95);}
.fx-chips{display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:2px 2px 8px;scrollbar-width:none;margin:0 -2px;}
.fx-chips::-webkit-scrollbar{display:none;}
.fx-chip{flex-shrink:0;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:9px 13px;min-width:104px;}
.fx-chip span{font-size:11px;color:var(--sub);font-weight:600;display:block;}
.fx-chip b{font-size:15px;font-weight:800;font-variant-numeric:tabular-nums;display:block;margin-top:2px;}
/* rates converter */
.rate-row{display:flex;gap:10px;align-items:center;margin:8px 0;min-width:0;}
.rate-amt{flex:1;min-width:0;width:100%;border:1.5px solid var(--line);background:var(--surface-2);border-radius:13px;padding:14px 16px;font-family:'Sora',sans-serif;font-size:24px;font-weight:800;color:var(--ink);outline:none;font-variant-numeric:tabular-nums;}
.rate-amt:focus{border-color:var(--accent);}
.rate-out{flex:1;min-width:0;border:1.5px solid var(--line);background:var(--surface);border-radius:13px;padding:14px 16px;font-family:'Sora',sans-serif;font-size:24px;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.rate-sel{border:1.5px solid var(--line);background:var(--surface-2);border-radius:13px;padding:14px 10px;font-family:inherit;font-size:15px;font-weight:700;color:var(--ink);outline:none;-webkit-appearance:none;appearance:none;flex:0 0 auto;max-width:96px;}
.rate-swap{display:flex;justify-content:center;margin:-2px 0;}
.rate-swap button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--accent);display:flex;align-items:center;justify-content:center;cursor:pointer;transform:rotate(90deg);transition:transform .3s;}
.rate-swap button:active{transform:rotate(270deg) scale(.9);}
.rate-note{font-size:12.5px;color:var(--sub);font-weight:600;text-align:center;margin-top:10px;font-variant-numeric:tabular-nums;white-space:normal;line-height:1.5;overflow-wrap:anywhere;}
.rate-trow{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line);}
.rate-trow:last-child{border-bottom:none;}
.rate-tsym{width:38px;height:38px;border-radius:11px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex-shrink:0;}
.rate-tval{text-align:right;font-variant-numeric:tabular-nums;}
.rate-tval>div:first-child{font-weight:800;font-size:15px;}
.bud-plan{border:1px solid var(--line);background:var(--surface-2);color:var(--ink);font-family:inherit;font-size:12px;font-weight:700;padding:5px 10px;border-radius:9px;cursor:pointer;font-variant-numeric:tabular-nums;}
.bud-plan:active{transform:scale(.95);}
.bud-additem{display:flex;align-items:center;gap:6px;background:none;border:none;color:var(--accent);font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer;padding:2px 6px 4px;}
.bud-add-cat{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;padding:11px;border:1.5px dashed var(--line);border-radius:13px;background:transparent;color:var(--sub);font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit;margin-top:2px;}
.bud-add-cat:active{transform:scale(.99);}
.bud-ai-row{display:flex;gap:8px;margin-bottom:14px;}
.bud-ai-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;padding:11px;border-radius:13px;border:1px solid var(--accent)44;background:var(--accent)0E;color:var(--accent);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;}
.bud-ai-btn:active{transform:scale(.98);}
/* category detail */
.bud-det-hero{text-align:center;padding:22px 16px 18px;}
.bud-det-ic{font-size:54px;line-height:1;margin-bottom:10px;}
.bud-det-name{font-family:'Sora',sans-serif;font-weight:800;font-size:26px;}
.bud-det-ring{display:flex;justify-content:center;gap:26px;margin-top:16px;}
.bud-det-stat{text-align:center;}
.bud-det-stat-n{font-family:'Sora',sans-serif;font-weight:700;font-size:22px;font-variant-numeric:tabular-nums;}
.bud-det-stat-l{font-size:11px;font-weight:600;color:var(--sub);text-transform:uppercase;letter-spacing:.06em;margin-top:3px;}
.bud-txn{display:flex;align-items:center;gap:11px;padding:11px 2px;border-bottom:1px solid var(--line);}
.bud-txn:last-child{border-bottom:none;}
.bud-txn-amt{font-weight:700;font-variant-numeric:tabular-nums;}
.bud-quick{display:flex;gap:8px;margin:12px 0;}
.bud-quick input{flex:1;border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px;font-size:16px;font-family:inherit;color:var(--ink);outline:none;}
.sh-card{padding:8px 12px;}
.sh-row{display:flex;align-items:center;gap:8px;padding:9px 2px;border-bottom:1px solid var(--line);}
.sh-row:last-child{border-bottom:none;}
.sh-row.today .sh-day b{color:var(--accent);}
.sh-row.today .sh-day span{background:var(--accent);color:#fff;}
.sh-day{width:44px;display:flex;flex-direction:column;align-items:center;gap:2px;flex-shrink:0;}
.sh-day b{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--sub);}
.sh-day span{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13.5px;font-weight:700;background:var(--surface-2);}
.sh-time{flex:1;min-width:0;text-align:center;padding:9px 6px!important;font-variant-numeric:tabular-nums;}
.sh-dash{color:var(--faint);flex-shrink:0;}
.sh-hrs{width:44px;text-align:right;font-size:12.5px;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums;flex-shrink:0;}
.bud-quick button{padding:0 18px;border-radius:12px;border:none;background:var(--accent);color:#fff;font-weight:700;font-size:15px;cursor:pointer;font-family:inherit;}
/* ---------- Budget onboarding wizard ---------- */
.bwz{position:fixed;inset:0;z-index:115;background:var(--bg);display:flex;flex-direction:column;animation:bwzIn .3s ease;}
@keyframes bwzIn{from{opacity:0}to{opacity:1}}
.bwz-top{padding:calc(16px + env(safe-area-inset-top)) 20px 12px;display:flex;align-items:center;gap:14px;}
.bwz-back{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink);flex-shrink:0;}
.bwz-back:active{transform:scale(.92);}
.bwz-prog{flex:1;height:6px;border-radius:6px;background:var(--surface-3);overflow:hidden;}
.bwz-prog>div{height:100%;background:var(--accent);border-radius:6px;transition:width .35s cubic-bezier(.4,0,.2,1);}
.bwz-step{font-size:12px;font-weight:600;color:var(--sub);flex-shrink:0;}
.bwz-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:20px 22px 0;display:flex;flex-direction:column;}
.bwz-kick{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:10px;}
.bwz-q{font-family:'Sora',sans-serif;font-weight:800;font-size:25px;line-height:1.22;letter-spacing:-.02em;color:var(--ink);}
.bwz-help{font-size:14.5px;color:var(--sub);line-height:1.5;margin-top:10px;}
.bwz-opts{margin-top:24px;display:flex;flex-direction:column;gap:10px;}
.bwz-opt{display:flex;align-items:center;gap:13px;padding:16px;border:1.5px solid var(--line);border-radius:15px;background:var(--surface);cursor:pointer;transition:transform .12s,border-color .15s,background .15s;text-align:left;font-family:inherit;}
.bwz-opt:active{transform:scale(.99);}
.bwz-opt.on{border-color:var(--accent);background:var(--accent)0E;}
.bwz-opt-ic{font-size:24px;flex-shrink:0;width:30px;text-align:center;}
.bwz-opt-tx{flex:1;}
.bwz-opt-t{font-weight:700;font-size:15.5px;color:var(--ink);}
.bwz-opt-s{font-size:12.5px;color:var(--sub);margin-top:2px;line-height:1.35;}
.bwz-opt-check{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;}
.bwz-opt.on .bwz-opt-check{background:var(--accent);border-color:var(--accent);}
.bwz-input{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:15px;padding:18px;font-size:22px;font-weight:700;font-family:'Sora',sans-serif;color:var(--ink);outline:none;margin-top:24px;text-align:center;}
.bwz-input:focus{border-color:var(--accent);}
.bwz-inputwrap{position:relative;margin-top:24px;}
.bwz-inputwrap .bwz-cur{position:absolute;left:18px;top:50%;transform:translateY(-50%);font-size:22px;font-weight:700;font-family:'Sora',sans-serif;color:var(--sub);}
.bwz-inputwrap .bwz-input{margin-top:0;padding-left:46px;text-align:left;}
.bwz-foot{padding:14px 22px calc(18px + env(safe-area-inset-bottom));}
.bwz-next{width:100%;padding:16px;border-radius:14px;border:none;background:var(--accent);color:#fff;font-weight:700;font-size:16px;cursor:pointer;font-family:inherit;transition:transform .12s,opacity .15s;}
.bwz-next:active{transform:scale(.98);}
.bwz-next:disabled{opacity:.4;cursor:default;}
.bwz-skip{display:block;margin:12px auto 0;background:none;border:none;color:var(--sub);font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit;}
.bwz-drop{margin-top:24px;border:2px dashed var(--line);border-radius:16px;padding:30px 20px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s;}
.bwz-drop:active,.bwz-drop.over{border-color:var(--accent);background:var(--accent)0A;}
.bwz-drop-ic{font-size:38px;margin-bottom:10px;}
.bwz-drop-t{font-weight:700;font-size:15px;color:var(--ink);}
.bwz-drop-s{font-size:13px;color:var(--sub);margin-top:5px;line-height:1.4;}
.bwz-csv-result{margin-top:16px;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:14px;}
.bwz-csv-cat{display:flex;justify-content:space-between;align-items:center;padding:7px 2px;font-size:14px;border-bottom:1px solid var(--line);}
.bwz-csv-cat:last-child{border-bottom:none;}
.bwz-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:24px;}
.bwz-chip{padding:10px 15px;border:1.5px solid var(--line);border-radius:999px;background:var(--surface);font-size:14px;font-weight:600;color:var(--ink);cursor:pointer;font-family:inherit;}
.bwz-chip.on{border-color:var(--accent);background:var(--accent)12;color:var(--accent);}
.bwz-building{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;}
.bwz-building-ic{font-size:50px;margin-bottom:18px;animation:bwzPulse 1.4s ease-in-out infinite;}
@keyframes bwzPulse{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.12);opacity:1}}
.badge{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 9px;border-radius:20px;background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);}
.uav{border-radius:50%;background:var(--grad);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;overflow:hidden;}
.uav img{width:100%;height:100%;object-fit:cover;}
/* ============ FAB ============ */
.fab{position:absolute;bottom:calc(84px + env(safe-area-inset-bottom,0px));right:22px;width:56px;height:56px;border-radius:18px;background:var(--grad);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;box-shadow:0 14px 30px -10px color-mix(in srgb,var(--accent) 75%,transparent);cursor:pointer;border:none;transition:transform .2s cubic-bezier(.2,.8,.2,1),box-shadow .2s;z-index:40;}
@media(hover:hover) and (pointer:fine){.fab:hover{transform:translateY(-2px) rotate(90deg);}}
.fab:active{transform:scale(.9);}
/* ============ OVERLAY / SHEET ============ */
.overlay{position:absolute;inset:0;background:rgba(15,23,42,.32);backdrop-filter:blur(7px) saturate(1.1);-webkit-backdrop-filter:blur(7px) saturate(1.1);display:flex;align-items:flex-end;justify-content:center;z-index:50;animation:fade .25s ease;}
.sheet{width:100%;background:var(--surface);border:1px solid var(--line);border-bottom:none;border-radius:22px 22px 0 0;padding:26px 22px calc(30px + env(safe-area-inset-bottom,0px));animation:up .5s var(--e-slide);max-height:90%;overflow-y:auto;box-shadow:0 -16px 48px -20px rgba(15,23,42,.25);will-change:transform;}
.sheet::before{content:'';display:block;width:38px;height:5px;border-radius:5px;background:var(--surface-3);margin:-12px auto 14px;}
.overlay.out{animation:ovOut .26s ease forwards;pointer-events:none;}
.overlay.out .sheet{animation:sheetDown .3s var(--e-out) forwards;}
@keyframes ovOut{to{opacity:0;}}
@keyframes sheetDown{to{transform:translateY(105%);}}
.sheet h3{font-family:'Sora',sans-serif;font-size:20px;font-weight:700;letter-spacing:-0.02em;}
.sheet p{font-size:13.5px;color:var(--sub);margin-top:4px;margin-bottom:14px;}
.sheet textarea{width:100%;min-height:96px;border:1px solid var(--line);border-radius:14px;padding:13px;font-family:inherit;font-size:16px;resize:none;background:var(--surface-2);color:var(--ink);}
.sheet textarea:focus{outline:none;border-color:var(--accent);}
.sheet input{width:100%;border:1px solid var(--line);border-radius:14px;padding:13px 14px;font-family:inherit;font-size:16px;background:var(--surface-2);color:var(--ink);margin-bottom:10px;}
.sheet input:focus{outline:none;border-color:var(--accent);}
/* ---------- Apple-style event editor ---------- */
.evs-wrap{position:fixed;inset:0;z-index:120;background:var(--bg);display:flex;flex-direction:column;transform:translateY(100%);transition:transform .38s cubic-bezier(.22,.9,.3,1);}
.evs-wrap.in{transform:none;}
.evs-top{display:flex;align-items:center;justify-content:space-between;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 10px;}
.evs-x,.evs-ok{width:40px;height:40px;border-radius:50%;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.evs-x{background:var(--surface-3);color:var(--ink);}
.evs-ok{background:var(--accent);color:#fff;transition:opacity .2s,transform .12s;}
.evs-ok.dim{opacity:.35;pointer-events:none;}
.evs-ok:active{transform:scale(.9);}
.evs-title{font-family:'Sora',sans-serif;font-weight:800;font-size:19px;}
.evs-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 16px calc(30px + env(safe-area-inset-bottom,0px));}
.evs-seg{display:flex;background:var(--surface-3);border-radius:13px;padding:3px;gap:3px;margin-bottom:14px;}
.evs-seg button{flex:1;border:none;background:none;font-family:inherit;font-weight:700;font-size:14px;color:var(--sub);padding:9px 0;border-radius:10px;cursor:pointer;}
.evs-seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(15,23,42,.14);}
.evs-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;margin-bottom:12px;overflow:hidden;box-shadow:var(--shadow);}
.evs-in{width:100%;border:none;background:transparent;color:var(--ink);font-family:inherit;font-size:16px;padding:15px 16px;outline:none;}
.evs-in.big{font-size:18px;font-weight:600;}
.evs-div{height:1px;background:var(--line);margin:0 16px;}
.evs-row{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;gap:10px;min-height:52px;}
.evs-lbl{font-size:15.5px;font-weight:600;color:var(--ink);}
.evs-pills{display:flex;gap:8px;align-items:center;}
.evs-pill{border:none;background:var(--surface-3);color:var(--ink);font-family:inherit;font-size:16px;font-weight:600;padding:8px 12px;border-radius:10px;outline:none;-webkit-appearance:none;appearance:none;}
.evs-sel{border:none;background:var(--surface-3);color:var(--ink);font-family:inherit;font-size:16px;font-weight:600;padding:8px 12px;border-radius:10px;outline:none;-webkit-appearance:none;appearance:none;}
.evs-caldot{width:11px;height:11px;border-radius:50%;flex-shrink:0;}
.evs-tog{width:52px;height:32px;border-radius:20px;border:none;background:var(--surface-3);position:relative;cursor:pointer;transition:background .2s;padding:0;}
.evs-tog span{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(15,23,42,.25);transition:transform .22s cubic-bezier(.3,.9,.3,1.2);}
.evs-tog.on{background:#34C759;}
.evs-tog.on span{transform:translateX(20px);}
.evs-note{width:100%;min-height:96px;border:none;background:transparent;color:var(--ink);font-family:inherit;font-size:15px;padding:14px 16px;outline:none;resize:none;}
.evs-del{width:100%;padding:15px;border:none;border-radius:16px;background:var(--surface);color:#EF4444;font-family:inherit;font-weight:700;font-size:15.5px;cursor:pointer;border:1px solid var(--line);margin-top:4px;}

.btnrow{display:flex;gap:10px;margin-top:14px;}
.btn:active{transform:scale(.97);}
.reqbtn:active{transform:scale(.985);}
.btn{flex:1;padding:14px;border-radius:14px;border:none;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;transition:transform .15s,filter .15s;}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--grad);color:var(--accent-ink);}
.btn-ghost{background:var(--surface-3);color:var(--ink);border:1px solid var(--line);}
.done{text-align:center;padding:10px 0 4px;}
.done .tick{width:56px;height:56px;border-radius:50%;background:var(--grad);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;margin:0 auto 12px;box-shadow:0 12px 26px -10px color-mix(in srgb,var(--accent) 70%,transparent);}
/* ============ LOCK / INTRO (always dark, premium) ============ */
.lock{position:absolute;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--ink);background:radial-gradient(130% 100% at 50% 12%,#FFFFFF 0%,#F3F5F8 55%,#F3F5F8 100%);overflow:hidden;}
.lock.hide{animation:lift .65s cubic-bezier(.55,0,.15,1) forwards;}
@keyframes lift{to{opacity:0;transform:scale(1.03);visibility:hidden;}}
.glow{position:absolute;width:460px;height:460px;border-radius:50%;background:radial-gradient(circle,rgba(47,107,255,.09),rgba(47,107,255,.04) 48%,transparent 72%);top:42%;left:50%;transform:translate(-50%,-50%);}
@keyframes gpulse{0%,100%{opacity:.6;transform:translate(-50%,-50%) scale(1);}50%{opacity:1;transform:translate(-50%,-50%) scale(1.12);}}
#intro{position:fixed;top:0;bottom:0;left:0;right:0;height:100vh;height:100lvh;z-index:100;background:radial-gradient(130% 110% at 50% 38%,#0E1730 0%,#080D1C 58%,#04060E 100%)!important;}
#intro.hide{animation:introFade .68s cubic-bezier(.4,0,.2,1) forwards!important;}
@keyframes introFade{to{opacity:0;}}
.intro-stage{position:relative;z-index:3;display:flex;flex-direction:column;align-items:center;}
.intro-logowrap{position:relative;display:flex;align-items:center;justify-content:center;}
/* single radial bloom behind the mark — blooms once as the icon lands, then holds */
.intro-glow{position:absolute;width:340px;height:340px;border-radius:50%;background:radial-gradient(circle,rgba(60,120,255,.42),rgba(60,120,255,.1) 46%,transparent 70%);opacity:0;transform:scale(.5);animation:glowBloom 1.2s cubic-bezier(.22,.61,.36,1) .25s forwards, glowBreathe 3.6s ease-in-out 1.5s infinite;}
@keyframes glowBloom{0%{opacity:0;transform:scale(.5);}55%{opacity:.62;}100%{opacity:.45;transform:scale(1);}}
/* Gentle breathing so the splash never looks frozen while auth resolves. */
@keyframes glowBreathe{0%,100%{opacity:.4;transform:scale(1);}50%{opacity:.6;transform:scale(1.08);}}
/* THE hero move: icon starts tiny and soft, grows into place with one spring overshoot */
.intro-mark{position:relative;z-index:1;width:124px;height:124px;border-radius:30px;overflow:hidden;opacity:0;transform:scale(.7);will-change:transform,opacity;animation:markGrow .85s cubic-bezier(.22,.61,.36,1) .1s forwards;box-shadow:0 30px 70px -18px rgba(24,48,130,.7);}
.intro-mark img{width:100%;height:100%;object-fit:cover;display:block;}
/* Restrained settle — a calm ease-out, no spring overshoot (native icons land, they don't bounce). */
@keyframes markGrow{0%{opacity:0;transform:scale(.7);}100%{opacity:1;transform:scale(1);}}
/* Gloss sheen removed — a diagonal shine sweep reads as cheap/skeuomorphic. */
.intro-sheen{display:none;}
/* wordmark: a single clean rise + fade — no per-letter blur theatrics */
.intro-word{margin-top:34px;font-family:'Sora',sans-serif;font-size:34px;font-weight:700;letter-spacing:.34em;padding-left:.34em;color:#fff;position:relative;z-index:3;text-align:center;opacity:0;transform:translateY(12px);animation:wordRise .7s cubic-bezier(.22,.61,.36,1) .5s forwards;}
@keyframes wordRise{0%{opacity:0;transform:translateY(12px);}100%{opacity:1;transform:translateY(0);}}
.intro-tag{margin-top:16px;font-size:10.5px;letter-spacing:.46em;padding-left:.46em;color:#7FA8FF;text-transform:uppercase;font-weight:600;opacity:0;transform:translateY(8px);animation:tagRise .7s cubic-bezier(.22,.61,.36,1) .74s forwards;position:relative;z-index:3;}
@keyframes tagRise{0%{opacity:0;transform:translateY(8px);}100%{opacity:1;transform:translateY(0);}}
/* ============ PIN ============ */
.pin-wrap{width:100%;max-width:312px;display:flex;flex-direction:column;align-items:center;position:relative;z-index:3;padding:0 22px;animation:fade .8s ease .15s backwards;}
.pin-logo{width:60px;height:60px;border-radius:17px;border:1px solid rgba(15,23,42,.10);display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:22px;box-shadow:0 16px 40px -16px rgba(20,24,40,.2);}
.pin-logo img{width:100%;height:100%;object-fit:cover;}
.pin-title{font-family:'Sora',sans-serif;font-size:23px;font-weight:700;margin-bottom:7px;text-align:center;letter-spacing:-0.02em;}
.pin-sub{font-size:13px;color:var(--sub);margin-bottom:28px;text-align:center;line-height:1.5;}
.dots{display:flex;gap:16px;margin-bottom:38px;outline:none!important;border:none;background:none;-webkit-tap-highlight-color:transparent;}
.dot-pin{width:13px;height:13px;border-radius:50%;border:1.5px solid rgba(15,23,42,.18);transition:transform .12s,background .12s,border-color .12s,box-shadow .12s;}
.dot-pin.on{background:var(--accent);border-color:var(--accent);transform:scale(1.15);box-shadow:0 6px 14px -4px rgba(47,107,255,.55);}
.dots.err{animation:shake .42s;}
.dots.err .dot-pin{background:#EF4444!important;border-color:#EF4444!important;box-shadow:none!important;transform:scale(1);}
@keyframes shake{0%,100%{transform:translateX(0);}20%,60%{transform:translateX(-9px);}40%,80%{transform:translateX(9px);}}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(13px,4.4vw,22px);width:100%;justify-items:center;margin-bottom:clamp(30px,9vh,60px);}
.key{aspect-ratio:1;width:clamp(60px,19vw,80px);border-radius:50%;background:#FFFFFF;border:1px solid var(--line);box-shadow:0 4px 14px -8px rgba(15,23,42,.16);color:var(--ink);font-family:'Inter',sans-serif;font-size:clamp(24px,6.4vw,28px);font-weight:400;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .08s ease,background .12s,border-color .12s;-webkit-user-select:none;user-select:none;}
.key:active{transform:scale(.92);background:var(--accent-soft);border-color:rgba(47,107,255,.40);}
.key:focus,.key:focus-visible{outline:none;}
.keypad,.key{touch-action:manipulation;}
.key.blank{background:transparent;border:none;box-shadow:none;cursor:default;}
.key.fn{font-size:clamp(12px,3.4vw,14px);letter-spacing:.02em;color:var(--sub);background:transparent;border:none;box-shadow:none;font-weight:600;}
.pin-wrap{padding-bottom:84px;}
.pin-face{display:flex;align-items:center;gap:8px;margin:2px auto 0;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-family:inherit;font-weight:700;font-size:14px;padding:11px 20px;border-radius:14px;cursor:pointer;box-shadow:var(--shadow);}
.pin-alt{position:absolute;bottom:calc(30px + env(safe-area-inset-bottom,0px));left:0;right:0;margin:0 auto;font-size:14px;color:var(--accent);letter-spacing:.01em;background:none;border:none;cursor:pointer;font-family:inherit;font-weight:700;z-index:4;}
.pin-back{position:absolute;top:calc(20px + env(safe-area-inset-top,0px));left:20px;width:40px;height:40px;border-radius:50%;background:rgba(15,23,42,.05);border:none;color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:4;}
/* ============ SIGNUP ============ */
.signup-field{width:100%;background:rgba(0,0,0,.04);border:1px solid rgba(0,0,0,.10);border-radius:15px;padding:15px 16px;color:#0F172A;font:16px 'Inter',sans-serif;margin-bottom:12px;}
.signup-field::placeholder{color:var(--faint);}
.signup-field:focus{outline:none;border-color:var(--accent);}
.signup-btn{width:100%;padding:15px;border-radius:15px;border:none;background:var(--grad);color:var(--accent-ink);font:800 16px 'Inter',sans-serif;cursor:pointer;margin-top:6px;transition:transform .15s,opacity .2s;box-shadow:0 14px 30px -14px rgba(47,107,255,.55);}
.signup-btn:active{transform:scale(.97);}
.signup-btn:disabled{opacity:.45;}
/* ============ SEGMENTED ============ */
.seg{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:14px;margin-bottom:14px;border:1px solid var(--line);}
.seg-btn{flex:1;border:none;background:transparent;padding:9px 8px;border-radius:10px;font:700 13px 'Inter',sans-serif;color:var(--sub);cursor:pointer;transition:all .2s;}
.seg-btn.on{background:var(--grad);color:var(--accent-ink);box-shadow:0 6px 16px -8px color-mix(in srgb,var(--accent) 70%,transparent);}
.seg.sm{margin:0;border:none;background:var(--surface-3);}.seg.sm .seg-btn{padding:6px 12px;font-size:12px;flex:0 0 auto;}
/* ============ TAB MANAGER / CHIPS ============ */
.trow{display:flex;align-items:center;gap:12px;padding:10px 4px;}
.chip.sm{width:34px;height:34px;border-radius:11px;color:var(--tc,var(--accent));background:color-mix(in srgb,var(--tc,var(--accent)) 15%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--tc,var(--accent)) 28%,transparent);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.tbtn{border:1px solid var(--line);background:var(--surface-2);color:var(--ink);font:700 12.5px 'Inter',sans-serif;padding:7px 14px;border-radius:20px;cursor:pointer;transition:all .18s;}
.tbtn:active{transform:scale(.94);}
.tbtn.add{background:var(--grad);color:var(--accent-ink);border-color:transparent;}
.tbtn.rm{color:var(--danger);}
.del{background:none;border:none;color:var(--faint);cursor:pointer;padding:6px;border-radius:8px;display:inline-flex;align-items:center;transition:color .15s,background .15s;}
.del:active{color:var(--danger);background:color-mix(in srgb,var(--danger) 14%,transparent);}
/* ============ ACCOUNT ============ */
.acct-head{display:flex;align-items:center;gap:14px;margin-bottom:18px;}
.acct-list{display:flex;flex-direction:column;gap:4px;margin-bottom:8px;}
.acct-item{display:flex;align-items:center;gap:12px;width:100%;border:none;background:transparent;padding:13px 6px;border-radius:12px;font:600 15px 'Inter',sans-serif;color:var(--ink);cursor:pointer;text-align:left;transition:background .15s;}
.acct-item:active{background:var(--surface-3);}
.acct-item>span{flex:1;}
.theme-row{justify-content:space-between;cursor:default;}
.photo-ctrls{display:flex;gap:10px;margin-bottom:12px;}
/* ============ MISC VIEWS ============ */
/* ---- Countdown: rich coloured cards ---- */
.cd-list{display:flex;flex-direction:column;gap:11px;}
.cd-row{position:relative;display:flex;align-items:stretch;border-radius:18px;overflow:hidden;box-shadow:var(--shadow);cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .16s;}
.cd-row:active{transform:scale(.985);}
.cd-row-main{flex:1;display:flex;align-items:center;gap:13px;padding:15px 14px;min-width:0;}
.cd-emoji{flex-shrink:0;width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:27px;line-height:1;background:rgba(255,255,255,.28);}
.cd-txt{min-width:0;flex:1;}
.cd-name{font-family:'Sora',sans-serif;font-weight:700;font-size:18px;line-height:1.15;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cd-sub{font-size:13px;font-weight:600;opacity:.72;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cd-date{display:flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;opacity:.62;margin-top:5px;}
.cd-num{flex-shrink:0;width:108px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 6px;}
.cd-num-big{font-family:'Sora',sans-serif;font-weight:800;font-size:40px;line-height:.95;letter-spacing:-.03em;font-variant-numeric:tabular-nums;}
.cd-num-lbl{font-size:11.5px;font-weight:600;opacity:.8;margin-top:3px;}
.cd-section-lbl{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--sub);margin:6px 2px 2px;}
.cd-filter{display:flex;gap:7px;overflow-x:auto;padding:2px 0 2px;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
.cd-filter::-webkit-scrollbar{display:none;}
::selection{background:var(--accent);color:#fff;}
.cd-chip{flex-shrink:0;font-size:12.5px;font-weight:600;padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--sub);cursor:pointer;white-space:nowrap;}
.cd-chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink);}

.cde-field{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface-2);border:1px solid var(--line);border-radius:13px;padding:13px 14px;margin-bottom:9px;}

.cde-toggle{position:relative;width:46px;height:28px;flex-shrink:0;border-radius:999px;background:var(--line);transition:background .2s;cursor:pointer;border:none;padding:0;}

.cde-toggle::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s cubic-bezier(.4,0,.2,1);}

/* ---- icon & colour picker sheet ---- */
.pk-sheet{max-height:78vh;display:flex;flex-direction:column;}

.pk-tab{flex:1;text-align:center;font-size:13px;font-weight:700;padding:9px;border-radius:11px;background:var(--surface-2);border:1px solid var(--line);color:var(--sub);cursor:pointer;}
.pk-tab.on{background:var(--accent);color:#fff;border-color:var(--accent);}
.pk-search{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:11px 14px;font-size:16px;color:var(--ink);outline:none;margin-bottom:12px;font-family:inherit;}
.pk-scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1;}

.pk-emoji:active{transform:scale(.88);}
.pk-emoji.on{border-color:var(--accent);background:var(--accent)1A;}
.pk-cat{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--sub);margin:14px 2px 8px;}
.pk-cat:first-child{margin-top:0;}
.pk-colors{display:grid;grid-template-columns:repeat(6,1fr);gap:11px;}
.pk-color{aspect-ratio:1;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:transform .12s;}
.pk-color:active{transform:scale(.88);}
.pk-color.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--bg) inset;}
/* ---- full-screen live detail ---- */
.cd-detail{position:fixed;inset:0;z-index:120;display:flex;flex-direction:column;animation:cdDetailIn .34s cubic-bezier(.22,.85,.26,1);}

.cd-detail-bar{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top));}
.cd-detail-bar button{width:42px;height:42px;border-radius:50%;border:none;background:rgba(0,0,0,.18);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.cd-detail-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;}
.cd-detail-emoji{font-size:96px;line-height:1;margin-bottom:22px;filter:drop-shadow(0 12px 28px rgba(0,0,0,.25));}
.cd-detail-name{font-family:'Sora',sans-serif;font-weight:800;font-size:38px;letter-spacing:-.02em;color:#fff;}
.cd-detail-sub{font-size:16px;font-weight:600;color:rgba(255,255,255,.78);margin-top:8px;}
.cd-detail-date{font-size:17px;font-weight:600;color:rgba(255,255,255,.72);margin-top:14px;}
.cd-detail-foot{padding:26px 20px calc(34px + env(safe-area-inset-bottom));}
.cd-detail-starts{text-align:center;font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.7);margin-bottom:14px;}
.cd-ticker{display:flex;justify-content:center;gap:8px;}
.cd-tick{flex:1;max-width:84px;text-align:center;}
.cd-tick-n{font-family:'Sora',sans-serif;font-weight:800;font-size:42px;line-height:1;color:#fff;font-variant-numeric:tabular-nums;}
.cd-tick-l{font-size:13px;font-weight:600;color:rgba(255,255,255,.7);margin-top:6px;}
.cd-card .cd-big{font-family:'Sora',sans-serif;font-weight:700;font-size:54px;line-height:1;margin:10px 0 6px;color:var(--accent);letter-spacing:-0.03em;font-variant-numeric:tabular-nums;}
.meal-row{cursor:pointer;}
.note{margin-top:10px;font-size:12px;color:var(--sub);display:flex;align-items:flex-start;gap:7px;padding:9px 11px;background:color-mix(in srgb,var(--accent) 8%,transparent);border:1px solid color-mix(in srgb,var(--accent) 16%,transparent);border-radius:11px;line-height:1.45;}
.ai-wrap{display:flex;flex-direction:column;min-height:calc(100% - 4px);}

.ai-msg.me{animation-name:aiMsgInMe;}
@keyframes aiMsgIn{from{opacity:0;transform:translateX(-14px) translateY(6px);}to{opacity:1;transform:none;}}
@keyframes aiMsgInMe{from{opacity:0;transform:translateX(14px) translateY(6px);}to{opacity:1;transform:none;}}
.ai-msg.me{align-self:flex-end;background:var(--grad);color:var(--accent-ink);border-bottom-right-radius:6px;font-weight:500;}
.ai-msg.ai{align-self:flex-start;background:var(--surface-2);border:1px solid var(--line);border-bottom-left-radius:6px;}
.ai-empty{text-align:center;color:var(--sub);padding:36px 20px;}
.ai-empty svg{color:var(--accent);}
.ai-bar{position:sticky;bottom:0;display:flex;gap:8px;padding:10px 0 2px;background:linear-gradient(transparent,var(--bg) 28%);transform:translateY(calc(-1 * var(--kb,0px)));transition:transform .18s ease-out;z-index:5;}
.ai-send{flex-shrink:0;}
.ai-bar .ai-mic{width:46px;height:46px;border:1px solid var(--line);background:var(--surface);color:var(--sub);border-radius:50%;transition:color .2s,border-color .2s,background .2s;}
.ai-bar .ai-mic.rec{color:#fff;background:#EF4444;border-color:#EF4444;animation:micPulse 1.1s ease-in-out infinite;}
@keyframes micPulse{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.45);}50%{box-shadow:0 0 0 9px rgba(239,68,68,0);}}
/* ---------- Apple-Intelligence-style animated gradient ring ---------- */
.glow-ring{position:relative;}
.glow-ring{isolation:isolate;}
.glow-ring::before{content:'';position:absolute;inset:-3px;border-radius:inherit;padding:3px;background:conic-gradient(from var(--ga,0deg),#7C5CFF,#2F6BFF,#22D3EE,#10B981,#F59E0B,#EC4899,#7C5CFF);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude;animation:gaSpin 3.5s linear infinite;pointer-events:none;filter:saturate(1.4);}
.glow-ring::after{content:'';position:absolute;inset:-8px;border-radius:inherit;z-index:-1;pointer-events:none;box-shadow:0 0 22px -2px rgba(124,92,255,.35),0 8px 26px -6px rgba(47,107,255,.32),0 0 30px -8px rgba(16,185,129,.25);}
@property --ga{syntax:'<angle>';inherits:false;initial-value:0deg;}
@keyframes gaSpin{to{--ga:360deg;}}
@keyframes ringHue{to{filter:hue-rotate(360deg);}}
@keyframes ringHueS{to{filter:hue-rotate(360deg);}}
/* AI mode: animated ring tracing the whole iPhone screen (body-level, device-shaped) */
#aiEdge{position:fixed;top:0;left:0;right:0;bottom:0;z-index:500;pointer-events:none;padding:4px;border-radius:max(38px,env(safe-area-inset-bottom,0px));background:conic-gradient(from var(--ga,0deg),#7C5CFF,#2F6BFF,#22D3EE,#10B981,#F59E0B,#EC4899,#7C5CFF);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude;opacity:0;filter:blur(1.2px) saturate(1.3);animation:gaSpin 5s linear infinite;transition:opacity .55s ease;}
#aiEdge.on{opacity:.85;}
/* ---------- Today at a glance bubbles ---------- */
.today-strip{grid-column:1 / -1;display:flex;gap:10px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:2px 2px 6px;scrollbar-width:none;scroll-snap-type:x proximity;}
.today-strip::-webkit-scrollbar{display:none;}
.today-strip:empty{display:none;}
.today-bub{position:relative;flex-shrink:0;scroll-snap-align:start;display:flex;flex-direction:column;align-items:flex-start;gap:3px;min-width:138px;max-width:200px;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:12px 14px 12px 17px;font-family:inherit;color:var(--ink);cursor:pointer;box-shadow:var(--shadow);text-align:left;overflow:hidden;animation:riseIn .38s var(--e-out) backwards;}
.today-bub::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c,var(--accent));border-radius:0 3px 3px 0;}
.tb-time{font-size:11.5px;font-weight:800;letter-spacing:.02em;color:var(--c,var(--accent));font-variant-numeric:tabular-nums;white-space:nowrap;}
.tb-title{font-size:14.5px;font-weight:700;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
.today-bub.more{--c:var(--faint);align-items:center;justify-content:center;min-width:96px;}
.today-bub.more .tb-time{font-size:16px;color:var(--ink);}
.today-bub.more .tb-title{font-size:11.5px;font-weight:600;color:var(--sub);}
.today-bub.empty{flex-direction:row;align-items:center;gap:8px;min-width:0;border-style:dashed;color:var(--sub);box-shadow:none;--c:transparent;}
.today-bub.empty::before{display:none;}
.today-bub.empty span{font-size:13px;font-weight:600;}
.ai-bar input{flex:1;border:1px solid var(--line);background:var(--surface-2);border-radius:24px;padding:13px 16px;font:16px 'Inter',sans-serif;color:var(--ink);}
.ai-bar input:focus{outline:none;border-color:var(--accent);}
.ai-bar button{width:46px;height:46px;border-radius:50%;border:none;background:var(--grad);color:var(--accent-ink);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.ai-empty{text-align:center;color:var(--sub);padding:34px 10px;display:flex;flex-direction:column;align-items:center;}
.ai-empty .rt{color:var(--ink);font-weight:600;font-size:16px;}
.ai-chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:18px;max-width:340px;}
.ai-chip{background:var(--surface-2);border:1px solid var(--line);color:var(--ink);border-radius:20px;padding:9px 14px;font:500 13px 'Inter',sans-serif;cursor:pointer;transition:.15s;}
.ai-chip:hover{border-color:var(--accent);color:var(--accent);}
.ai-msg.typing{display:inline-flex;gap:5px;align-items:center;padding:14px 16px;}

.ai-msg.typing span:nth-child(2){animation-delay:.15s;}
.ai-msg.typing span:nth-child(3){animation-delay:.3s;}
@keyframes aidot{0%,60%,100%{opacity:.25;transform:translateY(0);}30%{opacity:.9;transform:translateY(-3px);}}
.cat-ai{border-style:solid;color:var(--accent);}
.reqbtn{margin-top:18px;width:100%;padding:15px;border:1px dashed var(--hair);border-radius:18px;background:transparent;color:var(--sub);font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:border-color .2s,color .2s;}
.reqbtn:active{border-color:var(--accent);color:var(--accent);}
.toast{position:absolute;bottom:calc(34px + env(safe-area-inset-bottom,0px));left:50%;transform:translate(-50%,20px) scale(.96);background:rgba(15,23,42,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#fff;border:none;padding:11px 18px;border-radius:24px;font-size:13.5px;font-weight:700;opacity:0;transition:transform .45s cubic-bezier(.34,1.56,.64,1),opacity .3s;z-index:300;pointer-events:none;box-shadow:0 12px 30px -12px rgba(15,23,42,.22);white-space:nowrap;}
.toast.show{opacity:1;transform:translate(-50%,0) scale(1);}
.rcv-iv{display:flex;align-items:center;gap:13px;padding:11px 0;border-bottom:1px solid var(--line);}
.rcv-iv:last-child{border-bottom:none;}
.rcv-ix{width:22px;height:22px;border-radius:7px;background:var(--accent-soft);color:var(--accent);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none;}
svg{display:block;}
@keyframes fade{from{opacity:0;}to{opacity:1;}}
@keyframes riseIn{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:none;}}
.sk-pill{height:52px;border-radius:15px;background:linear-gradient(100deg,var(--surface) 40%,var(--surface-2) 50%,var(--surface) 60%);background-size:200% 100%;animation:skShimmer 1.3s linear infinite;border:1px solid var(--line);margin-bottom:8px;}
.sk-pill.sk2{width:78%;}
@keyframes skShimmer{to{background-position:-200% 0;}}
.anim-in .stack>.card,.anim-in .stack>.two,.anim-in .stack>.bud-grp,.anim-in .cal-agcard,.anim-in .life-wrap>.lifecard,.anim-in .today-strip,.anim-in .brain-wrap{animation:riseIn .38s var(--e-out) backwards;}
.anim-in .stack>*:nth-child(1),.anim-in .life-wrap>*:nth-child(1){animation-delay:.02s;}
.anim-in .stack>*:nth-child(2),.anim-in .life-wrap>*:nth-child(2){animation-delay:.05s;}
.anim-in .stack>*:nth-child(3),.anim-in .life-wrap>*:nth-child(3){animation-delay:.08s;}

/* ============ WELCOME ============ */
.welcome{position:absolute;inset:0;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(130% 100% at 50% 18%,#FFFFFF 0%,#F3F5F8 52%,#F3F5F8 100%);color:#0F172A;overflow:hidden;}
.welcome::after{content:'';position:absolute;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,rgba(77,107,255,.12),transparent 68%);filter:blur(12px);}
.welcome.in .wel-mark,.welcome.in .wel-hi,.welcome.in .wel-name{opacity:1;transform:none;}
.wel-mark{position:relative;z-index:1;width:88px;height:88px;border-radius:25px;border:1px solid rgba(15,23,42,.10);display:flex;align-items:center;justify-content:center;overflow:hidden;opacity:0;transform:scale(.8);transition:all .6s cubic-bezier(.2,.85,.25,1);box-shadow:0 20px 50px -18px rgba(20,24,40,.2);}

.welcome.hide{opacity:0;transition:opacity .55s ease;}
/* ============ TUTORIAL ============ */

.tut-step{max-width:340px;}
.tut-h{font-family:'Sora',sans-serif;font-size:27px;font-weight:700;line-height:1.15;letter-spacing:-0.02em;}

.tut-dots{display:flex;gap:8px;margin-top:34px;justify-content:center;}
.tut-dot{width:8px;height:8px;border-radius:50%;background:rgba(15,23,42,.15);transition:all .3s;}

.tut-fade{animation:tutFade .4s ease;}
@keyframes tutFade{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:none;}}
/* ============ INVITE ============ */
.invite-screen{position:absolute;inset:0;z-index:150;display:flex;align-items:center;justify-content:center;background:radial-gradient(130% 100% at 50% 12%,#FFFFFF 0%,#F3F5F8 52%,#F3F5F8 100%);color:#0F172A;overflow:hidden;padding:30px;}

/* ============ GUIDED SETUP ============ */
.setup{position:absolute;inset:0;z-index:120;background:radial-gradient(130% 100% at 50% -8%,#FFFFFF 0%,#F3F5F8 52%,#F3F5F8 100%);display:flex;flex-direction:column;padding:calc(30px + env(safe-area-inset-top,0px)) 22px calc(18px + env(safe-area-inset-bottom,0px));overflow-y:auto;animation:fade .45s ease;}
.setup.hide{animation:lift .5s cubic-bezier(.6,0,.2,1) forwards;}

/* ============================================================
   INTERACTION CRAFT LAYER — one consistent motion language for every
   tappable surface. Two halves:
   (a) TOUCH press feedback (applies on iPhone) — springy, tactile.
   (b) DESKTOP hover (web/trackpad only; iOS has no pointer hover) —
       lift + accent so the app feels alive on claude.ai / desktop too.
   All hover transforms are scoped to (hover:hover) per the §4 hard rules;
   the reduced-motion block below still overrides everything. */

/* (a) Touch press — snappier, more tactile than a flat opacity dip. */
.navi svg{transition:transform .2s var(--e-spring);}
.navi:active{opacity:1;}
.navi:active svg{transform:scale(.84);}
.fab{transition:transform .2s var(--e-spring),box-shadow .2s,filter .2s;}
.fab:active{transform:scale(.9);}
.btn{transition:transform .16s var(--e-out),filter .16s,box-shadow .2s;}
.tbtn.add:active{filter:brightness(.94);}

/* (b) Desktop hover — the "alive on web" pass. */
@media (hover:hover) and (pointer:fine){
  .navi{transition:color .18s;}
  .navi:hover{color:var(--sub);}
  .navi:hover svg{transform:translateY(-2px);}
  .navi.on:hover{color:var(--accent);}

  .btn:hover{filter:brightness(1.04);transform:translateY(-1px);}
  .btn-primary:hover{box-shadow:0 12px 26px -12px color-mix(in srgb,var(--accent) 70%,transparent);}
  .btn-ghost:hover{border-color:var(--hair);background:var(--surface-2);}
  .tbtn:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));color:var(--accent);transform:translateY(-1px);}
  .tbtn.add:hover{color:var(--accent-ink);filter:brightness(1.05);transform:translateY(-1px);}
  .reqbtn:hover{border-color:var(--accent);color:var(--accent);}

  .fab:hover{transform:translateY(-2px);box-shadow:0 20px 40px -12px color-mix(in srgb,var(--accent) 78%,transparent);}
  .back:hover{background:var(--surface-2);}
  .pill:hover{border-color:var(--hair);background:var(--surface-3);}
  .logo:hover{transform:translateY(-1px);box-shadow:var(--shadow-lg);}

  .card[onclick]{transition:transform .18s var(--e-out),box-shadow .2s,border-color .2s;}
  .card[onclick]:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);border-color:var(--hair);}
  .row[onclick]:hover{background:var(--surface-2);}

  /* Category tiles on a category screen (.tile) already lift; nudge the
     icon chip + give the label an accent tick so hover reads clearly. */
  .tile:hover .chip{transform:scale(1.06);}
  .tile .chip{transition:transform .22s var(--e-spring);}

  /* Home life cards: deepen the existing hover with an accent name shift. */
  .lifecard:hover .lifecard-name{color:var(--accent);}
  .cust-head:hover .cust-head-name{color:var(--accent);}
}

var CURRENCIES=[
  {code:'AUD',sym:'A$',locale:'en-AU',name:'Australian Dollar'},
  {code:'GBP',sym:'£',locale:'en-GB',name:'British Pound'},
  {code:'USD',sym:'$',locale:'en-US',name:'US Dollar'},
  {code:'EUR',sym:'€',locale:'en-IE',name:'Euro'},
  {code:'NZD',sym:'NZ$',locale:'en-NZ',name:'New Zealand Dollar'},
  {code:'CAD',sym:'C$',locale:'en-CA',name:'Canadian Dollar'},
  {code:'DKK',sym:'kr',locale:'da-DK',name:'Danish Krone'},
  {code:'JPY',sym:'¥',locale:'ja-JP',name:'Japanese Yen'},
  {code:'CHF',sym:'CHF',locale:'de-CH',name:'Swiss Franc'},
  {code:'SGD',sym:'S$',locale:'en-SG',name:'Singapore Dollar'},
  {code:'INR',sym:'₹',locale:'en-IN',name:'Indian Rupee'}
];
function curKey(){return 'forge.currency.'+(typeof currentUser!=='undefined'&&currentUser?currentUser.id:'x');}
function getCurrency(){var c=lsGet(curKey());for(var i=0;i<CURRENCIES.length;i++)if(CURRENCIES[i].code===c)return CURRENCIES[i];return CURRENCIES[0];}
function setCurrency(code){lsSet(curKey(),code);}
// One formatter used app-wide. money(v) -> "A$1,234"; money(v,2) keeps decimals.
function money(v,dp){var c=getCurrency();var n=Number(v)||0;var max=(dp!=null)?dp:(Math.abs(n)<100&&n%1!==0?2:0);try{return c.sym+n.toLocaleString(c.locale,{minimumFractionDigits:0,maximumFractionDigits:max});}catch(e){return c.sym+Math.round(n).toLocaleString();}}
function curSym(){return getCurrency().sym;}
function curByCode(code){for(var i=0;i<CURRENCIES.length;i++)if(CURRENCIES[i].code===code)return CURRENCIES[i];return CURRENCIES[0];}
// Format an amount that is KNOWN to be in a specific currency (per-account, converter, etc.)
function moneyIn(v,code,dp){var c=curByCode(code);var n=Number(v)||0;var max=(dp!=null)?dp:(Math.abs(n)<100&&n%1!==0?2:0);try{return c.sym+n.toLocaleString(c.locale,{minimumFractionDigits:0,maximumFractionDigits:max});}catch(e){return c.sym+Math.round(n).toLocaleString();}}
// ---- Live exchange rates (base USD), cached 6h in localStorage, with a sane offline fallback ----
var FX_FALLBACK={USD:1,GBP:0.79,EUR:0.92,AUD:1.52,NZD:1.66,CAD:1.37,DKK:6.87,JPY:157,CHF:0.88,SGD:1.35,INR:83.4};
var _fxCache=null;
function _fxRead(){if(_fxCache)return _fxCache;try{var raw=lsGet('forge.fx');if(raw){var j=JSON.parse(raw);if(j&&j.rates){_fxCache=j;return j;}}}catch(e){}return null;}
function fxRates(){var c=_fxRead();return (c&&c.rates)||FX_FALLBACK;}
function fxAgeMs(){var c=_fxRead();return c&&c.t?(Date.now()-c.t):Infinity;}
function fxIsLive(){var c=_fxRead();return !!(c&&c.live);}
async function fxEnsure(force){
  var c=_fxRead();
  if(!force&&c&&(Date.now()-c.t)<6*3600000)return c.rates;   // fresh enough
  try{
    var res=await fetch('https://open.er-api.com/v6/latest/USD');
    var data=await res.json();
    if(data&&data.rates&&data.rates.GBP){
      var keep={};CURRENCIES.forEach(function(cur){if(data.rates[cur.code]!=null)keep[cur.code]=data.rates[cur.code];});
      _fxCache={rates:keep,t:Date.now(),live:true};lsSet('forge.fx',JSON.stringify(_fxCache));
      return keep;
    }
  }catch(e){}
  if(c&&c.rates)return c.rates;                                // stale but usable
  _fxCache={rates:FX_FALLBACK,t:Date.now(),live:false};       // never fetched → fallback
  return FX_FALLBACK;
}
// Convert between any two currencies via the USD-based table.
function fxConvert(amount,from,to){var r=fxRates();var rf=r[from]||FX_FALLBACK[from]||1,rt=r[to]||FX_FALLBACK[to]||1;return (Number(amount)||0)/rf*rt;}

async function sha256hex(str){var buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str));return Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,'0');}).join('');}

var _itemsMem={};
async function loadItems(tab){
  if(!currentUser)return[];
  var ck='forge.cache.items.'+currentUser.id+'.'+tab;
  // 1) Instant return from memory/localStorage if we have it; revalidate in background.
  var cached=_itemsMem[tab];
  if(!cached){var raw=lsGet(ck);if(raw){try{cached=JSON.parse(raw);_itemsMem[tab]=cached;}catch(e){}}}
  if(cached){_revalidateItems(tab,ck);return cached;}
  // 2) No cache → must fetch now.
  return await _fetchItems(tab,ck);
}
async function _fetchItems(tab,ck){
  setSyncState('syncing');
  try{
    var r=await sb.from('items').select('*').eq('user_id',currentUser.id).eq('tab',tab).order('position').order('created_at');
    if(r.error)throw r.error;
    var arr=r.data.map(function(x){return {id:x.id,t:x.title,s:x.subtitle};});
    _itemsMem[tab]=arr;lsSet(ck,JSON.stringify(arr));setSyncState('');return arr;
  }catch(e){setSyncState('error');var raw=lsGet(ck);return raw?JSON.parse(raw):[];}
}
var _reval={};
function _revalidateItems(tab,ck){
  if(_reval[tab])return;_reval[tab]=1;
  (async function(){
    try{
      var r=await sb.from('items').select('*').eq('user_id',currentUser.id).eq('tab',tab).order('position').order('created_at');
      if(!r.error){
        var arr=r.data.map(function(x){return {id:x.id,t:x.title,s:x.subtitle};});
        var prev=JSON.stringify(_itemsMem[tab]||[]);
        if(JSON.stringify(arr)!==prev){_itemsMem[tab]=arr;lsSet(ck,JSON.stringify(arr));
          // Repaint only if the user is still looking at this tab.
          if(current&&current.tab===tab){try{var html=await renderTab(tab);if(current.el&&current.el.parentNode){var sc=current.el.scrollTop;current.el.innerHTML=html;current.el.scrollTop=sc;}}catch(e){}}
        }
      }
    }catch(e){}
    _reval[tab]=0;
  })();
}
function _itemsInvalidate(tab){delete _itemsMem[tab];if(currentUser)lsDel('forge.cache.items.'+currentUser.id+'.'+tab);}
async function addItemDB(tab,title,subtitle){
  if(!currentUser)return;setSyncState('syncing');
  // Optimistic: update memory cache immediately so the next render is instant.
  try{var r=await sb.from('items').insert({user_id:currentUser.id,tab:tab,title:title,subtitle:subtitle||null,position:0}).select();if(r.error)throw r.error;
    if(r.data&&r.data[0]){_itemsMem[tab]=[{id:r.data[0].id,t:title,s:subtitle||null}].concat(_itemsMem[tab]||[]);lsSet('forge.cache.items.'+currentUser.id+'.'+tab,JSON.stringify(_itemsMem[tab]));}
    else _itemsInvalidate(tab);
    setSyncState('');}
  catch(e){setSyncState('error');console.error(e);toast('Could not save — check connection');}
}
async function deleteItemDB(id,tab){
  if(!currentUser)return;setSyncState('syncing');
  if(_itemsMem[tab]){_itemsMem[tab]=_itemsMem[tab].filter(function(x){return x.id!==id;});lsSet('forge.cache.items.'+currentUser.id+'.'+tab,JSON.stringify(_itemsMem[tab]));}
  try{var r=await sb.from('items').delete().eq('id',id);if(r.error)throw r.error;setSyncState('');}
  catch(e){setSyncState('error');console.error(e);}
}

var _finMem={},_finReval={};
function _finInvalidate(key){delete _finMem[key];}
function _finInvalidateAll(){_finMem={};}
function _finRevalidate(key,fetchFn){

// ZERO-BASED BUDGET ENGINE (groups > categories > assign + spend, per month)
// ============================================================
// Budget periods follow the questionnaire answer: weekly / fortnightly / monthly.
// Keys: monthly 'YYYY-MM' · weekly 'W:YYYY-MM-DD' (Monday) · fortnightly 'F:YYYY-MM-DD' (anchored Monday).
var _BUD_FN_ANCHOR='2024-01-01'; // a Monday — keeps fortnight boundaries stable forever
function budCycle(){return (_budProfile&&_budProfile.cycle)||'monthly';}
function budPeriodWord(){var c=budCycle();return c==='weekly'?'week':(c==='fortnightly'?'fortnight':'month');}
function _budISO(d){return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}
function budMonthKey(d){
  d=d||new Date();var cyc=budCycle();
  if(cyc==='weekly')return 'W:'+_budISO(shMonday(d));
  if(cyc==='fortnightly'){
    var mon=shMonday(d);
    var wks=Math.round((mon-new Date(_BUD_FN_ANCHOR+'T00:00:00'))/(7*86400000));
    if(((wks%2)+2)%2===1)mon.setDate(mon.getDate()-7);   // snap to the anchored fortnight start
    return 'F:'+_budISO(mon);
  }
  return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2);
}
function budMonthLabel(m){
  m=m||budMonthKey();
  if(m.charAt(1)===':'){
    var span=m.charAt(0)==='W'?6:13;
    var a=new Date(m.slice(2)+'T00:00:00');var b=new Date(a);b.setDate(b.getDate()+span);
    var aFmt=a.toLocaleDateString(undefined,a.getMonth()===b.getMonth()?{day:'numeric'}:{day:'numeric',month:'short'});
    return aFmt+' \u2013 '+b.toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'});
  }
  var p=m.split('-');var dt=new Date(Number(p[0]),Number(p[1])-1,1);
  return dt.toLocaleDateString(undefined,{month:'long',year:'numeric'});
}
function budShiftMonth(m,delta){
  m=m||budMonthKey();
  if(m.charAt(1)===':'){
    var step=m.charAt(0)==='W'?7:14;
    var a=new Date(m.slice(2)+'T00:00:00');a.setDate(a.getDate()+step*delta);
    return m.charAt(0)+':'+_budISO(a);
  }
  var p=m.split('-');var dt=new Date(Number(p[0]),Number(p[1])-1+delta,1);
  return dt.getFullYear()+'-'+('0'+(dt.getMonth()+1)).slice(-2);
}

// Compute the full month rollup: per-category assigned/spent, group totals, ready-to-assign.
async function budCompute(month){
  await getBudProfile();   // cycle must be known so period keys are correct
  var cats=await budGetCats();
  var assign=await budGetAssign(month);
  var txns=await budGetTxns(month);
  var income=await budGetIncome(month);
  var subs=await getSubs();
  var spentByCat={};txns.forEach(function(t){spentByCat[t.cat]=(spentByCat[t.cat]||0)+t.amount;});
  var totalAssigned=0;cats.forEach(function(c){totalAssigned+=(assign[c.id]||0);});
  // group the categories
  var groups={};var order=[];
  cats.forEach(function(c){
    if(!groups[c.grp]){groups[c.grp]={name:c.grp,cats:[],assigned:0,spent:0};order.push(c.grp);}
    var a=assign[c.id]||0;var sp=spentByCat[c.id]||0;
    groups[c.grp].cats.push({id:c.id,name:c.name,icon:c.icon,assigned:a,spent:sp,left:a-sp,rollover:c.rollover});
    groups[c.grp].assigned+=a;groups[c.grp].spent+=sp;
  });
  var totalSpent=txns.reduce(function(s,t){return s+t.amount;},0);
  var subMonthlyTotal=subs.reduce(function(s,x){return s+subMonthly(x);},0);
  return {month:month,income:income,assigned:totalAssigned,spent:totalSpent,toAssign:income-totalAssigned,
    groups:order.map(function(g){return groups[g];}),cats:cats,txns:txns,subMonthly:subMonthlyTotal,subs:subs};
}

async function loadTabs(){
  _tabsCache=null;
  if(!currentUser)return;
  var raw=lsGet(tabsKey());                            // instant local fallback
  if(raw){try{var a=JSON.parse(raw);if(Array.isArray(a))_tabsCache=a;}catch(e){}}
  try{
    var r=await sb.from('settings').select('enabled_tabs').eq('user_id',currentUser.id).maybeSingle();
    if(r.data&&r.data.enabled_tabs!=null){
      var arr=typeof r.data.enabled_tabs==='string'?JSON.parse(r.data.enabled_tabs):r.data.enabled_tabs;
      if(Array.isArray(arr)){_tabsCache=arr;lsSet(tabsKey(),JSON.stringify(arr));}
    } else if(_tabsCache!==null){                       // migrate this device's choice up to the cloud
      sb.from('settings').upsert({user_id:currentUser.id,enabled_tabs:JSON.stringify(_tabsCache),updated_at:new Date().toISOString()},{onConflict:'user_id'});
    }
  }catch(e){}
  migrateFinanceTabs();

}
