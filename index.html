<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="theme-color" content="#23493A"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Forge"/>
<title>Forge — Build your life</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--ink:#26231E;--sub:#8A8377;--cream:#F6F2E9;--paper:#FBF8F1;--accent:#23493A;--accent-2:#173026;--gold:#B4925A;--line:rgba(38,35,30,.07);}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
html,body{height:100%;touch-action:manipulation;}
body{font-family:'DM Sans',system-ui,sans-serif;color:var(--ink);background:#E9E4D8;display:flex;justify-content:center;-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;}
input,textarea{-webkit-user-select:text;user-select:text;}
.serif{font-family:'Fraunces',Georgia,serif;}
#app{width:100%;max-width:480px;min-height:100vh;min-height:100dvh;background:var(--cream);display:flex;flex-direction:column;position:relative;overflow:hidden;}
@media(min-width:520px){#app{box-shadow:0 0 60px rgba(38,35,30,.12);}}
header{padding:calc(18px + env(safe-area-inset-top,0px)) 20px 14px;display:flex;align-items:center;gap:12px;border-bottom:1px solid rgba(180,146,90,.22);}
.logo{width:42px;height:42px;border-radius:13px;background:var(--paper);display:flex;align-items:center;justify-content:center;color:var(--accent);font-family:'Fraunces',serif;font-weight:700;font-size:25px;line-height:1;border:1.5px solid var(--gold);box-shadow:0 4px 12px rgba(38,35,30,.1);flex-shrink:0;cursor:pointer;}
.htext{flex:1;}.htext h1{font-family:'Fraunces',serif;font-size:23px;font-weight:600;line-height:1;}
.htext span{font-size:11px;color:var(--sub);letter-spacing:.1em;text-transform:uppercase;display:block;margin-top:4px;}
.pill{display:flex;align-items:center;gap:8px;padding:7px 12px;border-radius:30px;background:var(--paper);border:1px solid var(--line);cursor:pointer;transition:background .2s;}
.pill:hover{background:rgba(38,35,30,.05);}
.pill .av{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#23493A,#B4925A);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;}
.pill .nm{font-size:13.5px;font-weight:600;}
.back{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;margin-left:-6px;transition:background .18s,transform .18s;touch-action:manipulation;}
.back:hover{background:rgba(38,35,30,.06);}.back:active{transform:scale(.9);}
/* sync dot */
.sync-dot{width:8px;height:8px;border-radius:50%;background:#5E8C61;flex-shrink:0;transition:background .3s;}
.sync-dot.syncing{background:var(--gold);animation:pulse-dot 1s ease-in-out infinite;}
.sync-dot.error{background:#B5687C;}
@keyframes pulse-dot{0%,100%{opacity:1;}50%{opacity:.4;}}
#stage{position:relative;flex:1;overflow:hidden;}
.screen{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 18px calc(34px + env(safe-area-inset-bottom,0px));background:var(--cream);will-change:transform;touch-action:pan-y;}
.screen::-webkit-scrollbar{width:0;}
.screen.enter-right{transform:translateX(100%);}
.screen.enter-left{transform:translateX(-24%);filter:brightness(.92);}
.screen.show{transform:translateX(0);filter:none;transition:transform .44s cubic-bezier(.22,.85,.26,1),filter .44s ease;}
.screen.exit-left{transform:translateX(-24%);filter:brightness(.92);transition:transform .44s cubic-bezier(.22,.85,.26,1),filter .44s ease;}
.screen.exit-right{transform:translateX(100%);transition:transform .44s cubic-bezier(.22,.85,.26,1);}
.screen.dragging{transition:none!important;filter:none!important;}
.home-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px;}
.tile{border-radius:24px;padding:18px;min-height:132px;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 2px 6px rgba(38,35,30,.05);transition:transform .28s cubic-bezier(.2,.8,.2,1),box-shadow .28s;position:relative;overflow:hidden;touch-action:manipulation;}
.tile:hover{transform:translateY(-4px);box-shadow:0 14px 30px rgba(38,35,30,.1);}
.tile:active{transform:translateY(0) scale(.97);}
.tile::before{content:'';position:absolute;inset:0 0 auto 0;height:42%;border-radius:24px 24px 0 0;background:linear-gradient(rgba(255,255,255,.18),transparent);pointer-events:none;}
.tile .chip{width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 3px 8px rgba(38,35,30,.12);}
.tile .t{font-weight:700;font-size:16.5px;}.tile .s{font-size:12px;color:rgba(38,35,30,.55);margin-top:2px;}
.tile.hero{grid-column:1/-1;min-height:0;background:linear-gradient(135deg,#23493A,#173026);color:var(--cream);box-shadow:0 10px 26px rgba(23,48,38,.32);gap:6px;padding:20px 22px;justify-content:center;align-items:flex-start;}
.tile.hero::before{height:60%;background:linear-gradient(rgba(255,255,255,.06),transparent);}
.tile.hero .hero-greet{font-size:25px;font-weight:600;margin-top:8px;line-height:1.05;}
.tile.hero .hero-sub{font-size:13.5px;opacity:.85;margin-top:3px;}
.tile.ghost{background:transparent;border:1.5px dashed rgba(38,35,30,.2);box-shadow:none;color:var(--sub);}
.tile.ghost::before{display:none;}.tile.ghost:hover{border-color:var(--accent);}
.tile.ghost .t{color:var(--sub);}.tile.ghost .chip.ghostchip{background:rgba(38,35,30,.06);color:var(--sub);box-shadow:none;}
.screen.show .tile{animation:tIn .5s cubic-bezier(.2,.8,.2,1) both;}
.screen.show .tile:nth-child(1){animation-delay:.02s}.screen.show .tile:nth-child(2){animation-delay:.06s}.screen.show .tile:nth-child(3){animation-delay:.1s}.screen.show .tile:nth-child(4){animation-delay:.14s}.screen.show .tile:nth-child(5){animation-delay:.18s}.screen.show .tile:nth-child(6){animation-delay:.22s}.screen.show .tile:nth-child(7){animation-delay:.26s}.screen.show .tile:nth-child(8){animation-delay:.3s}.screen.show .tile:nth-child(9){animation-delay:.34s}.screen.show .tile:nth-child(10){animation-delay:.38s}
@keyframes tIn{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
.card{background:var(--paper);border-radius:22px;padding:18px;border:1px solid var(--line);box-shadow:0 1px 3px rgba(38,35,30,.04);}
.stack{display:grid;gap:14px;}
.ctitle{font-size:12px;font-weight:600;color:var(--sub);letter-spacing:.06em;text-transform:uppercase;margin:2px 2px 12px;}
.row{display:flex;align-items:center;gap:12px;padding:12px 8px;border-radius:12px;transition:background .18s;}
.row:hover{background:rgba(38,35,30,.035);}
.dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.row .rt{font-weight:600;font-size:15px;}.row .rs{font-size:12.5px;color:var(--sub);margin-top:1px;}
.dark{background:var(--ink);color:var(--cream);}
.dark .small{font-size:13px;opacity:.7;}.dark h2{font-family:'Fraunces',serif;font-size:30px;font-weight:600;margin-top:2px;}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.stat .k{display:flex;align-items:center;gap:7px;color:var(--sub);font-size:12px;margin-bottom:8px;}
.stat .v{font-weight:700;font-size:22px;}.stat .d{font-size:12px;color:var(--sub);margin-top:2px;}
.checkbox{width:20px;height:20px;border-radius:6px;border:2px solid rgba(38,35,30,.2);flex-shrink:0;}
.circlebox{width:20px;height:20px;border-radius:50%;border:2px solid rgba(38,35,30,.2);flex-shrink:0;}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center;}
.cal .h{font-size:11px;color:var(--sub);font-weight:600;padding-bottom:4px;}
.cal .cell{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:12px;font-size:13px;font-weight:500;}
.cal .today{background:var(--accent);color:#fff;font-weight:700;}
.evdot{width:4px;height:4px;border-radius:50%;background:var(--accent);margin-top:2px;}
.bar{height:8px;border-radius:8px;background:rgba(38,35,30,.07);overflow:hidden;}
.bar>div{height:100%;border-radius:8px;}
.fab{position:absolute;bottom:calc(24px + env(safe-area-inset-bottom,0px));right:22px;width:56px;height:56px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(35,73,58,.4);cursor:pointer;border:none;transition:transform .2s cubic-bezier(.2,.8,.2,1),box-shadow .2s;z-index:40;touch-action:manipulation;}
.fab:hover{transform:translateY(-2px) rotate(90deg);box-shadow:0 10px 26px rgba(35,73,58,.5);}
.overlay{position:absolute;inset:0;background:rgba(38,35,30,.4);display:flex;align-items:flex-end;justify-content:center;z-index:50;animation:fade .25s ease;}
.sheet{width:100%;background:var(--cream);border-radius:26px 26px 0 0;padding:24px 22px 30px;animation:up .32s cubic-bezier(.2,.85,.25,1);}
.sheet h3{font-family:'Fraunces',serif;font-size:20px;font-weight:600;}
.sheet p{font-size:13.5px;color:var(--sub);margin-top:4px;margin-bottom:14px;}
.sheet textarea{width:100%;min-height:96px;border:1px solid var(--line);border-radius:14px;padding:12px;font-family:'DM Sans',sans-serif;font-size:14.5px;resize:none;background:var(--paper);color:var(--ink);}
.sheet textarea:focus{outline:none;border-color:var(--accent);}
.sheet input{width:100%;border:1px solid var(--line);border-radius:14px;padding:13px 14px;font-family:'DM Sans',sans-serif;font-size:15px;background:var(--paper);color:var(--ink);margin-bottom:10px;}
.sheet input:focus{outline:none;border-color:var(--accent);}
.btnrow{display:flex;gap:10px;margin-top:14px;}
.btn{flex:1;padding:14px;border-radius:14px;border:none;font-family:'DM Sans',sans-serif;font-size:15px;font-weight:600;cursor:pointer;}
.btn-primary{background:var(--accent);color:#fff;}.btn-ghost{background:rgba(38,35,30,.07);color:var(--ink);}
.done{text-align:center;padding:10px 0 4px;}
.done .tick{width:54px;height:54px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;}
.badge{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:3px 9px;border-radius:20px;background:rgba(35,73,58,.1);color:var(--accent);}
.uav{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#23493A,#B4925A);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex-shrink:0;}
.lock{position:absolute;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--cream);background:radial-gradient(125% 95% at 50% 18%,#2C5A46 0%,#1B3A2C 55%,#112317 100%);overflow:hidden;}
.lock::after{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(125% 125% at 50% 45%,transparent 52%,rgba(0,0,0,.4) 100%);}
.lock.hide{animation:lift .65s cubic-bezier(.6,0,.2,1) forwards;}
@keyframes lift{to{opacity:0;transform:translateY(-26px);visibility:hidden;}}
.glow{position:absolute;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,rgba(180,146,90,.22),transparent 65%);filter:blur(6px);animation:pulse 4.5s ease-in-out infinite;}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.65;}50%{transform:scale(1.14);opacity:1;}}
.intro-mark{width:96px;height:96px;border-radius:26px;border:2px solid var(--gold);background:rgba(246,242,233,.04);display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-weight:600;font-size:58px;color:var(--cream);line-height:1;box-shadow:0 24px 60px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.08);opacity:0;animation:markIn 1.1s cubic-bezier(.2,.8,.2,1) .15s forwards;position:relative;z-index:2;}
@keyframes markIn{from{opacity:0;transform:scale(.7) translateY(10px);}to{opacity:1;transform:none;}}
.intro-word{margin-top:28px;font-family:'Fraunces',serif;font-size:30px;font-weight:500;letter-spacing:.4em;padding-left:.4em;color:var(--cream);position:relative;z-index:2;text-align:center;}
.intro-word span{display:inline-block;opacity:0;animation:letterIn .6s cubic-bezier(.2,.8,.2,1) forwards;}
@keyframes letterIn{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:none;}}
.intro-rule{width:0;height:1px;background:var(--gold);margin:22px 0 16px;opacity:.85;animation:rule 1s ease 1.15s forwards;position:relative;z-index:2;}
@keyframes rule{to{width:120px;}}
.intro-tag{font-size:11px;letter-spacing:.42em;padding-left:.42em;color:var(--gold);text-transform:uppercase;opacity:0;animation:fadein .9s ease 1.55s forwards;position:relative;z-index:2;}
@keyframes fadein{to{opacity:1;}}
.pin-wrap{width:100%;max-width:300px;display:flex;flex-direction:column;align-items:center;position:relative;z-index:2;padding:0 22px;}
.pin-logo{width:54px;height:54px;border-radius:16px;border:1.5px solid var(--gold);display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-weight:600;font-size:30px;color:var(--cream);margin-bottom:22px;line-height:1;}
.pin-title{font-family:'Fraunces',serif;font-size:22px;font-weight:500;margin-bottom:6px;}
.pin-sub{font-size:13px;color:rgba(246,242,233,.6);margin-bottom:26px;text-align:center;}
.dots{display:flex;gap:16px;margin-bottom:36px;}
.dot-pin{width:14px;height:14px;border-radius:50%;border:1.5px solid rgba(246,242,233,.5);transition:all .2s;}
.dot-pin.on{background:var(--gold);border-color:var(--gold);transform:scale(1.12);}
.dots.err{animation:shake .42s;}
@keyframes shake{0%,100%{transform:translateX(0);}20%,60%{transform:translateX(-9px);}40%,80%{transform:translateX(9px);}}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;width:100%;}
.key{height:68px;border-radius:50%;background:rgba(246,242,233,.06);border:1px solid rgba(246,242,233,.12);color:var(--cream);font-family:'DM Sans',sans-serif;font-size:26px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .12s,background .15s;-webkit-user-select:none;user-select:none;touch-action:manipulation;}
.key:active{transform:scale(.92);background:rgba(246,242,233,.18);}
.key.blank{background:transparent;border:none;cursor:default;}
.key.fn{font-size:14px;letter-spacing:.03em;color:rgba(246,242,233,.7);background:transparent;border:none;}
.seg{display:flex;gap:4px;background:rgba(38,35,30,.06);padding:4px;border-radius:14px;margin-bottom:14px;}
.seg-btn{flex:1;border:none;background:transparent;padding:9px 8px;border-radius:10px;font:600 13px 'DM Sans',sans-serif;color:var(--sub);cursor:pointer;transition:all .2s;}
.seg-btn.on{background:var(--paper);color:var(--ink);box-shadow:0 1px 3px rgba(38,35,30,.1);}
.seg.sm{margin:0;}.seg.sm .seg-btn{padding:6px 12px;font-size:12px;flex:0 0 auto;}
.trow{display:flex;align-items:center;gap:12px;padding:10px 4px;}
.chip.sm{width:34px;height:34px;border-radius:11px;color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 2px 6px rgba(38,35,30,.12);}
.tbtn{border:1px solid var(--line);background:var(--paper);color:var(--ink);font:600 12.5px 'DM Sans',sans-serif;padding:7px 13px;border-radius:20px;cursor:pointer;transition:all .18s;touch-action:manipulation;}
.tbtn.add{background:var(--accent);color:#fff;border-color:transparent;}
.tbtn.rm{color:#B5687C;}
.del{background:none;border:none;color:var(--sub);cursor:pointer;padding:6px;border-radius:8px;display:inline-flex;align-items:center;touch-action:manipulation;}
.del:hover{color:#B5687C;background:rgba(181,104,124,.1);}
.acct-head{display:flex;align-items:center;gap:14px;margin-bottom:18px;}
.acct-list{display:flex;flex-direction:column;gap:4px;margin-bottom:8px;}
.acct-item{display:flex;align-items:center;gap:12px;width:100%;border:none;background:transparent;padding:13px 6px;border-radius:12px;font:600 15px 'DM Sans',sans-serif;color:var(--ink);cursor:pointer;text-align:left;transition:background .15s;touch-action:manipulation;}
.acct-item:hover{background:rgba(38,35,30,.04);}
.acct-item>span{flex:1;}
.theme-row{justify-content:space-between;cursor:default;}
.cd-card .cd-big{font-family:'Fraunces',serif;font-weight:600;font-size:54px;line-height:1;margin:10px 0 6px;color:var(--accent);}
.meal-row{cursor:pointer;}
.note{margin-top:10px;font-size:12px;color:var(--sub);display:flex;align-items:center;gap:6px;padding:8px 10px;background:rgba(35,73,58,.06);border-radius:10px;line-height:1.4;}
.ai-wrap{display:flex;flex-direction:column;min-height:calc(100% - 4px);}
.ai-thread{flex:1;display:flex;flex-direction:column;gap:10px;padding:6px 2px 12px;}
.ai-msg{max-width:82%;padding:11px 14px;border-radius:18px;font-size:14.5px;line-height:1.45;}
.ai-msg.me{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:6px;}
.ai-msg.ai{align-self:flex-start;background:var(--paper);border:1px solid var(--line);border-bottom-left-radius:6px;}
.ai-empty{text-align:center;color:var(--sub);padding:36px 20px;}
.ai-bar{position:sticky;bottom:0;display:flex;gap:8px;padding:10px 0 2px;background:linear-gradient(transparent,var(--cream) 28%);}
.ai-bar input{flex:1;border:1px solid var(--line);background:var(--paper);border-radius:24px;padding:13px 16px;font:15px 'DM Sans',sans-serif;color:var(--ink);}
.ai-bar input:focus{outline:none;border-color:var(--accent);}
.ai-bar button{width:46px;height:46px;border-radius:50%;border:none;background:var(--accent);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.welcome{position:absolute;inset:0;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(125% 95% at 50% 30%,#2C5A46 0%,#1B3A2C 55%,#112317 100%);color:#F6F2E9;}
.welcome.in .wel-mark,.welcome.in .wel-hi,.welcome.in .wel-name{opacity:1;transform:none;}
.wel-mark{width:84px;height:84px;border-radius:24px;border:2px solid #C6A56B;display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-weight:600;font-size:46px;color:#F6F2E9;opacity:0;transform:scale(.8);transition:all .6s cubic-bezier(.2,.85,.25,1);}
.wel-hi{font-size:18px;font-weight:500;opacity:0;transform:translateY(10px);transition:all .5s ease .15s;margin-top:22px;color:rgba(246,242,233,.8);}
.wel-name{font-family:'Fraunces',serif;font-size:34px;font-weight:600;opacity:0;transform:translateY(10px);transition:all .5s cubic-bezier(.2,.85,.25,1) .28s;}
.welcome.hide{opacity:0;transition:opacity .55s ease;}
.reqbtn{margin-top:18px;width:100%;padding:15px;border:1.5px dashed rgba(38,35,30,.2);border-radius:20px;background:transparent;color:var(--sub);font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:border-color .2s,color .2s;touch-action:manipulation;}
.reqbtn:hover{border-color:var(--accent);color:var(--accent);}
.toast{position:absolute;bottom:calc(34px + env(safe-area-inset-bottom,0px));left:50%;transform:translate(-50%,16px);background:var(--ink);color:var(--cream);padding:11px 18px;border-radius:24px;font-size:13.5px;font-weight:600;opacity:0;transition:all .3s;z-index:300;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.25);}
.toast.show{opacity:1;transform:translate(-50%,0);}
svg{display:block;}
@keyframes fade{from{opacity:0;}to{opacity:1;}}
@keyframes up{from{transform:translateY(100%);}to{transform:none;}}
@keyframes slidein{from{opacity:0;transform:translateX(26px);}to{opacity:1;transform:none;}}
/* dark theme */
html[data-theme=dark]{--ink:#F0EBE0;--sub:#A39B8A;--cream:#141310;--paper:#201E18;--accent:#3E7E60;--gold:#CDA968;--line:rgba(255,255,255,.08);}
html[data-theme=dark] body{background:var(--cream);}
html[data-theme=dark] .screen,html[data-theme=dark] header{background:var(--cream);}
html[data-theme=dark] header{border-bottom-color:rgba(255,255,255,.07);}
html[data-theme=dark] .logo{background:#2A2720;border-color:var(--gold);color:#F0EBE0;}
html[data-theme=dark] .pill{background:var(--paper);border-color:rgba(255,255,255,.09);}
html[data-theme=dark] .card{background:linear-gradient(180deg,#221F19,#1B1914);border-color:rgba(255,255,255,.07);box-shadow:0 2px 12px rgba(0,0,0,.34);}

// ============================================================
async function sha256hex(str){
  var buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,'0');}).join('');
}

async function loadItems(tab){
  if(!currentUser)return[];
  var cacheKey='forge.cache.items.'+currentUser.id+'.'+tab;
  setSyncState('syncing');
  try{
    var {data,error}=await sb.from('items').select('*').eq('user_id',currentUser.id).eq('tab',tab).order('position');
    if(error)throw error;
    var arr=data.map(function(r){return {id:r.id,t:r.title,s:r.subtitle};});
    lsSet(cacheKey,JSON.stringify(arr));
    setSyncState('');
    return arr;
  }catch(e){
    setSyncState('error');
    var raw=lsGet(cacheKey);
    return raw?JSON.parse(raw):[];
  }
}
async function addItemDB(tab,title,subtitle){

    if(error)throw error;
    setSyncState('');

    lsSet('forge.cache.items.'+currentUser.id+'.'+tab,null);

}

  for(var i=0;i<4;i++){var d=document.createElement('div');d.className='dot-pin';dots.appendChild(d);}
  updateDots();
}
function updateDots(){
  var dots=document.getElementById('pinDots').children;
  for(var i=0;i<dots.length;i++)dots[i].className='dot-pin'+(i<pinEntry.length?' on':'');
}
function buildKeypad(){
  var kp=document.getElementById('keypad');kp.innerHTML='';
  ['1','2','3','4','5','6','7','8','9','','0','del'].forEach(function(k){
    var b=document.createElement('button');
    if(k===''){b.className='key blank';}
    else if(k==='del'){b.className='key fn';b.textContent='Delete';bindKey(b,pinDel);}
    else{b.className='key';b.textContent=k;bindKey(b,(function(n){return function(){pinPush(n);};})(k));}
    kp.appendChild(b);
  });
}
function bindKey(b,fn){b.addEventListener('pointerdown',function(e){e.preventDefault();fn();},{passive:false});}
function pinPush(n){if(pinEntry.length>=4)return;pinEntry+=n;updateDots();if(pinEntry.length===4)setTimeout(pinSubmit,130);}
function pinDel(){pinEntry=pinEntry.slice(0,-1);updateDots();}
function pinError(){
  var d=document.getElementById('pinDots');d.classList.add('err');
  if(navigator.vibrate)navigator.vibrate(80);
  setTimeout(function(){pinEntry='';d.classList.remove('err');updateDots();},430);
}
async function pinSubmit(){
  var hash=await sha256hex(pinEntry);
  setSyncState('syncing');
  try{
    var {data,error}=await sb.from('profiles').select('id,name,role').eq('pin_hash',hash).maybeSingle();
    if(error)throw error;
    if(data){
      currentUser={id:data.id,name:data.name,role:data.role};
      unlock();
      go(null,true);
      showWelcome();
      setSyncState('');
    } else {
      setSyncState('');
      pinError();
    }
  }catch(e){
    setSyncState('error');
    pinError();
  }
}
function unlock(){var p=document.getElementById('pin');p.classList.add('hide');setTimeout(function(){p.style.display='none';p.classList.remove('hide');},640);}

function go(tab,instant){
  if(tab===activeTab&&current&&!instant)return;
  var forward=(tab!==null);
  var stage=document.getElementById('stage');
  var oldEl=current?current.el:null;
  var newEl=buildScreen(tab);
  stage.appendChild(newEl);
  renderHeader(tab);manageFab(tab);
  if(tab===null)layoutHome(newEl);
  if(instant||!oldEl){
    newEl.classList.add('show');
    if(oldEl&&oldEl.parentNode)oldEl.parentNode.removeChild(oldEl);
  } else {
    newEl.classList.add(forward?'enter-right':'enter-left');
    void newEl.offsetWidth;
    newEl.classList.remove('enter-right','enter-left');newEl.classList.add('show');
    oldEl.classList.remove('show');oldEl.classList.add(forward?'exit-left':'exit-right');
    var dead=oldEl;
    var done=function(){if(dead&&dead.parentNode)dead.parentNode.removeChild(dead);};
    dead.addEventListener('transitionend',done,{once:true});setTimeout(done,650);
  }
  activeTab=tab;current={tab:tab,el:newEl};newEl.scrollTop=0;
}

  tiles.forEach(function(t){t.style.gridColumn='';});
  var n=tiles.length;if(!n)return;var rem=n%cols;
  if(rem!==0)tiles[n-1].style.gridColumn='span '+(cols-rem+1);
}

  else{var html=await renderTab(current.tab);if(current.el&&current.el.parentNode)current.el.innerHTML=html;}
  current.el.scrollTop=sc;
  manageFab(current.tab);
}

// edge swipe back
(function(){
  var startX=0,startY=0,decided=false,dragging=false,secEl=null,homeEl=null,W=0;
  function start(e){if(activeTab===null||!current)return;var t=e.touches?e.touches[0]:e;if(t.clientX>32)return;startX=t.clientX;startY=t.clientY;W=window.innerWidth||360;decided=false;dragging=false;secEl=current.el;homeEl=null;}

    '<div style="display:flex;justify-content:space-between;font-size:11.5px;color:var(--sub);margin-top:5px"><span>'+segPct+'% of this fortnight</span>'+diffHtml+'</div></div>'+

  var a=await getCountdowns();
  var now=new Date();
  var cards=a.map(function(c,i){var t=new Date(c.d+'T00:00:00');var days=Math.ceil((t-now)/86400000);var done=(t-now)<=0;return '<div class="card cd-card"><div style="display:flex;justify-content:space-between;align-items:flex-start"><div><div class="rs">'+(done?'Arrived':'Counting down')+'</div><div class="serif" style="font-size:21px;font-weight:600;margin-top:2px">'+esc(c.n)+'</div></div>'+(c.id?'<button class="del" onclick="delCD(\''+c.id+'\')">'+icon('x',15)+'</button>':'')+'</div><div class="cd-big">'+(done?'🎉':Math.max(0,days))+(done?'':'<small style="font-family:\'DM Sans\',sans-serif;font-size:14px;font-weight:600;color:var(--sub);margin-left:8px">days</small>')+'</div><div class="rs">'+t.toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long',year:'numeric'})+'</div></div>';}).join('');
  return '<div class="stack">'+cards+'<button class="reqbtn" onclick="addCD()">'+icon('plus',16)+' Add a countdown</button></div>';
}
function addCD(){openForm('New countdown','',[{key:'n',label:'Name (e.g. Holiday)'},{key:'d',label:'Date YYYY-MM-DD'}],async function(v){if(!v.n||!/^\d{4}-\d{2}-\d{2}$/.test(v.d)){toast('Enter a name and date like 2026-11-29');return;}await addCountdownDB(v.n,v.d);closeOverlay();await refreshScreen();});}
async function delCD(id){await deleteCountdownDB(id);await refreshScreen();}

  var days=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

}
function setMeal(day,slot,label){

}

// ============================================================
// CAR
// ============================================================
async function renderCar(){
  var c=await getCar();
  function daysUntil(s){if(!s||!/^\d{4}-\d{2}-\d{2}$/.test(s))return null;return Math.ceil((new Date(s+'T00:00:00')-new Date())/86400000);}
  function rf(field,label,icn){var v=c[field]||'';var du=daysUntil(v);var sub=v?(du!==null?(du<0?'Overdue by '+(-du)+' days':du+' days away'):v):'Not set';var badge=(v&&du!==null)?'<div class="badge"'+(du<0?' style="background:rgba(181,104,124,.15);color:#B5687C"':'')+'>'+(du<0?'due':du+'d')+'</div>':'';return '<div class="row" onclick="editCarField(\''+field+'\',\''+label+'\')"><div class="chip sm" style="background:#5B7894">'+icon(icn,16,2.2)+'</div><div style="flex:1"><div class="rt">'+label+'</div><div class="rs">'+esc(sub)+'</div></div>'+badge+'</div>';}
  return '<div class="stack"><div class="card"><div class="ctitle">Renewals &amp; service</div>'+rf('insurance','Insurance renewal','health')+rf('rego','Rego renewal','calendar')+rf('service','Next service','work')+rf('lastservice','Last service','clock')+'</div><div class="card"><div class="ctitle">Details</div>'+rf('make','Make &amp; model','car')+rf('plate','Plate','file')+rf('odo','Odometer','trend')+'</div></div>';
}
function editCarField(field,label){
  openForm(label,'',[{key:'v',label:label}],async function(v){
    await setCarFieldDB(field,v.v);closeOverlay();await refreshScreen();
  });
}

// ============================================================
// FORGE AI
// ============================================================
var aiMsgs=[];
async function aiAnswer(q){
  q=(q||'').toLowerCase();
  var u=currentUser?currentUser.name.split(' ')[0]:'there';
  if(/balance|money|how much|savings/.test(q)){var b=await getFinBalance();return b?'Your logged balance is A$'+Number(b).toLocaleString()+'. Open Finances for the full picture.':'You haven\'t logged a balance yet — open Finances and tap Log.';}
  if(/task|to.?do|work/.test(q)){var t=await loadItems('work');return t.length?'You\'ve got '+t.length+' task'+(t.length!==1?'s':'')+' on the go. Top one: '+t[0].t+'.':'No tasks right now — nice.';}
  if(/remind/.test(q)){var r=await loadItems('reminders');return r.length?'Next reminder: '+r[0].t+' ('+(r[0].s||'')+').':' No reminders — all clear.';}
  if(/streak|habit|goal/.test(q)){var g=await loadItems('goals');return g.length?'You\'re tracking '+g.length+' habit'+(g.length!==1?'s':'')+'. Top: '+g[0].t+'.':'No habits yet — add some in Goals.';}
  if(/countdown|england|days until|holiday/.test(q)){var a=await getCountdowns();var c=a[0];var d=Math.ceil((new Date(c.d+'T00:00:00')-new Date())/86400000);return Math.max(0,d)+' days until '+c.n+'.';}
  if(/meal|dinner|lunch|food|eat/.test(q)){var days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];var dd=days[new Date().getDay()];var m=await getMeals();var dn=(m[dd]&&m[dd].d);return dn?'Tonight ('+dd+') you\'ve planned: '+dn+'.':'No dinner planned today — open Meal Planner to set one.';}
  if(/car|rego|insurance|service/.test(q)){var cv=await getCar();var bits=[];if(cv.insurance)bits.push('insurance: '+cv.insurance);if(cv.rego)bits.push('rego: '+cv.rego);return bits.length?'Car — '+bits.join(' · '):' No car details saved yet.';}
  if(/hello|^hey|^hi\b|morning|how are/.test(q))return 'Hey '+u+'! Ask me about your tasks, reminders, balance, habits, countdown, meals, or car.';
  if(/help|what can|who are/.test(q))return 'I\'m Forge AI. I can answer from your own data — try "what\'s my balance", "how many tasks", "days until England", "what\'s for dinner", or "when\'s my rego due".';
  return 'I can\'t answer that yet — but ask me about your tasks, reminders, finances, habits, countdown, meals, or car.';
}
function aiThreadHTML(){if(!aiMsgs.length)return '<div class="ai-empty">'+icon('spark',30,1.8)+'<div class="rt" style="margin-top:10px">Ask me anything about your Forge</div><div class="rs" style="margin-top:4px">"What\'s my balance?" · "Days until England?" · "Any tasks?"</div></div>';return aiMsgs.map(function(m){return '<div class="ai-msg '+m.r+'">'+esc(m.t)+'</div>';}).join('');}
function renderAI(){return Promise.resolve('<div class="ai-wrap"><div class="ai-thread" id="aiThread">'+aiThreadHTML()+'</div><div class="ai-bar"><input id="aiInput" placeholder="Ask Forge AI…" autocomplete="off" onkeydown="if(event.key===\'Enter\')aiSend()"/><button onclick="aiSend()">'+icon('send',18,2.2)+'</button></div></div>');}
async function aiSend(){var i=document.getElementById('aiInput');var v=i?i.value.trim():'';if(!v)return;aiMsgs.push({r:'me',t:v});var ans=await aiAnswer(v);aiMsgs.push({r:'ai',t:ans});if(current&&current.tab==='ai'){var th=current.el.querySelector('#aiThread');if(th){th.innerHTML=aiThreadHTML();th.scrollTop=th.scrollHeight;}}if(i){i.value='';i.focus();}}

// ============================================================
// OWNER DASHBOARD
// ============================================================
async function renderOwner(){
  if(!isOwner())return '<div class="stack"><div class="card"><div class="rs">Owner only.</div></div></div>';
  var profiles=await loadAllProfiles();
  var reqs=await getRequestsDB();
  var pHtml=profiles.map(function(u){return '<div class="row">'+avatarHTML(u.name,34)+'<div style="flex:1"><div class="rt">'+esc(u.name)+(u.role==='master'?' <span class="badge">You</span>':'')+'</div><div class="rs">'+(u.role==='master'?'Owner':'Member')+'</div></div>'+
    (u.role!=='master'?'<button class="tbtn rm" onclick="removeUser(\''+u.id+'\')">Remove</button>':'')+'</div>';}).join('');
  var rHtml=reqs.length?reqs.map(function(r){return '<div class="row"><span class="dot" style="background:#B4925A"></span><div style="flex:1"><div class="rt">'+esc(r.body)+'</div><div class="rs">'+esc(r.user_name||'Someone')+' · '+timeAgo(new Date(r.created_at).getTime())+'</div></div></div>';}).join(''):'<div class="row"><div class="rs">No requests yet.</div></div>';
  return '<div class="stack">'+
    '<div class="card dark"><div class="small">Owner Dashboard</div><div class="serif" style="font-size:24px;font-weight:600;margin-top:2px">'+profiles.length+' member'+(profiles.length!==1?'s':'')+'</div></div>'+
    '<div class="card"><div class="ctitle">Members</div>'+pHtml+'<button class="reqbtn" onclick="openAddUser()" style="margin-top:12px">'+icon('plus',16)+' Add a user</button></div>'+
    '<div class="card"><div class="ctitle">Feature requests</div>'+rHtml+'</div>'+
    '<div class="card"><div class="ctitle">Invite someone</div><div class="rs" style="margin-bottom:10px">Share Forge with a friend.</div><button class="btn btn-primary" onclick="copyInvite()" style="width:100%">'+icon('share',16)+' Copy invite link</button></div></div>';
}
function copyInvite(){var url=location.origin+location.pathname;if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(url).then(function(){toast('Link copied ✓');});}else{prompt('Copy this:',url);}}
