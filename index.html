<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#F6F2E9" />
<title>Forge — Build your life</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  /* ---- THEME (these are easy to change later for custom colours) ---- */
  :root{
    --ink:#26231E; --sub:#8A8377; --cream:#F6F2E9; --paper:#FBF8F1;
    --accent:#23493A; --accent-2:#173026; --gold:#B4925A; --line:rgba(38,35,30,.07);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:'DM Sans',system-ui,sans-serif; color:var(--ink);
    background:#E9E4D8; display:flex; justify-content:center;
    -webkit-font-smoothing:antialiased;
  }
  .serif{font-family:'Fraunces',Georgia,serif;}
  /* app shell: fills phone screens, centred & framed on desktop */
  #app{
    width:100%; max-width:480px; min-height:100vh; background:var(--cream);
    display:flex; flex-direction:column; position:relative; overflow:hidden;
  }
  @media(min-width:520px){ #app{ box-shadow:0 0 60px rgba(38,35,30,.12);} }

  /* ---- HEADER ---- */
  header{ padding:18px 20px 14px; display:flex; align-items:center; gap:12px; border-bottom:1px solid rgba(180,146,90,.22); }
  .logo{ width:42px; height:42px; border-radius:13px; background:var(--paper);
    display:flex; align-items:center; justify-content:center; color:var(--accent);
    font-family:'Fraunces',serif; font-weight:700; font-size:25px; line-height:1;
    border:1.5px solid var(--gold); box-shadow:0 4px 12px rgba(38,35,30,.1); flex-shrink:0; }
  .htext{ flex:1; }
  .htext h1{ font-family:'Fraunces',serif; font-size:23px; font-weight:600; line-height:1; }
  .htext span{ font-size:11px; color:var(--sub); letter-spacing:.1em; text-transform:uppercase; display:block; margin-top:4px; }
  .pill{ display:flex; align-items:center; gap:8px; padding:7px 12px; border-radius:30px;
    background:var(--paper); border:1px solid var(--line); cursor:pointer; transition:background .2s; }
  .pill:hover{ background:rgba(38,35,30,.05); }
  .pill .av{ width:26px; height:26px; border-radius:50%; background:linear-gradient(135deg,#23493A,#B4925A);
    color:#fff; font-size:12px; font-weight:700; display:flex; align-items:center; justify-content:center; }
  .pill .nm{ font-size:13.5px; font-weight:600; }
  .back{ width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    cursor:pointer; margin-left:-6px; transition:background .18s,transform .18s; }
  .back:hover{ background:rgba(38,35,30,.06);} .back:active{ transform:scale(.9);}

  /* ---- BODY / STAGE ---- */
  #stage{ flex:1; overflow-y:auto; padding:4px 18px 30px; }
  #stage::-webkit-scrollbar{ width:0; }

  /* ---- TILES ---- */
  .feature{ border-radius:26px; padding:20px; margin-bottom:14px; cursor:pointer;
    background:linear-gradient(135deg,#23493A,#173026); color:var(--cream);
    box-shadow:0 8px 22px rgba(23,48,38,.3); transition:transform .28s cubic-bezier(.2,.8,.2,1), box-shadow .28s; }
  .feature:hover{ transform:translateY(-4px); box-shadow:0 14px 30px rgba(23,48,38,.38); }
  .feature .lbl{ display:flex; align-items:center; gap:8px; font-size:12px; opacity:.9; letter-spacing:.06em; text-transform:uppercase; }
  .feature h2{ font-family:'Fraunces',serif; font-size:22px; font-weight:600; margin-top:8px; }
  .feature p{ font-size:13.5px; opacity:.88; margin-top:4px; }

  .grid{ display:grid; grid-template-columns:1fr 1fr; gap:13px; }
  .tile{ border-radius:24px; padding:18px; min-height:132px; cursor:pointer;
    display:flex; flex-direction:column; justify-content:space-between;
    box-shadow:0 2px 6px rgba(38,35,30,.05); transition:transform .28s cubic-bezier(.2,.8,.2,1), box-shadow .28s; }
  .tile:hover{ transform:translateY(-4px); box-shadow:0 14px 30px rgba(38,35,30,.1); }
  .tile:active{ transform:translateY(-1px) scale(.99); }
  .tile .chip{ width:42px; height:42px; border-radius:14px; display:flex; align-items:center; justify-content:center;
    color:#fff; box-shadow:0 3px 8px rgba(38,35,30,.12); }
  .tile .t{ font-weight:700; font-size:16.5px; }
  .tile .s{ font-size:12px; color:rgba(38,35,30,.55); margin-top:2px; }

  /* request-feature footer button */
  .reqbtn{ margin-top:18px; width:100%; padding:15px; border:1.5px dashed rgba(38,35,30,.2);
    border-radius:20px; background:transparent; color:var(--sub); font-family:'DM Sans',sans-serif;
    font-size:14px; font-weight:600; cursor:pointer; display:flex; align-items:center; justify-content:center;
    gap:8px; transition:border-color .2s,color .2s; }
  .reqbtn:hover{ border-color:var(--accent); color:var(--accent); }

  /* ---- CARDS & ROWS (section content) ---- */
  .card{ background:var(--paper); border-radius:22px; padding:18px; border:1px solid var(--line);
    box-shadow:0 1px 3px rgba(38,35,30,.04); }
  .stack{ display:grid; gap:14px; }
  .ctitle{ font-size:12px; font-weight:600; color:var(--sub); letter-spacing:.06em; text-transform:uppercase; margin:2px 2px 12px; }
  .row{ display:flex; align-items:center; gap:12px; padding:12px 8px; border-radius:12px; transition:background .18s; }
  .row:hover{ background:rgba(38,35,30,.035); }
  .dot{ width:9px; height:9px; border-radius:50%; flex-shrink:0; }
  .row .rt{ font-weight:600; font-size:15px; } .row .rs{ font-size:12.5px; color:var(--sub); margin-top:1px; }
  .dark{ background:var(--ink); color:var(--cream); }
  .dark .small{ font-size:13px; opacity:.7; } .dark h2{ font-family:'Fraunces',serif; font-size:30px; font-weight:600; margin-top:2px; }
  .two{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .stat .k{ display:flex; align-items:center; gap:7px; color:var(--sub); font-size:12px; margin-bottom:8px; }
  .stat .v{ font-weight:700; font-size:22px; } .stat .d{ font-size:12px; color:var(--sub); margin-top:2px; }
  .checkbox{ width:20px; height:20px; border-radius:6px; border:2px solid rgba(38,35,30,.2); flex-shrink:0; }
  .circlebox{ width:20px; height:20px; border-radius:50%; border:2px solid rgba(38,35,30,.2); flex-shrink:0; }

  /* calendar */
  .cal{ display:grid; grid-template-columns:repeat(7,1fr); gap:6px; text-align:center; }
  .cal .h{ font-size:11px; color:var(--sub); font-weight:600; padding-bottom:4px; }
  .cal .cell{ aspect-ratio:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    border-radius:12px; font-size:13px; font-weight:500; }
  .cal .today{ background:var(--accent); color:#fff; font-weight:700; }
  .evdot{ width:4px; height:4px; border-radius:50%; background:var(--accent); margin-top:2px; }

  /* budget bars */
  .bar{ height:8px; border-radius:8px; background:rgba(38,35,30,.07); overflow:hidden; }
  .bar>div{ height:100%; border-radius:8px; }

  /* FAB */
  .fab{ position:absolute; bottom:24px; right:22px; width:56px; height:56px; border-radius:50%;
    background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center;
    box-shadow:0 8px 20px rgba(35,73,58,.4); cursor:pointer; border:none;
    transition:transform .2s cubic-bezier(.2,.8,.2,1), box-shadow .2s; }
  .fab:hover{ transform:translateY(-2px) rotate(90deg); box-shadow:0 10px 26px rgba(35,73,58,.5); }

  /* modal */
  .overlay{ position:absolute; inset:0; background:rgba(38,35,30,.4); display:flex; align-items:flex-end;
    justify-content:center; z-index:50; animation:fade .25s ease; }
  .sheet{ width:100%; background:var(--cream); border-radius:26px 26px 0 0; padding:24px 22px 30px;
    animation:up .32s cubic-bezier(.2,.85,.25,1); }
  .sheet h3{ font-family:'Fraunces',serif; font-size:20px; font-weight:600; }
  .sheet p{ font-size:13.5px; color:var(--sub); margin-top:4px; margin-bottom:14px; }
  .sheet textarea{ width:100%; min-height:96px; border:1px solid var(--line); border-radius:14px; padding:12px;
    font-family:'DM Sans',sans-serif; font-size:14.5px; resize:none; background:var(--paper); color:var(--ink); }
  .sheet textarea:focus{ outline:none; border-color:var(--accent); }
  .btnrow{ display:flex; gap:10px; margin-top:14px; }
  .btn{ flex:1; padding:14px; border-radius:14px; border:none; font-family:'DM Sans',sans-serif;
    font-size:15px; font-weight:600; cursor:pointer; }
  .btn-primary{ background:var(--accent); color:#fff; } .btn-ghost{ background:rgba(38,35,30,.07); color:var(--ink); }
  .done{ text-align:center; padding:10px 0 4px; }
  .done .tick{ width:54px; height:54px; border-radius:50%; background:var(--accent); color:#fff;
    display:flex; align-items:center; justify-content:center; margin:0 auto 12px; }

  /* animations */
  @keyframes fade{ from{opacity:0;transform:scale(.99);} to{opacity:1;transform:none;} }
  @keyframes up{ from{transform:translateY(100%);} to{transform:none;} }
  @keyframes slidein{ from{opacity:0;transform:translateX(26px);} to{opacity:1;transform:none;} }
  @keyframes stag{ from{opacity:0;transform:translateY(10px);} to{opacity:1;transform:none;} }
  .anim-home{ animation:fade .4s ease both; }
  .anim-section{ animation:slidein .42s cubic-bezier(.2,.85,.25,1) both; }
  .anim-section .card,.anim-section .feature,.anim-section .two{ animation:stag .5s cubic-bezier(.2,.8,.2,1) both; }
  svg{ display:block; }

  /* ===== LOCK LAYERS (intro + PIN) ===== */
  .lock{ position:absolute; inset:0; z-index:100; display:flex; flex-direction:column;
    align-items:center; justify-content:center; color:var(--cream);
    background:radial-gradient(125% 95% at 50% 18%, #2C5A46 0%, #1B3A2C 55%, #112317 100%); overflow:hidden; }
  .lock::after{ content:''; position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(125% 125% at 50% 45%, transparent 52%, rgba(0,0,0,.4) 100%); }
  .lock.hide{ animation:lift .65s cubic-bezier(.6,0,.2,1) forwards; }
  @keyframes lift{ to{ opacity:0; transform:translateY(-26px); visibility:hidden; } }

  /* intro */
  .glow{ position:absolute; width:400px; height:400px; border-radius:50%;
    background:radial-gradient(circle, rgba(180,146,90,.22), transparent 65%); filter:blur(6px);
    animation:pulse 4.5s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{ transform:scale(1); opacity:.65;} 50%{ transform:scale(1.14); opacity:1;} }
  .intro-mark{ width:96px; height:96px; border-radius:26px; border:2px solid var(--gold);
    background:rgba(246,242,233,.04); display:flex; align-items:center; justify-content:center;
    font-family:'Fraunces',serif; font-weight:600; font-size:58px; color:var(--cream); line-height:1;
    box-shadow:0 24px 60px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.08);
    opacity:0; animation:markIn 1.1s cubic-bezier(.2,.8,.2,1) .15s forwards; position:relative; z-index:2; }
  @keyframes markIn{ from{ opacity:0; transform:scale(.7) translateY(10px); } to{ opacity:1; transform:none; } }
  .intro-word{ margin-top:28px; font-family:'Fraunces',serif; font-size:30px; font-weight:500;
    letter-spacing:.4em; padding-left:.4em; color:var(--cream); position:relative; z-index:2; text-align:center; }
  .intro-word span{ display:inline-block; opacity:0; animation:letterIn .6s cubic-bezier(.2,.8,.2,1) forwards; }
  @keyframes letterIn{ from{ opacity:0; transform:translateY(12px); } to{ opacity:1; transform:none; } }
  .intro-rule{ width:0; height:1px; background:var(--gold); margin:22px 0 16px; opacity:.85;
    animation:rule 1s ease 1.15s forwards; position:relative; z-index:2; }
  @keyframes rule{ to{ width:120px; } }
  .intro-tag{ font-size:11px; letter-spacing:.42em; padding-left:.42em; color:var(--gold);
    text-transform:uppercase; opacity:0; animation:fadein .9s ease 1.55s forwards; position:relative; z-index:2; }
  @keyframes fadein{ to{ opacity:1; } }

  /* pin */
  .pin-wrap{ width:100%; max-width:300px; display:flex; flex-direction:column; align-items:center;
    position:relative; z-index:2; padding:0 22px; }
  .pin-logo{ width:54px; height:54px; border-radius:16px; border:1.5px solid var(--gold);
    display:flex; align-items:center; justify-content:center; font-family:'Fraunces',serif;
    font-weight:600; font-size:30px; color:var(--cream); margin-bottom:22px; line-height:1; }
  .pin-title{ font-family:'Fraunces',serif; font-size:22px; font-weight:500; margin-bottom:6px; }
  .pin-sub{ font-size:13px; color:rgba(246,242,233,.6); margin-bottom:26px; text-align:center; }
  .dots{ display:flex; gap:16px; margin-bottom:36px; }
  .dot-pin{ width:14px; height:14px; border-radius:50%; border:1.5px solid rgba(246,242,233,.5); transition:all .2s; }
  .dot-pin.on{ background:var(--gold); border-color:var(--gold); transform:scale(1.12); }
  .dots.err{ animation:shake .42s; }
  @keyframes shake{ 0%,100%{transform:translateX(0);} 20%,60%{transform:translateX(-9px);} 40%,80%{transform:translateX(9px);} }
  .keypad{ display:grid; grid-template-columns:repeat(3,1fr); gap:16px; width:100%; }
  .key{ height:68px; border-radius:50%; background:rgba(246,242,233,.06); border:1px solid rgba(246,242,233,.12);
    color:var(--cream); font-family:'DM Sans',sans-serif; font-size:26px; font-weight:500; cursor:pointer;
    display:flex; align-items:center; justify-content:center; transition:transform .12s, background .15s;
    -webkit-user-select:none; user-select:none; }
  .key:active{ transform:scale(.92); background:rgba(246,242,233,.18); }
  .key.blank{ background:transparent; border:none; cursor:default; }
  .key.fn{ font-size:14px; letter-spacing:.03em; color:rgba(246,242,233,.7); background:transparent; border:none; }
  .pin-reset{ margin-top:26px; font-size:12px; color:rgba(246,242,233,.45); letter-spacing:.03em;
    background:none; border:none; cursor:pointer; }

  /* accounts */
  .sheet input{ width:100%; border:1px solid var(--line); border-radius:14px; padding:13px 14px;
    font-family:'DM Sans',sans-serif; font-size:15px; background:var(--paper); color:var(--ink); margin-bottom:10px; }
  .sheet input:focus{ outline:none; border-color:var(--accent); }
  .badge{ font-size:11px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; padding:3px 9px;
    border-radius:20px; background:rgba(35,73,58,.1); color:var(--accent); }
  .uav{ width:38px; height:38px; border-radius:50%; background:linear-gradient(135deg,#23493A,#B4925A);
    color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:15px; flex-shrink:0; }
</style>
</head>
<body>
<div id="app">
  <header id="hdr"></header>
  <div id="stage"></div>

  <div id="intro" class="lock">
    <div class="glow"></div>
    <div class="intro-mark">F</div>
    <div class="intro-word" id="introWord"></div>
    <div class="intro-rule"></div>
    <div class="intro-tag">Build your life</div>
  </div>

  <div id="pin" class="lock" style="display:none">
    <div class="pin-wrap">
      <div class="pin-logo">F</div>
      <div class="pin-title" id="pinTitle">Enter your PIN</div>
      <div class="pin-sub" id="pinSub">Welcome back</div>
      <div class="dots" id="pinDots"></div>
      <div class="keypad" id="keypad"></div>
      <button class="pin-reset" id="pinReset">Reset PIN</button>
    </div>
  </div>
</div>

<script>
/* =========================================================================
   FORGE — single-file app shell (Phase 1)
   Next phases will add: login + cloud sync (Firebase), colour themes,
   and the smart features. For now data lives in memory for the session.
   ========================================================================= */

/* ---- tiny icon helper (self-contained SVGs, no external libraries) ---- */
const P = { /* inner markup for 24x24 stroke icons */
  work:'<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="3" y1="12" x2="21" y2="12"/>',
  calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="8" y1="3" x2="8" y2="6"/><line x1="16" y1="3" x2="16" y2="6"/>',
  fitness:'<rect x="2" y="9" width="3" height="6" rx="1"/><rect x="19" y="9" width="3" height="6" rx="1"/><rect x="5.5" y="10.5" width="2.5" height="3"/><rect x="16" y="10.5" width="2.5" height="3"/><line x1="8" y1="12" x2="16" y2="12"/>',
  health:'<rect x="3" y="3" width="18" height="18" rx="5"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/>',
  finances:'<rect x="3" y="6" width="18" height="13" rx="2.5"/><path d="M3 10h18"/><circle cx="16.5" cy="14.5" r="1.4"/>',
  reminders:'<path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.5 21a1.5 1.5 0 0 1-3 0"/>',
  goals:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.4"/>',
  notes:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
  contacts:'<circle cx="9" cy="8" r="3.2"/><path d="M3.6 20a5.4 5.4 0 0 1 10.8 0"/><path d="M16 5.3a3.2 3.2 0 0 1 0 6"/><path d="M17.6 14.2a5.4 5.4 0 0 1 2.9 5.8"/>',
  documents:'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/>',
  travel:'<path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4z"/>',
  back:'<polyline points="15 18 9 12 15 6"/>',
  plus:'<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',
  sun:'<circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22"/><line x1="4.2" y1="4.2" x2="5.6" y2="5.6"/><line x1="18.4" y1="18.4" x2="19.8" y2="19.8"/><line x1="2" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22" y2="12"/><line x1="4.2" y1="19.8" x2="5.6" y2="18.4"/><line x1="18.4" y1="5.6" x2="19.8" y2="4.2"/>',
  wallet:'<rect x="3" y="6" width="18" height="13" rx="2.5"/><path d="M3 10h18"/>',
  flame:'<path d="M12 3s5 4 5 9a5 5 0 0 1-10 0c0-2 1-3 1-3s0 2 2 2c0-3 2-5 2-8z"/>',
  cake:'<path d="M4 21h16v-7a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2z"/><path d="M4 16c2 0 2 1.5 4 1.5S10 16 12 16s2 1.5 4 1.5S18 16 20 16"/><line x1="12" y1="6" x2="12" y2="10"/>',
  drop:'<path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/>',
  moon:'<path d="M20 14.5A8 8 0 1 1 9.5 4 6.5 6.5 0 0 0 20 14.5z"/>',
  trend:'<polyline points="3 17 9 11 13 15 21 7"/><polyline points="15 7 21 7 21 13"/>',
  clock:'<circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15.5 14"/>',
  pin:'<path d="M12 21s7-6 7-11a7 7 0 0 0-14 0c0 5 7 11 7 11z"/><circle cx="12" cy="10" r="2.4"/>',
  check:'<polyline points="20 6 9 17 4 12"/>',
  file:'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/>',
};
function icon(name, size=22, sw=2){
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="'+sw+'" stroke-linecap="round" stroke-linejoin="round">'+(P[name]||'')+'</svg>';
}

/* ---- tabs (the tiles on the home screen) ---- */
const TABS = [
  {id:'work',     label:'Work',     sub:'Tasks & projects',     bg:'#E4E9EE', chip:'#5B7894'},
  {id:'calendar', label:'Calendar', sub:'Your schedule',        bg:'#F3E2DA', chip:'#C2724F'},
  {id:'fitness',  label:'Fitness',  sub:'Move & train',         bg:'#E1EADF', chip:'#5E8C61'},
  {id:'health',   label:'Health',   sub:'Meds & checkups',      bg:'#F3E0E4', chip:'#B5687C'},
  {id:'finances', label:'Finances', sub:'Money & budgets',      bg:'#F4E9D6', chip:'#C29A4A'},
  {id:'reminders',label:'Reminders',sub:"Don't forget",         bg:'#E6E3F1', chip:'#7A72A8'},
  {id:'goals',    label:'Goals',    sub:'Habits & streaks',     bg:'#DCEAEA', chip:'#3F8587'},
  {id:'notes',    label:'Notes',    sub:'Capture ideas',        bg:'#F5EFD7', chip:'#B9A23F'},
  {id:'contacts', label:'People',   sub:'Birthdays & contacts', bg:'#EDE3F0', chip:'#9466A5'},
  {id:'documents',label:'Documents',sub:'Files & records',      bg:'#E8E5DE', chip:'#8A8276'},
  {id:'travel',   label:'Travel',   sub:'Trips & plans',        bg:'#DEE9F2', chip:'#5683A8'},
];

/* ---- session data (in memory for now; becomes cloud data later) ---- */
const DEFAULTS = {
  work:[ {t:'Finish Q2 report',s:'Due tomorrow'},{t:'Review pull requests',s:'3 pending'},{t:'Email supplier',s:'Today'},{t:'Plan team offsite',s:'Next week'} ],
  reminders:[ {t:'Pay electricity bill',s:'Due today'},{t:'Renew car rego',s:'3 Jun'},{t:'Call dentist',s:'This week'} ],
  goals:[ {t:'Workout',s:'🔥 12 day streak'},{t:'Read 20 mins',s:'🔥 8 day streak'},{t:'No takeaway',s:'🔥 5 day streak'},{t:'Meditate',s:'Start today'} ],
  notes:[ {t:'App ideas',s:'Edited 2h ago'},{t:'Groceries',s:'Edited yesterday'},{t:'Books to read',s:'Edited 3 days ago'} ],
  documents:[ {t:'Passport.pdf',s:'Added 12 May'},{t:'Lease agreement.pdf',s:'Added 2 Apr'},{t:'Insurance.pdf',s:'Added 18 Mar'},{t:'Payslip — May.pdf',s:'Added 25 May'} ],
};

/* ---- accounts & per-user data (all stored on this device) ---- */
let currentUser=null;
let store=JSON.parse(JSON.stringify(DEFAULTS));
function loadStoreFor(id){ store=JSON.parse(JSON.stringify(DEFAULTS)); const raw=lsGet('forge.store.'+id); if(raw){ try{ const s=JSON.parse(raw); Object.keys(s).forEach(k=>{ if(Array.isArray(s[k])) store[k]=s[k]; }); }catch(e){} } }
function saveStore(){ if(currentUser) lsSet('forge.store.'+currentUser.id, JSON.stringify(store)); }

/* ---- helpers to build common bits ---- */
function listCard(title, accent, items, right){
  return '<div class="card"><div class="ctitle">'+title+'</div>'+
    items.map(it=>'<div class="row"><span class="dot" style="background:'+accent+'"></span>'+
      '<div style="flex:1"><div class="rt">'+it.t+'</div>'+(it.s?'<div class="rs">'+it.s+'</div>':'')+'</div>'+
      (right||'')+'</div>').join('')+'</div>';
}
function ring(pct,color,value,label){
  const r=27,c=2*Math.PI*r;
  return '<div style="display:flex;flex-direction:column;align-items:center;gap:6px">'+
    '<svg width="64" height="64" style="transform:rotate(-90deg)">'+
    '<circle cx="32" cy="32" r="'+r+'" fill="none" stroke="rgba(38,35,30,.08)" stroke-width="8"/>'+
    '<circle cx="32" cy="32" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="8" stroke-linecap="round" stroke-dasharray="'+c+'" stroke-dashoffset="'+(c-c*pct/100)+'"/></svg>'+
    '<div style="text-align:center;margin-top:-2px"><div style="font-weight:700;font-size:15px">'+value+'</div><div style="font-size:11px;color:var(--sub)">'+label+'</div></div></div>';
}

/* ---- section content renderers ---- */
const VIEWS = {
  today(){
    const h=new Date().getHours();
    const greet=h<12?'Good morning':h<18?'Good afternoon':'Good evening';
    const dateStr=new Date().toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'});
    const tasks=store.work.length, rem=store.reminders.length, habits=store.goals.length;
    const attention=[]
      .concat(store.reminders.slice(0,2).map(x=>({t:x.t,s:'Reminder · '+(x.s||''),c:'#7A72A8'})))
      .concat(store.work.slice(0,2).map(x=>({t:x.t,s:'Task · '+(x.s||''),c:'#5B7894'})))
      .slice(0,4);
    return '<div class="stack">'+
      '<div class="card dark"><div class="small">'+dateStr+'</div>'+
        '<div class="serif" style="font-size:26px;font-weight:600;margin-top:2px">'+greet+(currentUser?', '+currentUser.name.split(' ')[0]:'')+'</div>'+
        '<div style="font-size:14px;opacity:.82;margin-top:6px">'+tasks+' task'+(tasks!==1?'s':'')+' · '+rem+' reminder'+(rem!==1?'s':'')+' · '+habits+' habits on track</div></div>'+
      '<div class="two">'+
        '<div class="card stat"><div class="k">'+icon('wallet',14)+' Balance</div><div class="v">$4,820</div><div class="d" style="color:#5E8C61">+$210 this week</div></div>'+
        '<div class="card stat"><div class="k">'+icon('flame',14)+' Streaks</div><div class="v">12 days</div><div class="d">Workout · Reading</div></div>'+
      '</div>'+
      '<div class="card"><div class="ctitle">Needs your attention</div>'+
        (attention.length?attention.map(a=>'<div class="row"><span class="dot" style="background:'+a.c+'"></span><div style="flex:1"><div class="rt">'+a.t+'</div><div class="rs">'+a.s+'</div></div></div>').join(''):'<div class="row"><div style="flex:1"><div class="rs">All clear — nothing needs you right now.</div></div></div>')+
      '</div></div>';
  },
  users(){
    const us=loadUsers();
    return '<div class="stack"><div class="card"><div class="ctitle">Who can use Forge</div>'+
      us.map(u=>'<div class="row"><div class="uav">'+u.name.charAt(0).toUpperCase()+'</div>'+
        '<div style="flex:1"><div class="rt">'+u.name+'</div><div class="rs">'+(u.role==='master'?'Master account — that\'s you':'Has their own PIN & space')+'</div></div>'+
        (u.role==='master'
          ? '<button onclick="renameUser(\''+u.id+'\')" style="background:none;border:none;color:var(--sub);font-size:13px;cursor:pointer;margin-right:8px">Rename</button><span class="badge">Master</span>'
          : '<button onclick="renameUser(\''+u.id+'\')" style="background:none;border:none;color:var(--sub);font-size:13px;cursor:pointer;margin-right:6px">Rename</button><button onclick="deleteUser(\''+u.id+'\')" style="background:none;border:none;color:#B5687C;font-size:13px;cursor:pointer">Remove</button>')+
      '</div>').join('')+
      '</div>'+
      '<button class="reqbtn" onclick="openAddUser()">'+icon('plus',16)+' Add a user</button>'+
    '</div>';
  },
  work(){ return '<div class="stack">'+listCard('In progress','#5B7894',store.work,icon('check',16)+'')+'</div>'; },
  reminders(){ return '<div class="stack">'+listCard('Due soon','#7A72A8',store.reminders,'<span class="circlebox"></span>')+'</div>'; },
  goals(){ return '<div class="stack">'+listCard('Habits','#3F8587',store.goals)+'</div>'; },
  notes(){ return '<div class="stack">'+listCard('Recent notes','#B9A23F',store.notes)+'</div>'; },
  documents(){ return '<div class="stack">'+listCard('Files','#8A8276',store.documents,icon('file',16))+'</div>'; },
  fitness(){
    return '<div class="stack"><div class="card" style="display:flex;justify-content:space-around;padding:22px 14px">'+
      ring(78,'#5E8C61','78%','Move')+ring(55,'#C2724F','55%','Exercise')+ring(92,'#5683A8','92%','Stand')+'</div>'+
      listCard('This week','#5E8C61',[{t:'Push day',s:'Mon · 52 min'},{t:'5km run',s:"Wed · 27 min · 4'42\"/km"},{t:'Leg day',s:'Today · 18:00'}])+'</div>';
  },
  health(){
    return '<div class="stack"><div class="two">'+
      '<div class="card stat"><div class="k">'+icon('drop',14)+' Water</div><div class="v">1.6 L</div><div class="d">of 2.5 L</div></div>'+
      '<div class="card stat"><div class="k">'+icon('moon',14)+' Sleep</div><div class="v">7h 12m</div><div class="d">last night</div></div></div>'+
      listCard('Upcoming','#B5687C',[{t:'Dentist check-up',s:'12 Jun · 10:30am'},{t:'GP — annual review',s:'28 Jun · 9:00am'},{t:'Vitamin D',s:'Daily · 1 tablet'}])+'</div>';
  },
  finances(){
    const budgets=[['Groceries',320,500,'#5E8C61'],['Eating out',180,200,'#C2724F'],['Transport',95,150,'#5683A8']];
    return '<div class="stack">'+
      '<div class="card dark"><div class="small">Total balance</div><h2>$4,820.50</h2>'+
        '<div style="font-size:13px;opacity:.82;margin-top:4px;display:flex;align-items:center;gap:6px">'+icon('trend',14)+' +$210 this week</div></div>'+
      '<div class="card"><div class="ctitle">Monthly budgets</div><div style="display:grid;gap:16px;padding:4px">'+
        budgets.map(b=>'<div><div style="display:flex;justify-content:space-between;font-size:14px;margin-bottom:7px"><span style="font-weight:600">'+b[0]+'</span><span style="color:var(--sub)">$'+b[1]+' / $'+b[2]+'</span></div>'+
        '<div class="bar"><div style="width:'+(b[1]/b[2]*100)+'%;background:'+b[3]+'"></div></div></div>').join('')+
      '</div></div></div>';
  },
  calendar(){
    let cells='';
    for(let i=0;i<35;i++){ const n=i-3; const on=n===29; const ev=[12,18,29].includes(n);
      cells+='<div class="cell'+(on?' today':'')+'" style="color:'+(on?'#fff':(n>0&&n<=31?'var(--ink)':'transparent'))+'">'+(n>0&&n<=31?n:'')+(ev&&!on?'<span class="evdot"></span>':'')+'</div>'; }
    return '<div class="stack">'+
      '<div class="card"><div class="serif" style="font-size:18px;font-weight:600;margin-bottom:14px">May 2026</div>'+
        '<div class="cal">'+['M','T','W','T','F','S','S'].map(d=>'<div class="h">'+d+'</div>').join('')+cells+'</div></div>'+
      listCard('Today','#C2724F',[{t:'Team stand-up',s:'9:00 – 9:30am'},{t:'Lunch with Sam',s:'12:30pm · Cafe Luna'},{t:'Leg day',s:'6:00pm · Gym'}],icon('clock',15))+'</div>';
  },
  contacts(){
    const b=[['Mum','2 Jun','in 4 days'],['Jordan','11 Jun','in 13 days'],['Aunty Lou','24 Jun','in 26 days']];
    return '<div class="stack"><div class="card"><div class="ctitle">Upcoming birthdays</div>'+
      b.map(x=>'<div class="row"><div style="width:38px;height:38px;border-radius:50%;background:#EDE3F0;color:#9466A5;display:flex;align-items:center;justify-content:center">'+icon('cake',17)+'</div>'+
      '<div style="flex:1"><div class="rt">'+x[0]+'</div><div class="rs">'+x[1]+'</div></div><div style="font-size:12px;color:var(--sub)">'+x[2]+'</div></div>').join('')+'</div></div>';
  },
  travel(){
    return '<div class="stack">'+
      '<div class="card" style="background:linear-gradient(135deg,#5683A8,#3F6B5B);color:var(--cream);padding:22px">'+
        '<div style="display:flex;align-items:center;gap:6px;font-size:13px;opacity:.85">'+icon('pin',14)+' Next trip</div>'+
        '<div class="serif" style="font-size:24px;font-weight:600;margin-top:4px">Byron Bay</div>'+
        '<div style="font-size:13px;opacity:.85;margin-top:4px">14 – 18 Jul · in 46 days</div></div>'+
      listCard('Packing list','#5683A8',[{t:'Sunscreen & hat'},{t:'Hiking shoes'},{t:'Chargers & adapters'},{t:'Beach towel'}],'<span class="checkbox"></span>')+'</div>';
  },
};

/* sections that support the + button (adding an item this session) */
const ADDABLE = { work:'task', reminders:'reminder', goals:'habit', notes:'note', documents:'document' };

/* ---- render the header for a given view ---- */
function renderHeader(tabId){
  const hdr=document.getElementById('hdr');
  if(!tabId){
    const nm = currentUser ? currentUser.name : 'You';
    const ini = nm.charAt(0).toUpperCase();
    hdr.innerHTML =
      '<div class="logo">F</div>'+
      '<div class="htext"><h1>Forge</h1><span>Build your life</span></div>'+
      '<div class="pill" onclick="lockForge()"><span class="av">'+ini+'</span><span class="nm">'+nm.split(' ')[0]+'</span></div>';
  } else {
    const special={today:{label:'Today',sub:'Your day at a glance'}, users:{label:'Accounts',sub:'Manage who can use Forge'}};
    const tab = special[tabId] || TABS.find(t=>t.id===tabId);
    hdr.innerHTML =
      '<div class="back" onclick="go(null)">'+icon('back',22)+'</div>'+
      '<div class="htext"><h1 class="serif">'+tab.label+'</h1><span>'+tab.sub+'</span></div>';
  }
}

/* ---- main navigation ---- */
let activeTab=null;
function go(tabId){
  activeTab=tabId;
  const stage=document.getElementById('stage');
  renderHeader(tabId);
  // remove any existing FAB
  const oldFab=document.querySelector('.fab'); if(oldFab) oldFab.remove();

  if(!tabId){
    stage.className=''; void stage.offsetWidth;
    const h=new Date().getHours();
    const greet=h<12?'Good morning':h<18?'Good afternoon':'Good evening';
    const fname=currentUser?currentUser.name.split(' ')[0]:'';
    const masterTile=(currentUser && currentUser.role==='master')
      ? '<div class="tile" style="background:#EFE9DC" onclick="go(\'users\')"><div class="chip" style="background:#B4925A">'+icon('contacts',21,2.2)+'</div><div><div class="t">Accounts</div><div class="s">Manage users</div></div></div>'
      : '';
    stage.innerHTML =
      '<div class="anim-home">'+
        '<div class="feature" onclick="go(\'today\')">'+
          '<div class="lbl">'+icon('sun',15)+' Today</div>'+
          '<h2>'+greet+(fname?', '+fname:'')+'</h2><p>Tap to see your day at a glance</p></div>'+
        '<div class="grid">'+
          TABS.map(t=>'<div class="tile" style="background:'+t.bg+'" onclick="go(\''+t.id+'\')">'+
            '<div class="chip" style="background:'+t.chip+'">'+icon(t.id,21,2.2)+'</div>'+
            '<div><div class="t">'+t.label+'</div><div class="s">'+t.sub+'</div></div></div>').join('')+
          masterTile+
        '</div>'+
        '<button class="reqbtn" onclick="openRequest()">'+icon('plus',16)+' Request a feature</button>'+
      '</div>';
    document.getElementById('stage').scrollTop=0;
    return;
  }

  // section view
  stage.innerHTML='<div class="anim-section">'+ (VIEWS[tabId]?VIEWS[tabId]():'') +'</div>';
  stage.scrollTop=0;
  // add a FAB on addable sections
  if(ADDABLE[tabId]){
    const fab=document.createElement('button');
    fab.className='fab'; fab.innerHTML=icon('plus',26,2.6);
    fab.onclick=()=>addItem(tabId);
    document.getElementById('app').appendChild(fab);
  }
}

/* ---- add an item to a list section (session only for now) ---- */
function addItem(tabId){
  const what=ADDABLE[tabId];
  const text=prompt('New '+what+':');
  if(text && text.trim()){
    store[tabId].unshift({t:text.trim(), s:'Just added'});
    saveStore();
    go(tabId);
  }
}

/* ---- "Request a feature" sheet ---- */
function openRequest(){
  const o=document.createElement('div'); o.className='overlay'; o.id='ovl';
  o.innerHTML='<div class="sheet" onclick="event.stopPropagation()">'+
    '<h3>Request a feature</h3>'+
    '<p>Tell me what would make Forge more useful for you — it goes straight to my list.</p>'+
    '<textarea id="reqtext" placeholder="e.g. a meal planner tab, dark mode, reminders that repeat..."></textarea>'+
    '<div class="btnrow"><button class="btn btn-ghost" onclick="closeOverlay()">Cancel</button>'+
    '<button class="btn btn-primary" onclick="sendRequest()">Send</button></div></div>';
  o.onclick=closeOverlay;
  document.getElementById('app').appendChild(o);
  setTimeout(()=>{const t=document.getElementById('reqtext'); if(t)t.focus();},100);
}
function closeOverlay(){ const o=document.getElementById('ovl'); if(o)o.remove(); }
function sendRequest(){
  const t=document.getElementById('reqtext'); const v=t?t.value.trim():'';
  if(!v){ if(t)t.focus(); return; }
  // Phase 2: this will save to your private admin list (Firebase) + email you.
  const o=document.getElementById('ovl');
  o.querySelector('.sheet').innerHTML='<div class="done"><div class="tick">'+icon('check',26,2.6)+'</div>'+
    '<h3>Thanks!</h3><p>Your request has been noted. (Once we add sync, this will land in my inbox automatically.)</p>'+
    '<button class="btn btn-primary" onclick="closeOverlay()" style="margin-top:6px">Done</button></div>';
}

/* ---- safe local storage (works on your live site; degrades quietly in preview) ---- */
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }
function tinyHash(s){ let h=0; for(let i=0;i<s.length;i++){ h=(h*31+s.charCodeAt(i))>>>0; } return ''+h; }
const USERS_KEY='forge.users.v1';
function loadUsers(){ const raw=lsGet(USERS_KEY); if(raw){ try{ const u=JSON.parse(raw); if(u && u.length) return u; }catch(e){} } const seed=[{id:'master',name:'Harvey',pin:tinyHash('7202'),role:'master'}]; lsSet(USERS_KEY, JSON.stringify(seed)); return seed; }
function saveUsers(list){ lsSet(USERS_KEY, JSON.stringify(list)); }

/* ---- boot: cinematic intro -> PIN -> app ---- */
(function intro(){
  const w=document.getElementById('introWord');
  'FORGE'.split('').forEach((ch,i)=>{ const s=document.createElement('span'); s.textContent=ch; s.style.animationDelay=(0.5+i*0.09)+'s'; w.appendChild(s); });
  loadUsers();   // ensure your master account exists
  go(null);      // render app underneath, ready for unlock
  setTimeout(()=>{
    const intro=document.getElementById('intro');
    intro.classList.add('hide');
    setTimeout(()=>{ intro.remove(); startPin(); }, 640);
  }, 2700);
})();

let pinEntry='';
function startPin(){ pinEntry=''; const p=document.getElementById('pin'); p.style.display='flex'; buildKeypad(); renderPin(); }
function renderPin(){
  document.getElementById('pinTitle').textContent='Enter your PIN';
  document.getElementById('pinSub').textContent='Welcome to Forge';
  const dots=document.getElementById('pinDots'); dots.className='dots'; dots.innerHTML='';
  for(let i=0;i<4;i++){ const d=document.createElement('div'); d.className='dot-pin'+(i<pinEntry.length?' on':''); dots.appendChild(d); }
  document.getElementById('pinReset').style.display='none';
}
function buildKeypad(){
  const kp=document.getElementById('keypad'); kp.innerHTML='';
  ['1','2','3','4','5','6','7','8','9','','0','del'].forEach(k=>{
    const b=document.createElement('button');
    if(k===''){ b.className='key blank'; }
    else if(k==='del'){ b.className='key fn'; b.textContent='Delete'; b.onclick=pinDel; }
    else { b.className='key'; b.textContent=k; b.onclick=()=>pinPush(k); }
    kp.appendChild(b);
  });
}
function pinPush(n){ if(pinEntry.length>=4) return; pinEntry+=n; renderPin(); if(pinEntry.length===4) setTimeout(pinSubmit,180); }
function pinDel(){ pinEntry=pinEntry.slice(0,-1); renderPin(); }
function pinError(){ const d=document.getElementById('pinDots'); d.classList.add('err'); if(navigator.vibrate) navigator.vibrate(120); setTimeout(()=>{ pinEntry=''; renderPin(); },430); }
function unlock(){ const p=document.getElementById('pin'); p.classList.add('hide'); setTimeout(()=>{ p.style.display='none'; p.classList.remove('hide'); },640); }
function lockForge(){ currentUser=null; pinEntry=''; const p=document.getElementById('pin'); p.style.display='flex'; renderPin(); }
function activateUser(u){ currentUser={id:u.id,name:u.name,role:u.role}; loadStoreFor(u.id); }
function pinSubmit(){
  const u=loadUsers().find(x=>x.pin===tinyHash(pinEntry));
  if(u){ activateUser(u); unlock(); go(null); } else pinError();
}

/* ---- master-only account management ---- */
function openAddUser(){
  const o=document.createElement('div'); o.className='overlay'; o.id='ovl';
  o.innerHTML='<div class="sheet" onclick="event.stopPropagation()">'+
    '<h3>Add a user</h3><p>They log in with their own PIN and get a private space on this device.</p>'+
    '<input id="uName" placeholder="Name" maxlength="20" autocomplete="off"/>'+
    '<input id="uPin" placeholder="4-digit PIN" inputmode="numeric" maxlength="4" autocomplete="off"/>'+
    '<div class="btnrow"><button class="btn btn-ghost" onclick="closeOverlay()">Cancel</button>'+
    '<button class="btn btn-primary" onclick="saveNewUser()">Create</button></div></div>';
  o.onclick=closeOverlay; document.getElementById('app').appendChild(o);
  setTimeout(()=>{ const n=document.getElementById('uName'); if(n)n.focus(); },100);
}
function saveNewUser(){
  const name=(document.getElementById('uName').value||'').trim();
  const pin=(document.getElementById('uPin').value||'').trim();
  if(!name){ document.getElementById('uName').focus(); return; }
  if(!/^[0-9]{4}$/.test(pin)){ alert('PIN must be exactly 4 digits.'); return; }
  const us=loadUsers();
  if(us.some(u=>u.pin===tinyHash(pin))){ alert('That PIN is already in use — pick another.'); return; }
  us.push({id:'u'+Date.now(), name:name, pin:tinyHash(pin), role:'user'});
  saveUsers(us); closeOverlay(); go('users');
}
function deleteUser(id){ if(!confirm('Remove this user and all their data on this device?')) return; saveUsers(loadUsers().filter(u=>u.id!==id)); lsDel('forge.store.'+id); go('users'); }
function renameUser(id){ const us=loadUsers(); const u=us.find(x=>x.id===id); if(!u) return; const n=prompt('Name:', u.name); if(n && n.trim()){ u.name=n.trim(); saveUsers(us); if(currentUser && currentUser.id===id) currentUser.name=u.name; go('users'); } }
</script>
