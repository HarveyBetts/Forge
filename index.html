// If the user had the old single Finances tab (or has Money set up), make sure the
// six finance sub-tabs are enabled so the Money grid shows them.
function migrateFinanceTabs(){
  if(!Array.isArray(_tabsCache))return;
  if(_tabsCache.indexOf('fin_overview')>=0&&_tabsCache.indexOf('fin_accounts')<0){setEnabledTabs(_tabsCache.slice(0,_tabsCache.indexOf('fin_overview')+1).concat(['fin_accounts'],_tabsCache.slice(_tabsCache.indexOf('fin_overview')+1)));}
  if(_tabsCache.indexOf('fin_overview')>=0&&_tabsCache.indexOf('fin_rates')<0){setEnabledTabs(_tabsCache.concat(['fin_rates']));}
  var finTabs=['fin_overview','fin_accounts','fin_budget','fin_investments','fin_networth','fin_goals','fin_subs','fin_rates'];
  var hadFinances=_tabsCache.indexOf('finances')>=0;
  var hasAnyFin=finTabs.some(function(t){return _tabsCache.indexOf(t)>=0;});
  if(hadFinances&&!hasAnyFin){
    var next=_tabsCache.filter(function(t){return t!=='finances';}).concat(finTabs);
    setEnabledTabs(next);
  }
}
function setEnabledTabs(a){_tabsCache=a;lsSet(tabsKey(),JSON.stringify(a));if(currentUser){sb.from('settings').upsert({user_id:currentUser.id,enabled_tabs:JSON.stringify(a),updated_at:new Date().toISOString()},{onConflict:'user_id'}).then(function(r){if(r&&r.error)toast('Cloud sync failed: '+r.error.message);}).catch(function(){toast('Cloud sync failed');});}}
// Live cross-device tab sync via Supabase Realtime
var _tabsChannel=null;
function handleSettingsChange(payload){
  try{
    var row=(payload&&(payload.new||payload.record))||null;
    if(!row||row.enabled_tabs==null)return;
    var arr=typeof row.enabled_tabs==='string'?JSON.parse(row.enabled_tabs):row.enabled_tabs;
    if(!Array.isArray(arr))return;
    var before=JSON.stringify(enabledTabs());
    _tabsCache=arr;lsSet(tabsKey(),JSON.stringify(arr));
    if(JSON.stringify(enabledTabs())===before)return;        // no real change (e.g. our own echo)
    if(typeof current!=='undefined'&&current){ if(current.tab===null)go(null,true); else refreshScreen(); }
  }catch(e){}
}
function subscribeTabs(){
  if(!currentUser||!sb.channel)return;
  if(_tabsChannel){try{sb.removeChannel(_tabsChannel);}catch(e){}_tabsChannel=null;}
  try{
    _tabsChannel=sb.channel('forge-settings-'+currentUser.id)
      .on('postgres_changes',{event:'*',schema:'public',table:'settings',filter:'user_id=eq.'+currentUser.id},handleSettingsChange)
      .subscribe();
  }catch(e){}
}

// ---- Face ID (WebAuthn platform authenticator; iOS 16.4+ / modern browsers) ----
function bioKey(uid){return 'forge.bio.'+uid;}
function _b64(buf){var b='';var u8=new Uint8Array(buf);for(var i=0;i<u8.length;i++)b+=String.fromCharCode(u8[i]);return btoa(b).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
function _unb64(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';var bin=atob(s);var u8=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);return u8.buffer;}
function _rand(n){var a=new Uint8Array(n);crypto.getRandomValues(a);return a;}
async function bioAvailable(){try{return !!(window.PublicKeyCredential&&await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable());}catch(e){return false;}}
async function bioRegister(){
  if(!currentUser)return false;
  try{
    var cred=await navigator.credentials.create({publicKey:{
      challenge:_rand(32),
      rp:{name:'Forge',id:location.hostname},
      user:{id:new TextEncoder().encode(currentUser.id),name:currentUser.name||'Forge user',displayName:currentUser.name||'Forge user'},
      pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
      authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'preferred'},
      timeout:60000,attestation:'none'
    }});
    if(!cred)return false;
    lsSet(bioKey(currentUser.id),JSON.stringify({cid:_b64(cred.rawId)}));
    return true;
  }catch(e){return false;}
}
async function bioLogin(){
  if(!currentUser)return false;
  var raw=lsGet(bioKey(currentUser.id));if(!raw)return false;
  try{
    var cid=JSON.parse(raw).cid;
    var a=await navigator.credentials.get({publicKey:{
      challenge:_rand(32),
      allowCredentials:[{type:'public-key',id:_unb64(cid),transports:['internal']}],
      userVerification:'required',timeout:60000
    }});
    if(!a)return false;
    await loadTabs();enterApp(false);
    return true;
  }catch(e){return false;}
}
async function maybeOfferFaceID(){
  try{
    if(!currentUser)return;
    if(lsGet(bioKey(currentUser.id)))return;                      // already set up
    if(lsGet('forge.bioAsked.'+currentUser.id))return;            // don't nag
    if(!await bioAvailable())return;
    lsSet('forge.bioAsked.'+currentUser.id,'1');
    if(confirm('Unlock Forge with Face ID next time?')){
      var ok=await bioRegister();
      toast(ok?'Face ID enabled \u2713':'Couldn\u2019t enable Face ID');
    }
  }catch(e){}
}

function buildKeypad(){

async function buildBriefing(){
  if(!currentUser)return '';
  // Prefer the brain's top insight(s) so the one-liner reflects the same engine.
  try{
    var ins=await brainInsights();
    if(ins&&ins.length){
      var lead=ins.filter(function(x){return x.sev>=1;}).slice(0,2).map(function(x){return x.text.replace(/\s+/g,' ');});
      if(lead.length)return lead.join('   ·   ');
    }
  }catch(e){}
  var parts=[];
  try{
    var wantTasks=enabledTabs().indexOf('work')>=0;
    var res=await Promise.all([getCountdowns(),getMeals(),wantTasks?loadItems('work'):Promise.resolve([])]);
    var cds=res[0]||[],meals=res[1]||{},tasks=res[2]||[];
    var today=new Date();today.setHours(0,0,0,0);
    var soon=null,sd=null;
    cds.forEach(function(c){if(!c.d)return;var dt=new Date(c.d+'T00:00:00');if(isNaN(dt.getTime()))return;var days=Math.round((dt-today)/86400000);if(days>=0&&(sd===null||days<sd)){sd=days;soon=c;}});

    var now=Date.now();if(now-lastT>0){vx=(t.clientX-lastX)/(now-lastT);}lastX=t.clientX;lastT=now;
    if(nei){
      var d=Math.max(-W,Math.min(W,dx));
      if(d*dir>0){cur.style.transform='translateX('+(d*0.18)+'px)';nei.style.transform='translateX('+(dir>0?W:-W)+'px)';}
      else{cur.style.transform='translateX('+d+'px)';nei.style.transform='translateX('+((dir>0?W:-W)+d)+'px)';
        var ind=document.getElementById('navInd');if(ind)ind.style.setProperty('--nx',fromIdx+Math.min(1,Math.abs(d)/W)*dir);}
    }else{
      cur.style.transform='translateX('+(dx*0.32)+'px)';     // rubber at the ends
    }
  },{passive:false});
  document.addEventListener('touchend',function(e){
    if(!dragging){eligible=false;return;}
    var t=e.changedTouches[0];var dx=t.clientX-sx;
    var prog=nei?Math.min(1,Math.max(0,(-dx*dir)/W)):0;
    var flick=nei&&((dir>0&&vx<-0.45)||(dir<0&&vx>0.45));
    var EASE='transform .38s cubic-bezier(.22,.9,.3,1)';
    if(nei&&(prog>0.28||flick)){
      var toTab=idxToTab(toIdx);var c=cur,n=nei;
      c.style.transition=EASE;n.style.transition=EASE;
      requestAnimationFrame(function(){c.style.transform='translateX('+(dir>0?-W:W)+'px)';n.style.transform='translateX(0)';});
      var ind=document.getElementById('navInd');if(ind){ind.style.transition='';ind.style.setProperty('--nx',toIdx);}
      setTimeout(function(){
        if(c.parentNode)c.parentNode.removeChild(c);
        n.classList.remove('dragging','tab-peek');n.style.transition='';n.style.transform='';
        activeTab=toTab;current={tab:toTab,el:n};backTarget=null;
        renderHeader(toTab);manageFab(toTab);updateNav(toTab);manageAiEdge(toTab);
        cur=null;nei=null;dragging=false;decided=false;eligible=false;
      },400);
    }else{
      var c2=cur,n2=nei;
      c2.style.transition=EASE;c2.style.transform='translateX(0)';
      if(n2){n2.style.transition=EASE;n2.style.transform='translateX('+(dir>0?W:-W)+'px)';}
      var ind2=document.getElementById('navInd');if(ind2){ind2.style.transition='';ind2.style.setProperty('--nx',fromIdx);}
      setTimeout(function(){
        if(n2&&n2.parentNode)n2.parentNode.removeChild(n2);
        c2.classList.remove('dragging');c2.style.transition='';c2.style.transform='';
        cur=null;nei=null;dragging=false;decided=false;eligible=false;
      },400);
    }
  },{passive:true});
  document.addEventListener('touchcancel',function(){if(dragging)reset();else eligible=false;},{passive:true});
})();
// ---- Sheet physics: drag down to dismiss (grip or from top when not scrolled) ----
(function(){
  var s=null,sy=0,st=0,dragging=false,ovl=null;
  document.addEventListener('touchstart',function(e){
    if(e.touches.length!==1)return;
    var t=e.touches[0];var el=t.target;
    if(el.closest&&el.closest('input,textarea,select,[contenteditable]'))return;
    var sh=el.closest?el.closest('.sheet'):null;if(!sh)return;
    var ov=sh.parentNode;if(!ov||!ov.classList||!ov.classList.contains('overlay'))return;
    var r=sh.getBoundingClientRect();
    if(sh.scrollTop>2&&(t.clientY-r.top)>48)return;   // scrolled: only the grip zone grabs
    s=sh;ovl=ov;sy=t.clientY;st=Date.now();dragging=false;
  },{passive:true});
  document.addEventListener('touchmove',function(e){
    if(!s)return;var t=e.touches[0];var dy=t.clientY-sy;
    if(!dragging){if(dy>8&&s.scrollTop<=2){dragging=true;s.style.transition='none';}else if(dy<-4){s=null;return;}else return;}
    if(e.cancelable)e.preventDefault();
    s.style.transform='translateY('+Math.max(0,dy)+'px)';
  },{passive:false});
  document.addEventListener('touchend',function(e){
    if(!s)return;
    if(!dragging){s=null;return;}
    var t=e.changedTouches[0];var dy=t.clientY-sy;var v=dy/Math.max(1,Date.now()-st);
    if(dy>110||v>0.55){
      s.style.transition='transform .26s cubic-bezier(.3,.7,.4,1)';
      s.style.transform='translateY(110%)';
      var o2=ovl;o2.removeAttribute('id');o2.classList.add('out');
      setTimeout(function(){if(o2.parentNode)o2.parentNode.removeChild(o2);},280);
    }else{
      s.style.transition='transform .4s cubic-bezier(.34,1.4,.5,1)';
      s.style.transform='';
    }
    s=null;dragging=false;
  },{passive:true});
})();

// TRACKER ENGINE — log a daily number + note → chart, trend, AI insight.
// Reused by Mood, Sleep (and any future daily metric).
// ============================================================
var TRACKERS={
  mood:{label:'Mood',max:10,suffix:' /10',q:'How was today, out of 10?',noteLabel:'What shaped it?',color:'#FB923C'},
  sleep:{label:'Sleep score',max:100,suffix:'',q:'Last night\u2019s sleep score (0\u2013100)',noteLabel:'Notes (bedtime, wake-ups\u2026)',color:'#818CF8'}
};
function localDay(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function trackerChart(points,max,color){
  if(!points.length)return '<div class="rs" style="padding:18px 0;text-align:center">Log a few days to see your trend.</div>';
  var W=300,H=92,pad=8,n=points.length,step=n>1?(W-2*pad)/(n-1):0;
  var pts=points.map(function(p,i){var x=pad+(n>1?i*step:(W/2-pad));var y=H-pad-((Math.max(0,Math.min(max,p.value))/max)*(H-2*pad));return{x:x,y:y};});
  var line=pts.map(function(p,i){return (i?'L':'M')+p.x.toFixed(1)+' '+p.y.toFixed(1);}).join(' ');
  var dots=pts.map(function(p){return '<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="2.6" fill="'+color+'"/>';}).join('');
  var lastX=pts[pts.length-1].x;
  var area=(n>1?('M'+pts[0].x.toFixed(1)+' '+(H-pad)+' '+pts.map(function(p){return 'L'+p.x.toFixed(1)+' '+p.y.toFixed(1);}).join(' ')+' L'+lastX.toFixed(1)+' '+(H-pad)+' Z'):'');
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" height="'+H+'" preserveAspectRatio="none" style="display:block;overflow:visible">'+(area?'<path d="'+area+'" fill="'+color+'" opacity="0.10"/>':'')+'<path d="'+line+'" fill="none" stroke="'+color+'" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>'+dots+'</svg>';
}
async function renderTracker(kind){
  var cfg=TRACKERS[kind];
  var logs=await getTrackerLogs(kind,30);
  var asc=logs.slice().reverse();
  var today=localDay();
  var todayLog=logs.filter(function(l){return l.day===today;})[0];
  var vals=logs.map(function(l){return l.value;});
  var avg=vals.length?vals.reduce(function(a,b){return a+b;},0)/vals.length:0;
  function mean(a){return a.length?a.reduce(function(s,x){return s+x.value;},0)/a.length:0;}
  var last7=logs.slice(0,7),prev7=logs.slice(7,14),tr=mean(last7)-mean(prev7);
  var trTxt=prev7.length?(tr>0.3?'\u25B2 trending up':tr<-0.3?'\u25BC trending down':'\u2192 steady'):'';
  var head='<div class="card dark"><div class="small">'+esc(cfg.label)+(todayLog?' \u00B7 today':'')+'</div><div class="serif" style="font-size:40px;font-weight:600;margin-top:2px">'+(todayLog?todayLog.value+cfg.suffix:'\u2014')+'</div><div style="font-size:13px;opacity:.85;margin-top:4px">'+(vals.length?'avg '+avg.toFixed(1)+cfg.suffix+(trTxt?' \u00B7 '+trTxt:''):'No entries yet')+'</div></div>';
  var logBtn='<button class="reqbtn" onclick="logTracker(\''+kind+'\')">'+icon('plus',16)+' '+(todayLog?'Update today':'Log today')+'</button>';
  var chart='<div class="card"><div class="ctitle">Trend</div>'+trackerChart(asc.map(function(l){return{day:l.day,value:l.value};}),cfg.max,cfg.color)+'</div>';
  var insight=logs.length?'<div class="card" id="trkInsight" style="display:flex;align-items:center;gap:12px"><div class="chip sm" style="--tc:'+cfg.color+'">'+icon('spark',16,2.2)+'</div><div style="flex:1"><div class="rt">Forge AI insight</div><div class="rs">What\u2019s driving your '+esc(cfg.label.toLowerCase())+'?</div></div><button class="tbtn add" onclick="trackerInsight(\''+kind+'\')">Ask</button></div>':'';
  var recent=logs.slice(0,12).map(function(l){var d=new Date(l.day+'T00:00:00');var ds=d.toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short',year:'numeric'});return '<div class="row"><div style="flex:1"><div class="rt">'+l.value+cfg.suffix+'  <span class="rs" style="font-weight:400">'+ds+'</span></div>'+(l.note?'<div class="rs">'+esc(l.note)+'</div>':'')+'</div><button class="del" onclick="delTracker(\''+l.id+'\')">'+icon('x',13)+'</button></div>';}).join('');
  var list=logs.length?'<div class="card"><div class="ctitle">History</div>'+recent+'</div>':'';
  return '<div class="stack">'+head+logBtn+chart+insight+list+'</div>';
}

// ============================================================
// PASSWORDS — a real encrypted vault. AES-GCM + PBKDF2 (Web
// Crypto). The server only ever sees ciphertext; the master
// password never leaves the device and is never stored.
// ============================================================
var pwKey=null;            // in-memory CryptoKey when unlocked (null = locked)
var pwReveal={};           // entry id -> revealed bool (for the open sheet)
var PW_VERIFY='forge-vault-v1';

function pwBufToB64(buf){var b=new Uint8Array(buf),s='';for(var i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);return btoa(s);}
function pwB64ToBuf(b64){var s=atob(b64),b=new Uint8Array(s.length);for(var i=0;i<s.length;i++)b[i]=s.charCodeAt(i);return b.buffer;}
async function pwDeriveKey(master,saltBuf){
  var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(master),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:saltBuf,iterations:160000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function pwEnc(key,plain){var iv=crypto.getRandomValues(new Uint8Array(12));var ct=await crypto.subtle.encrypt({name:'AES-GCM',iv:iv},key,new TextEncoder().encode(plain));return {iv:pwBufToB64(iv),cipher:pwBufToB64(ct)};}
async function pwDec(key,ivB64,cipherB64){var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:new Uint8Array(pwB64ToBuf(ivB64))},key,pwB64ToBuf(cipherB64));return new TextDecoder().decode(pt);}

// ---- vault meta (salt + verifier) ----
async function pwGetVault(){if(!currentUser)return null;try{var r=await sb.from('vault').select('*').eq('user_id',currentUser.id).maybeSingle();if(r.error)throw r.error;return r.data||null;}catch(e){return null;}}
async function pwCreateVault(master){
  var saltB=crypto.getRandomValues(new Uint8Array(16));
  var key=await pwDeriveKey(master,saltB.buffer);
  var v=await pwEnc(key,PW_VERIFY);
  var r=await sb.from('vault').insert({user_id:currentUser.id,salt:pwBufToB64(saltB.buffer),v_iv:v.iv,v_cipher:v.cipher});
  if(r.error)throw r.error;
  pwKey=key;
}
async function pwUnlock(master,row){
  var key=await pwDeriveKey(master,pwB64ToBuf(row.salt));
  var ok=false;try{ok=(await pwDec(key,row.v_iv,row.v_cipher))===PW_VERIFY;}catch(e){ok=false;}
  if(!ok)throw new Error('wrong');
  pwKey=key;
}
function pwLock(){pwKey=null;pwReveal={};refreshScreen();}

// ---- entries ----
async function pwList(){if(!currentUser)return[];try{var r=await sb.from('passwords').select('id,label,url,iv,cipher,created_at').eq('user_id',currentUser.id).order('label');if(r.error)throw r.error;return r.data||[];}catch(e){return [];}}
async function pwSave(o){var blob=JSON.stringify({u:o.username||'',p:o.password||'',n:o.notes||''});var c=await pwEnc(pwKey,blob);var r=await sb.from('passwords').insert({user_id:currentUser.id,label:o.label,url:o.url||'',iv:c.iv,cipher:c.cipher});if(r.error)throw r.error;}
async function pwDelete(id){var r=await sb.from('passwords').delete().eq('id',id);if(r.error)throw r.error;}
function pwGenerate(len){len=len||18;var U='ABCDEFGHJKLMNPQRSTUVWXYZ',L='abcdefghijkmnpqrstuvwxyz',D='23456789',S='!@#$%^&*-_=+';var all=U+L+D+S;var a=crypto.getRandomValues(new Uint32Array(len));var out=[U[a[0]%U.length],L[a[1]%L.length],D[a[2]%D.length],S[a[3]%S.length]];for(var i=4;i<len;i++)out.push(all[a[i]%all.length]);for(var j=out.length-1;j>0;j--){var k=a[j]%(j+1);var t=out[j];out[j]=out[k];out[k]=t;}return out.join('');}

async function renderPasswords(){
  if(!currentUser)return '<div class="card"><div class="rs">Sign in to use the vault.</div></div>';
  // UNLOCKED
  if(pwKey){
    var entries=await pwList();
    var rows=entries.length?entries.map(function(e){
      var letter=(e.label||'?').trim().charAt(0).toUpperCase();
      return '<div class="pw-row" onclick="pwOpen(\''+e.id+'\')"><div class="pw-ico">'+esc(letter)+'</div><div class="pw-main"><div class="pw-label">'+esc(e.label)+'</div>'+(e.url?'<div class="pw-sub">'+esc(e.url)+'</div>':'')+'</div><div class="pw-dots">\u2022\u2022\u2022\u2022\u2022\u2022</div>'+icon('chev',16,2.4)+'</div>';
    }).join(''):'<div class="rs" style="padding:14px 2px;text-align:center">No saved logins yet. Tap + to add one.</div>';
    return pwCSS()+'<div class="stack" style="padding-bottom:90px"><div class="pw-bar"><div class="pw-bar-l">'+icon('shield',16,2.2)+' <span>Vault unlocked</span></div><button class="pw-lock" onclick="pwLock()">'+icon('padlock',14,2.4)+' Lock</button></div><div class="cal-card" style="padding:6px 14px">'+rows+'</div><button class="pw-fab" onclick="pwAddSheet()" aria-label="Add login">'+icon('plus',24,2.6)+'</button></div>';
  }
  // LOCKED — decide create vs unlock
  var vault=await pwGetVault();
  if(vault){
    return pwCSS()+'<div class="stack"><div class="pw-hero"><div class="pw-hero-ico">'+icon('padlock',30,2.2)+'</div><div class="pw-hero-t">Vault locked</div><div class="pw-hero-s">Enter your master password to unlock your saved logins.</div><input class="pw-field" id="pwMaster" type="password" placeholder="Master password" autocomplete="off" onkeydown="if(event.key===\'Enter\')pwDoUnlock()"/><button class="btn btn-primary pw-go" onclick="pwDoUnlock()">Unlock</button><div class="pw-note">'+icon('shield',13,2.2)+' Everything is encrypted on your device. We can\u2019t see your passwords \u2014 and if you forget the master password, they can\u2019t be recovered.</div></div></div>';
  }
  return pwCSS()+'<div class="stack"><div class="pw-hero"><div class="pw-hero-ico">'+icon('shield',30,2.2)+'</div><div class="pw-hero-t">Create your vault</div><div class="pw-hero-s">Pick a master password. It encrypts everything and is never stored \u2014 so choose something strong you won\u2019t forget.</div><input class="pw-field" id="pwNew1" type="password" placeholder="Master password (10+ characters)" autocomplete="off"/><input class="pw-field" id="pwNew2" type="password" placeholder="Confirm master password" autocomplete="off" onkeydown="if(event.key===\'Enter\')pwDoCreate()"/><button class="btn btn-primary pw-go" onclick="pwDoCreate()">Create vault</button><div class="pw-note">'+icon('shield',13,2.2)+' Encrypted with AES-256 on your device. If you lose this password there is no reset \u2014 that\u2019s what keeps it private.</div></div></div>';
}

async function pwDoUnlock(){
  var m=(document.getElementById('pwMaster')||{}).value||'';if(!m){toast('Enter your master password');return;}
  var vault=await pwGetVault();if(!vault){refreshScreen();return;}
  try{await pwUnlock(m,vault);toast('Unlocked \u2713');await refreshScreen();}catch(e){toast('Wrong master password');}
}
async function pwDoCreate(){
  var a=(document.getElementById('pwNew1')||{}).value||'',b=(document.getElementById('pwNew2')||{}).value||'';
  if(a.length<10){toast('Use at least 10 characters');return;}
  if(a!==b){toast('Passwords don\u2019t match');return;}
  try{await pwCreateVault(a);toast('Vault created \u2713');await refreshScreen();}catch(e){toast('Couldn\u2019t create \u2014 run the vault SQL once');}
}

  var entries=await pwList();var e=null;for(var i=0;i<entries.length;i++)if(entries[i].id===id)e=entries[i];if(!e)return;
  var data={u:'',p:'',n:''};try{data=JSON.parse(await pwDec(pwKey,e.iv,e.cipher));}catch(_){}
  var o=document.createElement('div');o.className='overlay';o.id='ovl';o.onclick=closeOverlay;
  var field=function(lbl,val,mask){var id2='f'+Math.random().toString(36).slice(2,7);return '<div class="pw-f"><div class="pw-f-l">'+lbl+'</div><div class="pw-f-r"><span class="pw-f-v'+(mask?' mono':'')+'" id="'+id2+'" data-real="'+esc(val)+'" data-mask="'+(mask?'1':'0')+'">'+(mask?'\u2022\u2022\u2022\u2022\u2022\u2022\u2022\u2022\u2022\u2022':esc(val||'\u2014'))+'</span>'+(mask?'<button class="pw-mini" onclick="pwToggle(\''+id2+'\',this)">'+icon('eye',15,2.2)+'</button>':'')+(val?'<button class="pw-mini" onclick="pwCopy('+JSON.stringify(val).replace(/"/g,'&quot;')+',this)">'+icon('copy',15,2.2)+'</button>':'')+'</div></div>';};

  document.getElementById('app').appendChild(o);

// ============================================================
// CALENDAR — Apple-style, in Forge's skin. Year / Month / Week
// / Day / Agenda. Everything is cached in memory so moving
// through time is instant; Day & Week show a full scrollable
// 24-hour grid that opens at the current time.
// ============================================================
var calView='month', calCursor=null, calAnim='';
var CAL_HH_DAY=52, CAL_HH_WEEK=44, CAL_PAD=8;
var _calKeepScroll=null;
function calPad(n){return (n<10?'0':'')+n;}
function calISO(d){return d.getFullYear()+'-'+calPad(d.getMonth()+1)+'-'+calPad(d.getDate());}
function calCur(){var d=calCursor?new Date(calCursor):new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate());}
function calToday(){calCursor=new Date();calAnim='pop';_calKeepScroll=null;refreshScreen();}
function calSetView(v){if(v===calView)return;var ladder=['year','month','week','day'];var a=ladder.indexOf(v),b=ladder.indexOf(calView);calAnim=(a>=0&&b>=0)?(a>b?'zoomin':'zoomout'):'fade';calView=v;_calKeepScroll=null;refreshScreen();}
function calNav(n){var cb=document.getElementById('calBody');if(cb&&cb._busy)return;if(cb&&calView!=='agenda'){calBuildTrack();calCommitTrack(n>0?1:-1);return;}var d=calCur();if(calView==='year')d=new Date(d.getFullYear()+n,d.getMonth(),1);else if(calView==='month')d=new Date(d.getFullYear(),d.getMonth()+n,1);else if(calView==='week')d.setDate(d.getDate()+7*n);else d.setDate(d.getDate()+n);calCursor=d;calAnim=n>0?'next':'prev';refreshScreen();}
function calZoom(dir){var ladder=['year','month','week','day'];var i=ladder.indexOf(calView);if(i<0)i=1;var ni=Math.max(0,Math.min(3,i+dir));if(ni===i)return;calView=ladder[ni];calAnim=dir>0?'zoomin':'zoomout';_calKeepScroll=null;refreshScreen();}
function calGoDay(iso){calCursor=new Date(iso+'T00:00:00');calView='day';calAnim='zoomin';_calKeepScroll=null;refreshScreen();}
function calGoMonth(y,mo){calCursor=new Date(y,mo,1);calView='month';calAnim='zoomin';_calKeepScroll=null;refreshScreen();}
function calPickDay(iso){var nd=new Date(iso+'T00:00:00');var cur=calCur();calAnim=nd>cur?'next':(nd<cur?'prev':'fade');calCursor=nd;calView='day';_calKeepScroll=null;refreshScreen();}
var CAL_COL={work:'#2F6BFF',meeting:'#6366F1',appointment:'#0EA5E9',social:'#EC4899',health:'#16A34A',personal:'#7C5CFF',due:'#F59E0B',home:'#14B8A6',todo:'#6366F1',other:'#647084'};
function calColor(t){return CAL_COL[t]||CAL_COL.other;}
function calHM(t){if(!t||!/^\d{1,2}:\d{2}/.test(t))return null;var p=t.split(':');return (+p[0])+(+p[1])/60;}
function calHourLbl(h){return calPad(h)+':00';}

// ---- gestures (attached once; act only on the calendar) ----
var _calGest=false;
function calInitGestures(){
  if(_calGest)return; _calGest=true;
  var sx=0,sy=0,st=0,d0=0,mode='',decided=false,pinchDone=false;
  function dist(t){return Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);}
  document.addEventListener('touchstart',function(e){
    if(activeTab!=='calendar')return;
    if(e.touches.length===2){mode='pinch';d0=dist(e.touches);pinchDone=false;return;}
    if(e.touches.length===1){var t=e.touches[0];if(t.clientX<28){mode='';return;}var cb=document.getElementById('calBody');if(cb&&cb._busy){mode='';return;}sx=t.clientX;sy=t.clientY;st=Date.now();mode='swipe';decided=false;}
  },{passive:true});
  document.addEventListener('touchmove',function(e){
    if(activeTab!=='calendar')return;
    if(mode==='pinch'&&e.touches.length===2){if(pinchDone)return;var r=dist(e.touches)/(d0||1);if(r>1.3){pinchDone=true;calZoom(1);}else if(r<0.72){pinchDone=true;calZoom(-1);}return;}
    if(mode==='swipe'&&e.touches.length===1){
      var t=e.touches[0];var dx=t.clientX-sx,dy=t.clientY-sy;
      if(!decided){if(Math.abs(dx)<10&&Math.abs(dy)<10)return;decided=true;if(calView==='agenda'){mode='';return;}if(Math.abs(dx)<=Math.abs(dy)*1.25){mode='';return;}calBuildTrack();}
      if(e.cancelable)e.preventDefault();
      var cb=document.getElementById('calBody');
      if(cb&&cb._track){var x=-cb._W+dx;cb._track.style.transition='';cb._track.style.transform='translate3d('+x+'px,0,0)';}
    }
  },{passive:false});
  document.addEventListener('touchend',function(e){
    if(mode==='swipe'&&decided){
      var cb=document.getElementById('calBody');
      if(cb&&cb._track){
        var t=e.changedTouches&&e.changedTouches[0];var dx=t?t.clientX-sx:0;var dt=Date.now()-st;var fast=dt<260&&Math.abs(dx)>26;var thr=Math.min(cb._W*0.24,72);
        if(dx<-thr||(fast&&dx<-8))calCommitTrack(1);
        else if(dx>thr||(fast&&dx>8))calCommitTrack(-1);
        else calCancelTrack();
      }
    }
    mode='';decided=false;
  },{passive:true});
}
function calShiftDate(d,n){var x=d?new Date(d):new Date();if(isNaN(x.getTime()))x=new Date();if(calView==='year')x=new Date(x.getFullYear()+n,x.getMonth(),1);else if(calView==='month')x=new Date(x.getFullYear(),x.getMonth()+n,1);else if(calView==='week'||calView==='agenda')x.setDate(x.getDate()+7*n);else x.setDate(x.getDate()+n);return x;}
function calViewHTML(){return calView==='year'?calYearView():calView==='week'?calWeekView():calView==='day'?calDayView():calView==='agenda'?calAgendaView():calMonthView();}
function calBuildTrack(){
  var cb=document.getElementById('calBody');if(!cb||cb._track)return cb;
  var W=cb.clientWidth||window.innerWidth||390;var save=calCursor;
  calCursor=calShiftDate(save,-1);var prevH=calViewHTML();
  calCursor=calShiftDate(save,1);var nextH=calViewHTML();
  calCursor=save;
  var cur=document.createElement('div');cur.className='cal-pane';cur.style.width=W+'px';
  while(cb.firstChild)cur.appendChild(cb.firstChild);
  var prev=document.createElement('div');prev.className='cal-pane';prev.style.width=W+'px';prev.innerHTML=prevH;
  var next=document.createElement('div');next.className='cal-pane';next.style.width=W+'px';next.innerHTML=nextH;
  var track=document.createElement('div');track.className='cal-track';
  track.appendChild(prev);track.appendChild(cur);track.appendChild(next);
  cb.appendChild(track);cb._track=track;cb._W=W;cb._panes={prev:prev,cur:cur,next:next};
  track.style.transform='translate3d('+(-W)+'px,0,0)';
  var cs=cur.querySelector('.cal-scroll');
  if(cs){var tp=cs.scrollTop;var ps=prev.querySelector('.cal-scroll');var ns=next.querySelector('.cal-scroll');if(ps)ps.scrollTop=tp;if(ns)ns.scrollTop=tp;}
  [prev,cur,next].forEach(function(p){var s=p.querySelector('.cal-scroll');if(s)s.classList.add('cal-scroll-ready');});
  return cb;
}
function _calSettle(cb,tgt){var frag=document.createDocumentFragment();while(tgt.firstChild)frag.appendChild(tgt.firstChild);cb._track=null;cb._panes=null;cb._busy=false;cb.classList.add('cal-settled');cb.innerHTML='';cb.appendChild(frag);}
function calCommitTrack(dir){
  var cb=document.getElementById('calBody');if(!cb||!cb._track||cb._busy)return;var W=cb._W,track=cb._track;cb._busy=true;
  track.style.transition='transform .48s cubic-bezier(.22,.61,.36,1)';
  void track.offsetWidth; // flush styles so the transition actually animates (prevents the jump/reset glitch)
  track.style.transform='translate3d('+(dir>0?-2*W:0)+'px,0,0)';
  var done=false;var fin=function(){if(done)return;done=true;track.removeEventListener('transitionend',fin);calCursor=calShiftDate(calCursor,dir);_calSettle(cb,dir>0?cb._panes.next:cb._panes.prev);};
  track.addEventListener('transitionend',fin);setTimeout(fin,560);
}
function calCancelTrack(){
  var cb=document.getElementById('calBody');if(!cb||!cb._track||cb._busy)return;var W=cb._W,track=cb._track;cb._busy=true;
  track.style.transition='transform .34s cubic-bezier(.22,.61,.36,1)';
  void track.offsetWidth;
  track.style.transform='translate3d('+(-W)+'px,0,0)';
  var done=false;var fin=function(){if(done)return;done=true;track.removeEventListener('transitionend',fin);_calSettle(cb,cb._panes.cur);};
  track.addEventListener('transitionend',fin);setTimeout(fin,320);
}

// ---- in-memory cache: the reason transitions are now instant ----
var calCache={loaded:false,sh:[],ev:[],td:[],up:[]};
async function calEnsure(){
  if(calCache.loaded)return;
  function safe(p){return Promise.resolve(p).then(function(v){return v||[];}).catch(function(){return [];});}
  var r=await Promise.all([safe(getShifts()),safe(getEvents()),safe(typeof getTodos==='function'?getTodos():[]),safe(typeof getUpkeep==='function'?getUpkeep():[])]);
  calCache.sh=r[0];calCache.ev=r[1];calCache.td=r[2];calCache.up=r[3];calCache.loaded=true;
}
function calInvalidate(){calCache.loaded=false;}

// ---- events data (write-through: invalidate the cache on change) ----
async function getEvents(fromISO,toISO){if(!currentUser)return[];try{var q=sb.from('events').select('*').eq('user_id',currentUser.id);if(fromISO)q=q.gte('date',fromISO);if(toISO)q=q.lte('date',toISO);var r=await q.order('date');if(r.error)throw r.error;return (r.data||[]).map(function(x){return{id:x.id,date:x.date,title:x.title||'',start:x.start_t||'',end:x.end_t||'',allDay:!!x.all_day,type:x.type||'other',location:x.location||'',note:x.note||''};});}catch(e){return [];}}
async function saveEvent(o){if(!currentUser)return;var r=await sb.from('events').insert({user_id:currentUser.id,date:o.date,title:o.title,start_t:o.start||null,end_t:o.end||null,all_day:!!o.allDay,type:o.type||'other',location:o.location||null,note:o.note||null});if(r.error)throw r.error;calInvalidate();}
async function deleteEvent(id){var r=await sb.from('events').delete().eq('id',id);if(r.error)throw r.error;calInvalidate();}
async function updateEvent(id,o){if(!currentUser)return;var r=await sb.from('events').update({date:o.date,title:o.title,start_t:o.start||null,end_t:o.end||null,all_day:!!o.allDay,type:o.type||'other',location:o.location||null,note:o.note||null}).eq('id',id);if(r.error)throw r.error;calInvalidate();}
async function saveEventsBatch(rows){if(!currentUser||!rows.length)return;var r=await sb.from('events').insert(rows.map(function(o){return {user_id:currentUser.id,date:o.date,title:o.title,start_t:o.start||null,end_t:o.end||null,all_day:!!o.allDay,type:o.type||'other',location:o.location||null,note:o.note||null};}));if(r.error)throw r.error;calInvalidate();}

// ---- aggregate from cache — SYNCHRONOUS, no network on transitions ----
function calItems(fromISO,toISO){
  var out=[];
  calCache.sh.forEach(function(s){if(s.day>=fromISO&&s.day<=toISO)out.push({date:s.day,title:s.label||'Shift',start:s.start||'',end:s.end||'',allDay:!s.start,type:'work',kind:'shift',color:calColor('work'),sub:(s.start?(s.start+(s.end?' \u2013 '+s.end:'')):'Shift'),id:'s:'+s.id});});
  calCache.ev.forEach(function(e){if(e.date>=fromISO&&e.date<=toISO)out.push({date:e.date,title:e.title,start:e.start,end:e.end,allDay:e.allDay||!e.start,type:e.type,kind:'event',color:calColor(e.type),sub:e.location||(e.start?(e.start+(e.end?' \u2013 '+e.end:'')):'All day'),id:'e:'+e.id,rid:e.id});});
  calCache.up.forEach(function(a){(a.tasks||[]).forEach(function(t){if(t.next&&t.next>=fromISO&&t.next<=toISO)out.push({date:t.next,title:t.name,start:'',end:'',allDay:true,type:'home',kind:'upkeep',color:calColor('home'),sub:'Upkeep \u00B7 '+a.name,id:'u:'+a.id});});});
  calCache.td.forEach(function(t){if(t.due&&!t.done&&t.due>=fromISO&&t.due<=toISO)out.push({date:t.due,title:t.text,start:'',end:'',allDay:true,type:'todo',kind:'todo',color:calColor('todo'),sub:(t.term==='long'?'Goal':'To-do'),id:'t:'+t.id});});
  return out;
}
function calByDay(items){var m={};items.forEach(function(it){(m[it.date]=m[it.date]||[]).push(it);});return m;}
function calSort(a,b){return (a.allDay?0:1)-(b.allDay?0:1)||(calHM(a.start)||0)-(calHM(b.start)||0);}
function calLayout(evs){evs=evs.slice().sort(function(a,b){return a.s-b.s||a.e-b.e;});var i=0;while(i<evs.length){var cl=[evs[i]];var mx=evs[i].e;var j=i+1;while(j<evs.length&&evs[j].s<mx-0.001){cl.push(evs[j]);mx=Math.max(mx,evs[j].e);j++;}var lanes=[];cl.forEach(function(ev){var pl=false;for(var k=0;k<lanes.length;k++){if(ev.s>=lanes[k]-0.001){ev.lane=k;lanes[k]=ev.e;pl=true;break;}}if(!pl){ev.lane=lanes.length;lanes.push(ev.e);}});var tot=lanes.length;cl.forEach(function(ev){ev.lanes=tot;});i=j;}return evs;}

function calHeader(title){return '<div class="cal-head"><div class="cal-title" onclick="calZoom(-1)">'+title+'<span class="cal-title-chev">'+icon('chev',13,2.6)+'</span></div><div class="cal-navbtns"><button class="cal-today" onclick="calToday()">Today</button><button class="cal-nb" onclick="calNav(-1)">'+icon('back',15,2.4)+'</button><button class="cal-nb" onclick="calNav(1)">'+icon('chev',15,2.4)+'</button></div></div>';}
function calAddFab(){return '<button class="cal-fab" onclick="calAddEvent()" aria-label="Add event">'+icon('plus',24,2.6)+'</button>';}

function calStyleInject(){try{if(document.getElementById('forgeCalStyle'))return;var s=document.createElement('style');s.id='forgeCalStyle';s.textContent=calCSS();(document.head||document.documentElement).appendChild(s);}catch(e){}}
async function renderCalendar(){
  if(!calCursor)calCursor=new Date();
  calInitGestures();
  await calEnsure();
  calStyleInject();
  var seg='<div class="cal-seg">'+['month','week','day','agenda'].map(function(v){return '<button class="'+(calView===v?'on':'')+'" onclick="calSetView(\''+v+'\')">'+v.charAt(0).toUpperCase()+v.slice(1)+'</button>';}).join('')+'</div>';
  var body;
  try{
    if(calView==='year')body=calYearView();
    else if(calView==='week')body=calWeekView();
    else if(calView==='day')body=calDayView();
    else if(calView==='agenda')body=calAgendaView();
    else body=calMonthView();
  }catch(e){body='<div class="card"><div class="rs">Calendar hiccup \u2014 '+esc(String(e&&e.message||e))+'</div></div>';}
  var a=calAnim;calAnim='';
  var cls={zoomin:'cal-zin',zoomout:'cal-zout',next:'cal-next',prev:'cal-prev',pop:'cal-pop',fade:'cal-fade'}[a]||'';
  if(typeof requestAnimationFrame==='function')requestAnimationFrame(function(){requestAnimationFrame(calAfterRender);});
  return '<div class="stack" style="padding-bottom:90px">'+seg+'<div id="calBody" class="'+cls+'">'+body+'</div>'+calAddFab()+'</div>';
}

function calSaveScroll(){if(calView==='day'||calView==='week'){var sc=document.querySelector('.cal-scroll');if(sc)_calKeepScroll=sc.scrollTop;}}
function calWeekHasToday(c){var dow=(c.getDay()+6)%7;var mon=new Date(c.getFullYear(),c.getMonth(),c.getDate()-dow);var t=new Date();t.setHours(0,0,0,0);return t>=mon&&t<new Date(mon.getFullYear(),mon.getMonth(),mon.getDate()+7);}
function calAfterRender(){
  if(activeTab!=='calendar')return;
  // swipe on the view segment cycles Month ⇄ Week ⇄ Day ⇄ Agenda
  var seg=(current&&current.el?current.el:document).querySelector('.cal-seg');
  if(seg&&!seg._swipe){
    seg._swipe=true;
    var sx=0,sy=0;
    seg.addEventListener('touchstart',function(e){var t=e.touches[0];sx=t.clientX;sy=t.clientY;},{passive:true});
    seg.addEventListener('touchend',function(e){
      var t=e.changedTouches[0];var dx=t.clientX-sx,dy=t.clientY-sy;
      if(Math.abs(dx)<40||Math.abs(dx)<Math.abs(dy)*1.4)return;
      var order=['month','week','day','agenda'];
      var i=order.indexOf(calView);if(i<0)return;
      var ni=i+(dx<0?1:-1);if(ni<0||ni>order.length-1)return;
      calSetView(order[ni]);
    },{passive:true});
  }
  var sc=document.querySelector('.cal-scroll');if(!sc)return;
  var reveal=function(){sc.classList.add('cal-scroll-ready');};
  if(_calKeepScroll!=null){sc.scrollTop=_calKeepScroll;_calKeepScroll=null;reveal();return;}
  if(calView!=='day'&&calView!=='week'){reveal();return;}
  var HH=calView==='day'?CAL_HH_DAY:CAL_HH_WEEK;
  var c=calCur();var inToday=calView==='day'?(calISO(c)===calISO(new Date())):calWeekHasToday(c);
  var now=new Date();var h=now.getHours()+now.getMinutes()/60;
  var hr=inToday?Math.max(0,h-1):7;
  sc.scrollTop=Math.round(CAL_PAD+hr*HH-6);
  reveal();
}

function calYearView(){
  var c=calCur();var y=c.getFullYear();
  var byDay=calByDay(calItems(y+'-01-01',y+'-12-31'));
  var nowM=new Date().getMonth(),nowY=new Date().getFullYear(),todayISO=calISO(new Date());
  var months='';
  for(var mo=0;mo<12;mo++){
    var first=new Date(y,mo,1);var sdow=(first.getDay()+6)%7;var din=new Date(y,mo+1,0).getDate();
    var cells='';for(var i=0;i<sdow;i++)cells+='<div></div>';
    for(var dd=1;dd<=din;dd++){var iso=y+'-'+calPad(mo+1)+'-'+calPad(dd);var has=byDay[iso]&&byDay[iso].length;var isT=iso===todayISO;cells+='<div class="cal-ymc'+(isT?' t':'')+(has?' has':'')+'">'+dd+'</div>';}
    months+='<div class="cal-ymon" onclick="calGoMonth('+y+','+mo+')"><div class="cal-ymname'+(mo===nowM&&y===nowY?' t':'')+'">'+first.toLocaleDateString(undefined,{month:'long'})+'</div><div class="cal-ymgrid">'+cells+'</div></div>';
  }
  return calHeader(String(y))+'<div class="cal-ygrid">'+months+'</div>';
}

function calMonthView(){
  var c=calCur();var y=c.getFullYear(),m=c.getMonth();
  var startDow=(new Date(y,m,1).getDay()+6)%7;var daysIn=new Date(y,m+1,0).getDate();
  var rows=Math.ceil((startDow+daysIn)/7);var gridStart=new Date(y,m,1-startDow);
  var byDay=calByDay(calItems(calISO(gridStart),calISO(new Date(gridStart.getFullYear(),gridStart.getMonth(),gridStart.getDate()+rows*7-1))));
  var todayISO=calISO(new Date());
  var dows=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(function(d){return '<div class="cal-dow">'+d+'</div>';}).join('');
  var cells='';
  for(var i=0;i<rows*7;i++){
    var dt=new Date(gridStart.getFullYear(),gridStart.getMonth(),gridStart.getDate()+i);var iso=calISO(dt);
    var inM=dt.getMonth()===m;var isT=iso===todayISO;var its=(byDay[iso]||[]).slice().sort(calSort);
    var pills=its.slice(0,3).map(function(it){return '<div class="cal-pill" style="--c:'+it.color+';background:'+it.color+'22">'+esc(it.title)+'</div>';}).join('');
    var more=its.length>3?'<div class="cal-more">+'+(its.length-3)+'</div>':'';
    cells+='<div class="cal-mc'+(isT?' today':'')+(inM?'':' off')+'" onclick="calGoDay(\''+iso+'\')"><div class="cal-mnum">'+dt.getDate()+'</div>'+pills+more+'</div>';
  }
  return calHeader(new Date(y,m,1).toLocaleDateString(undefined,{month:'long',year:'numeric'}))+'<div class="cal-mdows">'+dows+'</div><div class="cal-mgrid">'+cells+'</div>';
}

function calGrid(days,fromISO,toISO,single){
  var byDay=calByDay(calItems(fromISO,toISO));
  var HH=single?CAL_HH_DAY:CAL_HH_WEEK;var totalH=24*HH;
  var hours='';for(var h=0;h<24;h++)hours+='<div class="cal-hr" style="height:'+HH+'px"><span>'+calHourLbl(h)+'</span></div>';
  var hlines='';for(var h2=0;h2<24;h2++){hlines+='<div class="cal-hrline" style="top:'+(h2*HH)+'px"></div>';hlines+='<div class="cal-hrline half" style="top:'+((h2+0.5)*HH)+'px"></div>';}
  var todayISO=calISO(new Date());var anyAD=false;
  var adcells=days.map(function(dy){var its=(byDay[dy.iso]||[]).filter(function(x){return x.allDay;});if(its.length)anyAD=true;return '<div class="cal-adcell">'+its.map(function(it){return '<div class="cal-adpill" style="--c:'+it.color+';background:'+it.color+'22" onclick="calOpenDay(\''+dy.iso+'\')">'+esc(it.title)+'</div>';}).join('')+'</div>';}).join('');

    return '<div class="cal-col'+(dy.iso===todayISO?' today':'')+'">'+blk+'</div>';
  }).join('');
  var now=new Date();var nowH=now.getHours()+now.getMinutes()/60;var showNow=days.some(function(dy){return dy.iso===todayISO;});
  var nowEl=showNow?'<div class="cal-now" style="top:'+(nowH*HH)+'px"><span class="cal-now-time">'+calPad(now.getHours())+':'+calPad(now.getMinutes())+'</span><span class="cal-nowdot"></span></div>':'';

}

function calAgendaView(){
  var c=calCur();var horizon=30;
  var items=calItems(calISO(c),calISO(new Date(c.getFullYear(),c.getMonth(),c.getDate()+horizon)));
  var byDay=calByDay(items);
  var todayISO=calISO(new Date());var tmrISO=calISO(new Date(new Date().getFullYear(),new Date().getMonth(),new Date().getDate()+1));
  // 7-day summary
  var wk=0;for(var w=0;w<7;w++){var wd=new Date(c.getFullYear(),c.getMonth(),c.getDate()+w);wk+=(byDay[calISO(wd)]||[]).length;}
  var sum='<div class="cal-agsum"><div><div class="cal-agsum-n">'+wk+'</div><div class="cal-agsum-l">next 7 days</div></div><div><div class="cal-agsum-n">'+items.length+'</div><div class="cal-agsum-l">next 30 days</div></div><button class="cal-agsum-add" onclick="calOpenAdd(\''+todayISO+'\')">'+icon('plus',15,2.6)+' New</button></div>';
  var html='';
  for(var i=0;i<=horizon;i++){
    var dt=new Date(c.getFullYear(),c.getMonth(),c.getDate()+i);var iso=calISO(dt);

      return '<div class="cal-agrow" onclick="calGoDay(\''+iso+'\')"><div class="cal-agtime'+(it.allDay?' ad':'')+'">'+(it.allDay?'all day':esc(it.start||''))+(!it.allDay&&it.end?'<span>'+esc(it.end)+'</span>':'')+'</div><div class="cal-agbar" style="background:'+it.color+'"></div><div style="flex:1;min-width:0"><div class="rt">'+esc(it.title)+'</div>'+(it.sub?'<div class="rs">'+esc(it.sub)+'</div>':'')+'</div><span class="cal-agchev">'+icon('chev',13,2.4)+'</span></div>';
    }).join(''):'<div class="cal-agempty">Nothing scheduled \u2014 enjoy the space.</div>';
    html+='<div class="cal-aghead"><span class="cal-aglbl'+(isToday?' on':'')+'">'+lbl+'</span><span class="cal-agdate">'+dt.toLocaleDateString(undefined,{day:'numeric',month:'short'})+'</span></div><div class="cal-card cal-agcard">'+rows+'</div>';

function _evAddDays(iso,n){var x=new Date(iso+'T00:00:00');x.setDate(x.getDate()+n);return calISO(x);}
function _evAddMonths(iso,n){var x=new Date(iso+'T00:00:00');var day=x.getDate();x.setDate(1);x.setMonth(x.getMonth()+n);var last=new Date(x.getFullYear(),x.getMonth()+1,0).getDate();x.setDate(Math.min(day,last));return calISO(x);}
async function evSave(){
  var d=_ev;if(!d.title.trim())return;
  try{
    if(d.mode==='reminder'){
      await addItemDB('reminders',d.title.trim(),d.date+(d.start?' '+d.start:''));
      evClose();toast('Reminder added \u2713');_brainCache.t=0;await refreshScreen();return;
    }
    var base={date:d.date,title:d.title.trim(),start:d.allDay?'':d.start,end:d.allDay?'':d.end,allDay:d.allDay,type:d.type,location:d.location.trim(),note:d.note.trim()};
    if(d.id){await updateEvent(d.id,base);}
    else if(d.repeat==='never'){await saveEvent(base);}
    else{
      var rows=[],reps={daily:30,weekly:26,fortnightly:13,monthly:12,yearly:3}[d.repeat]||1;
      for(var i=0;i<reps;i++){var dt=d.date;
        if(d.repeat==='daily')dt=_evAddDays(d.date,i);
        else if(d.repeat==='weekly')dt=_evAddDays(d.date,i*7);
        else if(d.repeat==='fortnightly')dt=_evAddDays(d.date,i*14);
        else if(d.repeat==='monthly')dt=_evAddMonths(d.date,i);
        else if(d.repeat==='yearly')dt=_evAddMonths(d.date,i*12);
        rows.push(Object.assign({},base,{date:dt}));}
      await saveEventsBatch(rows);
    }
    evClose();toast(d.id?'Saved \u2713':'Added \u2713');await refreshScreen();
  }catch(e){toast('Couldn\u2019t save \u2014 '+(e&&e.message||'try again'));}
}
async function evDelete(){if(!_ev.id)return;if(!confirm('Delete this event?'))return;try{await deleteEvent(_ev.id);evClose();toast('Deleted');await refreshScreen();}catch(e){toast('Couldn\u2019t delete');}}

function catScreenHTML(cid){
  var c=catById(cid);

  var en=enabledTabs();
  // 'calendar' in the Time category is rendered by the dedicated calTile below,
  // so exclude it here or it renders twice (once as the fixed tile, once in the loop).
  var onTabs=c.tabs.filter(function(t){return en.indexOf(t)>=0&&catalogById(t)&&!(c.id==='time'&&t==='calendar');});
  var tiles=onTabs.map(function(t){
    var ct=catalogById(t);
    return '<div class="tile" onclick="go(\''+t+'\',false,\'cat_'+c.id+'\')"><div class="chip" style="--tc:'+c.chip+'">'+icon(ct.icon||t,21,2.2)+'</div><div><div class="t">'+esc(ct.label)+'</div><div class="s">'+esc(ct.sub)+'</div></div></div>';

  var empty=onTabs.length?'':'<div class="cat-empty">Nothing here yet — add something below.</div>';

  return '<div class="home-grid">'+calTile+tiles+'</div>'+empty+addBtn+aiBtn;

  try{await saveRequestDB(v.slice(0,400));if(t)t.value='';toast('Sent \u2014 thanks! \u2713');}
  catch(e){toast('Couldn\u2019t send \u2014 try again');}
}
function openAddUser(){
  openForm('Add a user','They log in with their own PIN and get their own private space.',[{key:'name',label:'Name'},{key:'pin',label:'4-digit PIN'}],async function(v){
    if(!v.name){toast('Enter a name');return;}
    if(!/^[0-9]{4}$/.test(v.pin)){toast('PIN must be 4 digits');return;}
    var hash=await sha256hex(v.pin);
    try{await createProfile(v.name,'user',hash);closeOverlay();if(current&&current.tab==='owner')refreshScreen();else go('users');toast('User added ✓');}
    catch(e){toast('Error — PIN may be in use');}
  });
}
async function removeUser(id){if(!confirm('Remove this user and all their data?'))return;await deleteProfile(id);refreshScreen();toast('Removed');}
function resetUserPin(id){
  if(!confirm('Reset this person\u2019s PIN?\n\nThey\u2019ll get a one-time temporary code, then set their own private PIN on next login \u2014 which you won\u2019t see.'))return;
  (async function(){
    var temp=String(Math.floor(1000+Math.random()*9000));
    try{
      var hash=await sha256hex(temp);
      await ownerResetPin(id,hash);
      await markPinReset(id);
      alert('Temporary PIN: '+temp+'\n\nGive this to them. On their next login they\u2019ll be asked to set their own private PIN \u2014 you won\u2019t be able to see it, and this code stops working once they do.');
      toast('PIN reset \u2713');
    }catch(e){toast('Couldn\u2019t reset \u2014 '+((e&&e.message)||'check the forge_owner_set_pin function exists'));}
  })();
}

var _shWeek=null; // Monday ISO of the visible week
function shMonday(d){d=d?new Date(d):new Date();var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());var wd=(x.getDay()+6)%7;x.setDate(x.getDate()-wd);return x;}
function shWeekISO(){if(_shWeek)return _shWeek;_shWeek=calISO(shMonday());return _shWeek;}
function shShiftWeek(n){var x=new Date(shWeekISO()+'T00:00:00');x.setDate(x.getDate()+7*n);_shWeek=calISO(x);refreshScreen();}
function shThisWeek(){_shWeek=calISO(shMonday());refreshScreen();}
function shHours(st,en){if(!st||!en)return 0;var p=function(s){var m=s.split(':');return (+m[0])+(+m[1])/60;};var a=p(st),b=p(en);if(b<=a)b+=24;return Math.round((b-a)*100)/100;}
async function renderShifts(){
  var prof=await getShiftProfile();
  if(!prof){
    return '<div class="stack"><div class="card" style="text-align:center;padding:30px 20px">'+
      '<div style="font-size:44px;margin-bottom:12px">🗓️</div>'+

      '<div class="rs" style="margin-top:10px;line-height:1.55">A few quick questions about your job, then each week you just tap in your hours \u2014 Mon to Sun, blank means not working. Everything lands on your calendar automatically.</div>'+
      '<button class="btn btn-primary" style="width:100%;margin-top:20px" onclick="shSetup()">'+icon('spark',16,2.2)+' Start</button></div></div>';
  }
  var mon=shWeekISO();
  var monD=new Date(mon+'T00:00:00');var sunD=new Date(monD);sunD.setDate(sunD.getDate()+6);
  var sun=calISO(sunD);
  var wk=await getShifts(mon,sun);
  var byDay={};wk.forEach(function(s){if(!byDay[s.day])byDay[s.day]=s;});
  var todayISO=calISO(new Date());
  var isThisWeek=mon===calISO(shMonday());
  var lbl=monD.toLocaleDateString(undefined,{day:'numeric',month:'short'})+' \u2013 '+sunD.toLocaleDateString(undefined,{day:'numeric',month:'short'});

async function shTime(iso,which,val){

  var wk=await getShifts(mon,calISO(sunD));

  var inputs=document.querySelectorAll('.sh-row input');

  }else if(row){
    await updateShiftDB(row.id,{label:label,start:st||null,end:en||null,note:row.note});

}

function bwzHandleFile(ev){
  var file=ev.target.files&&ev.target.files[0];if(!file)return;
  var reader=new FileReader();
  reader.onload=function(e){try{var parsed=bwzParseCSV(e.target.result);_bwz.answers.csv_result=parsed;_bwz.answers.csv_raw=parsed.sample;renderBwz();toast('Read '+parsed.count+' transactions ✓');}catch(err){toast('Could not read that CSV — try another export');}};
  reader.readAsText(file);
}
function bwzParseCSV(text){
  var lines=text.split(/\r?\n/).filter(function(l){return l.trim();});
  if(!lines.length)throw new Error('empty');
  // detect delimiter
  var delim=(lines[0].indexOf(';')>lines[0].indexOf(','))?';':',';
  function splitLine(l){var out=[],cur='',q=false;for(var i=0;i<l.length;i++){var ch=l[i];if(ch==='"'){q=!q;}else if(ch===delim&&!q){out.push(cur);cur='';}else cur+=ch;}out.push(cur);return out.map(function(s){return s.trim().replace(/^"|"$/g,'');});}
  // Parse a money string handling both 1,234.56 (en) and 1.234,56 (eu) and -30,00
  function num(s){if(s==null)return 0;s=String(s).replace(/[^0-9.,\-]/g,'');if(!s)return 0;
    var lastC=s.lastIndexOf(','),lastD=s.lastIndexOf('.');
    if(lastC>lastD){s=s.replace(/\./g,'').replace(',','.');}    // european: comma is decimal
    else{s=s.replace(/,/g,'');}                                  // english: comma is thousands
    var n=parseFloat(s);return isNaN(n)?0:n;}
  var header=splitLine(lines[0]).map(function(h){return h.toLowerCase();});
  var amtIdx=-1,descIdx=-1,dateIdx=-1,debitIdx=-1,creditIdx=-1;
  header.forEach(function(h,i){
    if(amtIdx<0&&/amount|value|amt/.test(h))amtIdx=i;
    if(debitIdx<0&&/debit|paid out|money out|withdrawal/.test(h))debitIdx=i;
    if(creditIdx<0&&/credit|paid in|money in|deposit/.test(h))creditIdx=i;
    if(descIdx<0&&/desc|narrative|detail|reference|payee|merchant|name|transaction/.test(h))descIdx=i;
    if(dateIdx<0&&/date/.test(h))dateIdx=i;
  });
  if(descIdx<0)descIdx=header.length>1?1:0;
  var cats={};var total=0,count=0,sample=[];
  for(var r=1;r<lines.length;r++){
    var cols=splitLine(lines[r]);if(cols.length<2)continue;
    var amt=0;
    if(debitIdx>=0&&cols[debitIdx]){amt=Math.abs(num(cols[debitIdx]));}
    else if(amtIdx>=0&&cols[amtIdx]){var raw=num(cols[amtIdx]);amt=raw<0?Math.abs(raw):0;} // signed: spending = negative
    if(!amt)continue;
    var desc=(cols[descIdx]||'').toString();
    var cat=bwzCategorise(desc);
    cats[cat]=(cats[cat]||0)+amt;total+=amt;count++;
    if(sample.length<40)sample.push({d:desc.slice(0,40),a:amt,c:cat});
  }
  // if nothing classed as spending (maybe all positive amounts), retry treating all as spend
  if(count===0&&amtIdx>=0){
    for(var r2=1;r2<lines.length;r2++){var cols2=splitLine(lines[r2]);if(cols2.length<2)continue;var amt2=Math.abs(num(cols2[amtIdx]));if(!amt2)continue;var desc2=(cols2[descIdx]||'').toString();var cat2=bwzCategorise(desc2);cats[cat2]=(cats[cat2]||0)+amt2;total+=amt2;count++;if(sample.length<40)sample.push({d:desc2.slice(0,40),a:amt2,c:cat2});}
  }
  return {count:count,total:total,cats:cats,sample:sample};
}
function bwzCategorise(desc){
  var d=desc.toLowerCase();
  var rules=[
    ['Groceries',/tesco|sainsbury|asda|aldi|lidl|morrison|waitrose|co-?op|grocery|supermarket|woolworths|coles|whole ?foods|trader joe/],
    ['Subscriptions',/netflix|spotify|disney|prime video|youtube|apple\.com|icloud|hulu|hbo|paramount|audible|patreon|substack|adobe|microsoft 365/],
    ['Eating out',/mcdonald|kfc|burger|pizza|nando|greggs|costa|starbucks|cafe|coffee|restaurant|deliveroo|uber ?eats|just ?eat|takeaway|domino|subway|pret/],
    ['Transport',/uber|lyft|taxi|fuel|petrol|shell|\bbp\b|esso|texaco|parking|train|railway|\btfl\b|\bbus\b|gas station|metro line|congestion/],
    ['Shopping',/amazon|ebay|asos|zara|h&m|primark|next retail|argos|boots|superdrug|ikea|target|walmart|best buy/],
    ['Bills',/electric|british gas|water bill|council|energy|edf|e\.?on|octopus|utility|broadband|internet|virgin media|sky digital|\bbt\b|vodafone|\bo2\b|three mobile|\bee\b/],
    ['Health',/pharmacy|doctor|dental|gym|fitness|pure ?gym|nuffield|optician|chemist/],
    ['Going out',/\bpub\b|\bbar\b|brewery|wine|beer|spirits|nightclub|\bclub\b|liquor|bottle shop/],
    ['Housing',/\brent\b|mortgage|landlord|letting/],
    ['Cash',/\bcash\b|\batm\b|withdrawal/],
    ['Insurance',/insurance|aviva|\baxa\b|admiral|direct line/]
  ];
  for(var i=0;i<rules.length;i++)if(rules[i][1].test(d))return rules[i][0];
  return 'Other';
}

// Inline planned editing — tap the pill, type, done. No modal.
function budPlanEdit(ev,catId,cur){
  ev.stopPropagation();
  var btn=ev.currentTarget;if(!btn||btn._editing)return;btn._editing=true;
  var inp=document.createElement('input');
  inp.className='bud-plan-in';inp.inputMode='decimal';inp.autocomplete='off';
  inp.value=cur?String(cur):'';inp.placeholder='0';
  inp.onclick=function(e){e.stopPropagation();};
  btn.replaceWith(inp);
  inp.focus();try{inp.select();}catch(e){}
  var done=false;
  async function commit(save){
    if(done)return;done=true;
    var v=parseFloat(inp.value);
    if(save&&!isNaN(v)&&v>=0&&v!==cur){
      var ok=await budSetAssign(budCurMonth(),catId,v);
      if(ok!==false){toast('Planned '+money(v)+' \u2713');await refreshScreen();return;}
    }
    await refreshScreen();
  }
  inp.addEventListener('keydown',function(e){
    if(e.key==='Enter'){e.preventDefault();inp.blur();}
    else if(e.key==='Escape'){done=true;refreshScreen();}
  });
  inp.addEventListener('blur',function(){commit(true);});
}

function accBalEdit(ev,id,cur,accCur){
  ev.stopPropagation();
  var btn=ev.currentTarget;if(!btn||btn._editing)return;btn._editing=true;
  var inp=document.createElement('input');
  inp.className='acc-bal-in';inp.inputMode='decimal';inp.autocomplete='off';inp.value=String(cur);
  inp.onclick=function(e){e.stopPropagation();};
  btn.replaceWith(inp);inp.focus();try{inp.select();}catch(e){}
  var done=false;
  async function commit(){
    if(done)return;done=true;
    var v=parseFloat(inp.value);
    if(isNaN(v)||v===cur){await refreshScreen();return;}
    await setAccountBalance(id,v);
    var diff=Math.round((cur-v)*100)/100;
    if(diff>0){ await refreshScreen(); accLogSpendPrompt(diff,accCur); }   // balance dropped → log where it went
    else { await refreshScreen(); toast('Updated \u2713'); }
  }
  inp.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();inp.blur();}else if(e.key==='Escape'){done=true;refreshScreen();}});
  inp.addEventListener('blur',commit);
}

// ----- helpers -----
function cdContrast(hex){try{var h=hex.replace('#','');if(h.length===3)h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];var r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16);return (0.299*r+0.587*g+0.114*b)>150?'#16202E':'#FFFFFF';}catch(e){return '#FFFFFF';}}
function cdShade(hex,amt){try{var h=hex.replace('#','');if(h.length===3)h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];var r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16);r=Math.max(0,Math.min(255,Math.round(r+amt)));g=Math.max(0,Math.min(255,Math.round(g+amt)));b=Math.max(0,Math.min(255,Math.round(b+amt)));return '#'+[r,g,b].map(function(x){return ('0'+x.toString(16)).slice(-2);}).join('');}catch(e){return hex;}}
function cdDaysTo(c){var iso=c.d+'T'+((c.time||'00:00'))+':00';var t=new Date(iso);if(isNaN(t.getTime()))t=new Date(c.d+'T00:00:00');var today=new Date();today.setHours(0,0,0,0);var td=new Date(c.d+'T00:00:00');return Math.round((td-today)/86400000);}
function cdFullDate(c){var t=new Date(c.d+'T00:00:00');if(isNaN(t.getTime()))return c.d||'';var s=t.toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short',year:'numeric'});if(c.time)s+=', '+c.time;return s;}
function cdListHTML(a,filter){
  var future=[],past=[];
  a.forEach(function(c){(cdDaysTo(c)>=0?future:past).push(c);});
  future.sort(function(x,y){return cdDaysTo(x)-cdDaysTo(y);});
  past.sort(function(x,y){return cdDaysTo(y)-cdDaysTo(x);}); // most recent past first
  var show=filter==='past'?past:filter==='future'?future:future.concat(past);
  var filterBar='<div class="cd-filter">'+
    [['all','All'],['future','Upcoming'],['past','Past']].map(function(f){return '<button class="cd-chip'+(filter===f[0]?' on':'')+'" onclick="cdSetFilter(\''+f[0]+'\')">'+f[1]+'</button>';}).join('')+'</div>';
  var rows=show.map(function(c){
    var d=cdDaysTo(c);var isPast=d<0;var n=Math.abs(d);
    var fg=cdContrast(c.color);var numBg=cdShade(c.color,fg==='#FFFFFF'?-26:26);
    var numTxt=cdContrast(numBg);
    var big=d===0?'0':n;
    var lbl=d===0?'today':isPast?('day'+(n!==1?'s':'')+' ago'):('day'+(n!==1?'s':'')+' to go');
    return '<div class="cd-row" style="background:'+c.color+';color:'+fg+'" onclick="cdOpenDetail(\''+c.id+'\')">'+
      '<div class="cd-row-main">'+
        '<div class="cd-emoji">'+esc(c.icon||'⏳')+'</div>'+
        '<div class="cd-txt"><div class="cd-name">'+esc(c.n||'Untitled')+'</div>'+
          (c.sub?'<div class="cd-sub">'+esc(c.sub)+'</div>':'')+
          '<div class="cd-date">'+icon('clock',13,2.2)+esc(cdFullDate(c))+'</div>'+
        '</div>'+
      '</div>'+
      '<div class="cd-num" style="background:'+numBg+';color:'+numTxt+'"><div class="cd-num-big">'+big+'</div><div class="cd-num-lbl">'+lbl+'</div></div>'+
    '</div>';
  }).join('');
  if(!show.length)rows='<div class="card"><div class="row"><div class="rs">'+(filter==='past'?'No past events.':'No countdowns yet — add your first below.')+'</div></div></div>';
  var counter='<div class="cd-count"><span>Past<b>'+past.length+'</b></span><span>Upcoming<b>'+future.length+'</b></span></div>';
  return '<div class="stack">'+filterBar+'<div class="cd-list">'+rows+'</div>'+counter+'<button class="reqbtn" onclick="cdOpenEditor()">'+icon('plus',16)+' Add a countdown</button></div>';
}
function cdSetFilter(f){
  window._cdFilter=f;
  // Instant: re-render only the countdown stack from cached data — no network, no full refresh.
  if(_cdCache&&current&&current.el){
    var stackHost=current.el.querySelector('.stack');
    if(stackHost){
      var tmp=document.createElement('div');tmp.innerHTML=cdListHTML(_cdCache,f);
      var fresh=tmp.firstElementChild;
      if(fresh){stackHost.replaceWith(fresh);return;}
    }
  }
  refreshScreen();
}

      '<div class="cd-ticker" id="cdTicker"></div>'+
    '</div>';
  document.getElementById('app').appendChild(el);
  // Edge-swipe-back: drag from the left edge to dismiss the detail (it lives outside #stage).
  (function(){
    var sx=0,sy=0,dec=false,drag=false;
    el.addEventListener('touchstart',function(e){var t=e.touches[0];if(t.clientX>36)return;sx=t.clientX;sy=t.clientY;dec=false;drag=false;},{passive:true});
    el.addEventListener('touchmove',function(e){var t=e.touches[0];var dx=t.clientX-sx,dy=t.clientY-sy;if(!dec){if(Math.abs(dx)<6&&Math.abs(dy)<6)return;if(Math.abs(dy)>Math.abs(dx)){return;}dec=true;drag=true;el.style.transition='none';}if(!drag)return;if(e.cancelable)e.preventDefault();dx=Math.max(0,dx);el.style.transform='translateX('+dx+'px)';el.style.opacity=String(1-Math.min(1,dx/(window.innerWidth||360))*0.4);},{passive:false});
    el.addEventListener('touchend',function(e){if(!drag)return;var t=e.changedTouches[0];var dx=Math.max(0,t.clientX-sx);var W=window.innerWidth||360;if(dx>W*0.30){el.style.transition='transform .26s cubic-bezier(.4,0,.2,1),opacity .26s ease';el.style.transform='translateX(100%)';el.style.opacity='0';setTimeout(cdCloseDetail,240);}else{el.style.transition='transform .26s cubic-bezier(.4,0,.2,1),opacity .26s ease';el.style.transform='';el.style.opacity='';}drag=false;dec=false;});
  })();
  var targetISO=c.d+'T'+((c.time||'00:00'))+':00';
  function tick(){
    var now=new Date();var target=new Date(targetISO);if(isNaN(target.getTime()))target=new Date(c.d+'T00:00:00');
    var diff=Math.abs(target-now);var past=target<now;
    var dd=Math.floor(diff/86400000),hh=Math.floor(diff%86400000/3600000),mm=Math.floor(diff%3600000/60000),ss=Math.floor(diff%60000/1000);
    var t=document.getElementById('cdTicker');if(!t)return;
    var cells=[[dd,'days'],[hh,'hrs'],[mm,'mins'],[ss,'secs']];

  }
  tick();if(_cdTimer)clearInterval(_cdTimer);_cdTimer=setInterval(tick,1000);
}

function upToday(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}
function upAddDays(n){var d=new Date();d.setDate(d.getDate()+(parseInt(n,10)||0));return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}
function upDays(s){if(!s||!/^\d{4}-\d{2}-\d{2}$/.test(s))return null;return Math.ceil((new Date(s+'T00:00:00')-new Date(upToday()+'T00:00:00'))/86400000);}
function upBadge(next){var d=upDays(next);if(d===null)return '';var st,tx;if(d<0){st='background:color-mix(in srgb,var(--danger) 16%,transparent);color:var(--danger)';tx='overdue';}else if(d===0){st='background:rgba(245,158,11,.18);color:#B45309';tx='today';}else if(d<=14){st='background:rgba(245,158,11,.14);color:#B45309';tx=d+'d';}else{st='';tx=d+'d';}return '<div class="badge"'+(st?(' style="'+st+'"'):'')+'>'+tx+'</div>';}
function upNext(a){if(!a.tasks||!a.tasks.length)return null;var s=a.tasks.filter(function(t){return t.next;}).sort(function(x,y){return x.next<y.next?-1:1;});return s[0]||null;}
function upCatIcon(c){return ({appliance:'home',vehicle:'car',home:'home',document:'file',subscription:'wallet'})[c]||'work';}

async function getUpkeep(){
  if(!currentUser)return[];
  var ck='forge.cache.upkeep.'+currentUser.id;
  try{
    var r=await sb.from('upkeep').select('*').eq('user_id',currentUser.id).order('created_at');
    if(r.error)throw r.error;
    var arr=(r.data||[]).map(function(x){return {id:x.id,name:x.name,brand:x.brand||'',category:x.category||'other',purchased:x.purchased||'',tasks:(typeof x.tasks==='string'?JSON.parse(x.tasks||'[]'):(x.tasks||[]))};});
    lsSet(ck,JSON.stringify(arr));return arr;
  }catch(e){var raw=lsGet(ck);if(raw){try{return JSON.parse(raw);}catch(_){}}throw e;}
}
async function saveUpkeepItem(o){var r=await sb.from('upkeep').insert({user_id:currentUser.id,name:o.name,brand:o.brand||'',category:o.category||'other',purchased:o.purchased||'',tasks:JSON.stringify(o.tasks||[])});if(r.error)throw r.error;lsDel('forge.cache.upkeep.'+currentUser.id);}
async function updateUpkeepTasks(id,tasks){var r=await sb.from('upkeep').update({tasks:JSON.stringify(tasks)}).eq('id',id);if(r.error)throw r.error;lsDel('forge.cache.upkeep.'+currentUser.id);}
async function deleteUpkeepItem(id){var r=await sb.from('upkeep').delete().eq('id',id);if(r.error)throw r.error;lsDel('forge.cache.upkeep.'+currentUser.id);}

function upkeepAdd(){
  openForm('Add to Upkeep','Name an appliance, vehicle, document or renewal \u2014 the coach sorts the schedule.',[{key:'q',label:'e.g. Bosch Series 6 washing machine'}],async function(v){
    var q=(v.q||'').trim();if(!q)return;closeOverlay();toast('Reading the manual\u2026');
    var sys='You are the scheduling brain of a home-upkeep app. The user names ONE thing they own: an appliance, vehicle, home system, document, warranty or subscription. Reply with ONLY a JSON object, no prose:\n{"name":"short name","brand":"brand/model or empty","category":"appliance|vehicle|home|document|subscription|other","purchased":"YYYY-MM or empty","tasks":[{"name":"short task","every_days":0,"first_due_days":0,"note":"short tip"}]}\nevery_days = recurrence in days (0 for a one-off). first_due_days = days from today until first due. Use realistic schedules: washing machine -> clean lint/pump filter 30, hot maintenance wash 60, wipe door seal 90, descale 180; fridge -> water filter 180, condenser coils 365; dishwasher -> filter 30, descale 180; boiler/furnace -> service 365; vehicle -> service 365, tyre check 90. For a document/warranty/passport/visa with an expiry date the user gives, make ONE task "Renew before it expires", every_days 0, first_due_days = days-until-expiry minus 45. 2 to 5 tasks max, names under 5 words.';
    try{
      var ans=await askAI([{role:'user',content:q}],sys,500);
      var jm=ans.match(/\{[\s\S]*\}/);if(!jm)throw new Error('no json');
      var o=JSON.parse(jm[0]);
      var tasks=(o.tasks||[]).slice(0,6).map(function(t,i){var ev=parseInt(t.every_days,10)||0;var fd=parseInt(t.first_due_days,10);if(isNaN(fd))fd=ev||30;return {id:'t'+Date.now()+i,name:String(t.name||'Maintain'),every:ev,next:upAddDays(Math.max(0,fd)),last:null,note:String(t.note||'')};});
      if(!tasks.length)tasks=[{id:'t'+Date.now(),name:'Check / service',every:180,next:upAddDays(180),last:null,note:''}];
      await saveUpkeepItem({name:o.name||q,brand:o.brand||'',category:o.category||'other',purchased:o.purchased||'',tasks:tasks});
      toast('Added \u2014 '+tasks.length+' reminder'+(tasks.length>1?'s':'')+' set \u2713');await refreshScreen();
    }catch(e){toast('Couldn\u2019t set that up \u2014 try naming it more specifically');}
  });
}
async function upkeepDone(assetId,taskId){
  var list;try{list=await getUpkeep();}catch(e){return;}
  var a=null;for(var i=0;i<list.length;i++)if(list[i].id===assetId)a=list[i];if(!a)return;
  var keep=[];(a.tasks||[]).forEach(function(t){if(t.id===taskId){t.last=upToday();if(t.every>0){t.next=upAddDays(t.every);keep.push(t);}}else{keep.push(t);}});
  try{await updateUpkeepTasks(assetId,keep);toast('Nice \u2014 next one\u2019s set \u2713');await refreshScreen();}catch(e){toast('Could not save');}
}
async function upkeepRemove(id){
  var list;try{list=await getUpkeep();}catch(e){return;}
  var a=null;for(var i=0;i<list.length;i++)if(list[i].id===id)a=list[i];var nm=a?a.name:'this';
  var o=document.createElement('div');o.className='overlay';o.id='ovl';
  o.innerHTML='<div class="sheet" onclick="event.stopPropagation()"><h3>Remove '+esc(nm)+'?</h3><p>This stops tracking it and clears its reminders.</p><div class="btnrow"><button class="btn btn-ghost" onclick="closeOverlay()">Cancel</button><button class="btn btn-primary" id="upkRmGo" style="background:var(--danger)">Remove</button></div></div>';
  o.onclick=closeOverlay;document.getElementById('app').appendChild(o);
  document.getElementById('upkRmGo').onclick=async function(){closeOverlay();try{await deleteUpkeepItem(id);toast('Removed');await refreshScreen();}catch(e){toast('Could not remove');}};
}

// FORGE BRAIN — one engine that reads every tab, finds cross-tab
// connections deterministically, and feeds Home, cards AND the AI.

var _brainCache={t:0,snap:null,ins:null};
function _bDay(s){var d=new Date(s+'T00:00:00');return isNaN(d.getTime())?null:d;}
function _bDaysFromToday(s){var d=_bDay(s);if(!d)return null;var t=new Date();t.setHours(0,0,0,0);return Math.round((d-t)/86400000);}
// Gather a single structured snapshot of the user's world (reuses existing getters).
async function brainSnapshot(force){
  if(!force&&Date.now()-_brainCache.t<30000&&_brainCache.snap)return _brainCache.snap;
  var en=(typeof enabledTabs==='function')?enabledTabs():[];
  var has=function(t){return en.indexOf(t)>=0;};
  var s={today:new Date(),en:en};
  var jobs=[
    ['cds',getCountdowns()],['meals',getMeals()],['car',getCar()],
    ['work',has('work')?loadItems('work'):Promise.resolve([])],
    ['reminders',has('reminders')?loadItems('reminders'):Promise.resolve([])],
    ['shopping',has('shopping')?loadItems('shopping'):Promise.resolve([])],
    ['habits',has('habits')?loadItems('habits'):Promise.resolve([])],
    ['goals',has('goals')?loadItems('goals'):Promise.resolve([])],
    ['subs',(has('subs')||has('fin_subs')||has('fin_overview'))?getSubs():Promise.resolve([])],
    ['mood',getTrackerLogs('mood',7)],['sleep',getTrackerLogs('sleep',7)],
    ['budget',getBudget()],['finGoals',getFinGoals()],['bal',getFinBalance()]
  ];
  var out=await Promise.all(jobs.map(function(j){return j[1].catch(function(){return null;});}));
  jobs.forEach(function(j,i){s[j[0]]=out[i];});
  // events for the next 7 days (calendar) — guarded, optional
  try{var t2=new Date();t2.setDate(t2.getDate()+7);s.events=await getEvents(localDay(),t2.getFullYear()+'-'+('0'+(t2.getMonth()+1)).slice(-2)+'-'+('0'+t2.getDate()).slice(-2));}catch(e){s.events=[];}
  _brainCache.snap=s;_brainCache.t=Date.now();_brainCache.ins=null;
  return s;
}
// Deterministic insight rules → ranked [{id,icon,sev,text,tab,act}]
// sev: 2=urgent, 1=useful, 0=fyi. act optional: {label,fn}
function brainComputeInsights(s){
  var ins=[],dn=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][new Date().getDay()];
  // 1) Meal planned but ingredients likely not on the shopping list
  try{
    var dinner=s.meals&&s.meals[dn]&&s.meals[dn].d;
    if(dinner){
      var shopText=(s.shopping||[]).map(function(x){return (x.t||'').toLowerCase();}).join(' ');
      var words=dinner.toLowerCase().split(/[^a-z]+/).filter(function(w){return w.length>3;});
      var anyOnList=words.some(function(w){return shopText.indexOf(w)>=0;});
      if((s.shopping||[]).length===0||!anyOnList)
        ins.push({id:'meal-shop',icon:'cart',sev:1,text:'Tonight\u2019s dinner is "'+dinner+'" but the ingredients aren\u2019t on your shopping list.',tab:'shopping',act:{label:'Plan ingredients',fn:function(){aiQuickText('Add the ingredients for '+dinner+' to my shopping list');}}});
    }
  }catch(e){}
  // 2) Countdown imminent (<=3 days) with a possibly-related open task
  try{
    (s.cds||[]).forEach(function(c){
      var d=_bDaysFromToday(c.d);if(d===null||d<0||d>3)return;
      var nm=(c.n||'').toLowerCase();
      var rel=(s.work||[]).find(function(t){var tt=(t.t||'').toLowerCase();return nm&&tt&&(tt.indexOf(nm.split(' ')[0])>=0);});
      var when=d===0?'today':d===1?'tomorrow':'in '+d+' days';
      ins.push({id:'cd-'+c.id,icon:'clock',sev:d<=1?2:1,text:'"'+c.n+'" is '+when+'.'+(rel?' Related task still open: '+rel.t+'.':''),tab:'countdown'});
    });
  }catch(e){}
  // 3) Car date passed or within 21 days
  try{
    [['rego','Rego'],['insurance','Insurance'],['service','Service']].forEach(function(p){
      var v=s.car&&s.car[p[0]];if(!v)return;var d=_bDaysFromToday(v);if(d===null)return;
      if(d<0)ins.push({id:'car-'+p[0],icon:'car',sev:2,text:p[1]+' was due '+(-d)+' day'+(-d!==1?'s':'')+' ago ('+v+').',tab:'car'});
      else if(d<=21)ins.push({id:'car-'+p[0],icon:'car',sev:1,text:p[1]+' due in '+d+' day'+(d!==1?'s':'')+' ('+v+').',tab:'car'});
    });
  }catch(e){}
  // 4) Calendar event today/tomorrow
  try{
    (s.events||[]).forEach(function(e){
      var d=_bDaysFromToday(e.date);if(d===null||d<0||d>1)return;
      ins.push({id:'ev-'+e.id,icon:'calendar',sev:d===0?1:0,text:(d===0?'Today':'Tomorrow')+': '+e.title+(e.start?' at '+e.start:''),tab:'calendar'});
    });
  }catch(e){}
  // 5) Budget over/near limit
  try{
    (s.budget||[]).forEach(function(b){
      if(!b.limit)return;var pct=b.spent/b.limit;
      if(pct>=1)ins.push({id:'bud-'+b.id,icon:'wallet',sev:1,text:b.n+' budget is over: '+money(b.spent)+' of '+money(b.limit)+'.',tab:'fin_budget'});
      else if(pct>=0.85)ins.push({id:'bud-'+b.id,icon:'wallet',sev:0,text:b.n+' budget '+Math.round(pct*100)+'% used ('+money(b.spent)+'/'+money(b.limit)+').',tab:'fin_budget'});
    });
  }catch(e){}
  // 6) Low mood today → gentle nudge (well-being, never clinical)
  try{
    var m0=(s.mood||[])[0];
    if(m0&&m0.day===localDay()&&m0.value<=3)
      ins.push({id:'mood-low',icon:'spark',sev:1,text:'You logged a low mood today. Be kind to yourself \u2014 maybe ease the load where you can.',tab:'health'});
  }catch(e){}
  // 7) Short sleep last night
  try{
    var sl0=(s.sleep||[])[0];
    if(sl0&&sl0.day===localDay()&&sl0.value&&sl0.value<6)
      ins.push({id:'sleep-low',icon:'spark',sev:0,text:'Only '+sl0.value+'h sleep last night \u2014 worth a lighter day if you can.',tab:'health'});
  }catch(e){}
  // 8) Overdue tasks (due date in past)
  try{
    var od=(s.work||[]).filter(function(t){return t.due&&_bDaysFromToday(t.due)<0&&!t.done;});

document.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&['+','-','=','0'].indexOf(e.key)>=0)e.preventDefault();});

// ============================================================
// BOOT (tasks #13, #16, #18) — intro → PIN/invite, no flash
// ============================================================
(function(){
  sizeApp();
  var fromInvite=/(?:[?&#])invite/.test(location.search+location.hash);
  // Build the home screen UNDER the intro so there's no flash when intro lifts.
  // But we must NOT show home until authed — so we only mount the intro now,
  // and reveal PIN exactly as the intro lifts (fixes glitch #13).
  // Resolve auth IMMEDIATELY so the network round-trip overlaps the ~1.65s splash
  // animation instead of stalling on a frozen splash after it finishes. Returns a
  // descriptor of which screen to show; the splash lifts once it's ready.
  var authReady=(async function(){
    try{
      if(/type=recovery/.test(location.hash)) return {act:'reset'};
      var sres=await sb.auth.getSession();
      var session=sres&&sres.data&&sres.data.session;
      if(session){
        var prof=await resolveProfile();
        if(prof){ currentUser={id:prof.id,name:prof.name,role:prof.role,avatar_url:prof.avatar_url};
          return {act: lsGet(pinKey(prof.id))?'pin':'setpin'}; }
        return {act:'login'};
      }
      return {act: fromInvite?'signup':'login'};
    }catch(e){ return {act:'login'}; }
  })();
  // Anti-hang insurance: if the network never answers, don't freeze the splash forever.
  var authOrTimeout=Promise.race([authReady, new Promise(function(r){setTimeout(function(){r({act:'login'});},9000);})]);

  setTimeout(async function(){
    var intro=document.getElementById('intro');
    var r; try{ r=await authOrTimeout; }catch(e){ r={act:'login'}; }
    switch(r&&r.act){
      case 'reset':  showResetPassword(); break;
      case 'pin':    showPinUnlock();     break;
      case 'setpin': showSetPin(false);   break;
      case 'signup': showAuthSignup();    break;
      default:       showAuthLogin();
    }
    try{document.documentElement.style.background='#F3F5F8';document.body.style.background='#F3F5F8';}catch(e){}
    intro.classList.add('hide');
    setTimeout(function(){if(intro&&intro.parentNode)intro.parentNode.removeChild(intro);},720);
  },1650); // splash: icon settles, wordmark rises, lifts — auth resolved in parallel above
})();

(function(){
  var vv=window.visualViewport;
  function intoView(el){if(!el)return;try{el.scrollIntoView({block:'nearest'});}catch(_){}}
  document.addEventListener('focusin',function(e){var t=e.target;if(t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA')){if(t.closest&&(t.closest('.sheet')||t.closest('.ai-bar')))return;setTimeout(function(){intoView(t);},320);}});
  if(vv){var apply=function(){
    var ot=Math.max(0,vv.offsetTop||0);
    var kb=Math.max(0,Math.round(window.innerHeight-vv.height-ot));
    document.documentElement.style.setProperty('--kb',kb+'px');sizeApp();
    var open=kb>60;var lift=open?('translateY(-'+kb+'px)'):'';
    var sh=document.querySelector('.overlay .sheet');
    if(sh){
      sh.style.transition='transform .24s cubic-bezier(.2,.85,.25,1),max-height .24s ease';
      sh.style.transform=lift;
      sh.style.maxHeight=open?((vv.height-16)+'px'):'';
      if(open){var ae=document.activeElement;if(ae&&sh.contains(ae))setTimeout(function(){try{var r=ae.getBoundingClientRect(),sr=sh.getBoundingClientRect();if(r.top<sr.top+10||r.bottom>sr.bottom-10)sh.scrollTop+=(r.top-sr.top)-16;}catch(_){}},90);}
    }
    var bar=document.querySelector('.ai-bar');
    if(bar){bar.style.transition='transform .24s ease';bar.style.transform=lift;}
    if(!open&&window.pageYOffset)window.scrollTo(0,0);
  };vv.addEventListener('resize',apply);vv.addEventListener('scroll',apply);}
})();
</script>
</body>
</html>
