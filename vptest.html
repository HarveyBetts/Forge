<!doctype html><html><head>
<meta charset="utf8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#FF8800">
<link rel="manifest" href="data:application/manifest+json;base64,eyJuYW1lIjogIlZQVGVzdCIsICJzaG9ydF9uYW1lIjogIlZQVGVzdCIsICJzdGFydF91cmwiOiAiLiIsICJzY29wZSI6ICIuIiwgImRpc3BsYXkiOiAic3RhbmRhbG9uZSIsICJvcmllbnRhdGlvbiI6ICJwb3J0cmFpdCIsICJiYWNrZ3JvdW5kX2NvbG9yIjogIiNGRjg4MDAiLCAidGhlbWVfY29sb3IiOiAiI0ZGODgwMCJ9">
<title>VP test</title>
<style>
  html{background:#E11D48;height:100%;}            /* RED  = html background */
  body{background:#2563EB;margin:0;height:100%;}   /* BLUE = body background */
  #app{position:fixed;top:0;left:0;right:0;height:100vh;background:#0A0F20;color:#fff;
       font-family:ui-monospace,Menlo,monospace;overflow:hidden;}
  .mark{position:fixed;left:0;right:0;height:6px;z-index:5;}
  .m_vh {top:calc(100vh - 6px);  background:#22C55E;}   /* GREEN  = bottom of 100vh  */
  .m_dvh{top:calc(100dvh - 6px); background:#A855F7;}   /* PURPLE = bottom of 100dvh */
  .m_fix{bottom:0;               background:#FACC15;}   /* YELLOW = position:fixed bottom:0 */
  #info{position:relative;z-index:9;padding:64px 18px 18px;font-size:13px;line-height:1.85;}
  b{color:#7DD3FC;}
  .key{margin-top:14px;font-size:11px;color:#94A3B8;line-height:1.7}
</style></head>
<body>
<div id="app">
  <div id="info">measuring...</div>
  <div class="mark m_vh"></div>
  <div class="mark m_dvh"></div>
  <div class="mark m_fix"></div>
</div>
<script>
function px(n){return Math.round(n);}
function upd(){
  var de=document.documentElement, vv=window.visualViewport;
  var probe=document.createElement('div');
  probe.style.cssText='position:fixed;bottom:0;left:0;height:env(safe-area-inset-bottom);width:1px;';
  document.body.appendChild(probe);
  var sab=probe.getBoundingClientRect().height; probe.remove();
  var app=document.getElementById('app').getBoundingClientRect();
  var standalone=(navigator.standalone===true)||matchMedia('(display-mode: standalone)').matches;
  document.getElementById('info').innerHTML=
    'standalone (home-screen app): <b>'+standalone+'</b><br>'+
    'window.innerHeight: <b>'+window.innerHeight+'</b><br>'+
    'screen.height: <b>'+screen.height+'</b><br>'+
    'documentElement.clientHeight: <b>'+de.clientHeight+'</b><br>'+
    'visualViewport.height: <b>'+(vv?px(vv.height):'n/a')+'</b><br>'+
    'safe-area-inset-bottom: <b>'+px(sab)+'</b><br>'+
    '#app rect bottom: <b>'+px(app.bottom)+'</b><br>'+
    '#app rect height: <b>'+px(app.height)+'</b><br>'+
    'devicePixelRatio: <b>'+window.devicePixelRatio+'</b>'+
    '<div class="key">GREEN line = bottom of 100vh<br>PURPLE line = bottom of 100dvh<br>'+
    'YELLOW line = fixed bottom:0<br>'+
    'If a strip shows under the dark box: RED=html bg, BLUE=body bg, ORANGE=manifest bg.</div>';
}
upd(); window.addEventListener('resize',upd);
if(window.visualViewport)window.visualViewport.addEventListener('resize',upd);
setInterval(upd,800);
</script>
</body></html>
